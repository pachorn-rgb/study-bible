<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Study Bible</title>
<meta name="description" content="Phat's medical study library.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0D11" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Study Bible">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="design/sb.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<script src="app.js" defer></script>
<style>
/* Layout: native-style app shell. Large titles, grouped lists, bottom tab bar, full-screen atlas viewer and review run. All sizes in rem so the font-size setting scales everything. */
:root{
  /* tokens come from design/sb.css; the shell only aliases them */
  --bg:var(--sb-bg); --surface:var(--sb-surface); --surface2:var(--sb-surface2); --ink:var(--sb-ink); --ink2:var(--sb-ink2); --muted:var(--sb-muted); --line:var(--sb-line);
  --accent:var(--sb-accent); --on-accent:var(--sb-on-accent); --good:var(--sb-good); --warn:var(--sb-warn); --bad:var(--sb-bad); --xp:var(--sb-xp);
  --shadow:var(--sb-shadow); --font:var(--sb-font); --mono:var(--sb-mono);
  --r:14px; --nav-h:3.75rem; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.reduce *{animation:none!important;transition:none!important}
.page{max-width:46rem;margin:0 auto;padding:calc(var(--sat) + .75rem) max(16px,env(safe-area-inset-right,0px)) calc(var(--nav-h) + var(--sab) + 2rem) max(16px,env(safe-area-inset-left,0px))}
.ic{width:1.35rem;height:1.35rem;flex:none}
.ic.s{width:1.1rem;height:1.1rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* headers */
.top{display:flex;align-items:center;gap:.5rem;min-height:2.75rem}
.top .sp{flex:1}
.ibtn{width:2.5rem;height:2.5rem;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);flex:none}
.back{display:inline-flex;align-items:center;gap:.15rem;color:var(--accent);font-weight:500;font-size:1.0625rem;margin-left:-.35rem;min-height:2.75rem}
.lt{font-size:2.125rem;line-height:1.15;font-weight:800;letter-spacing:-.02em;margin:.25rem 0 1rem}
.cap{font-size:.8125rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:1.75rem .25rem .5rem;display:flex;justify-content:space-between;align-items:baseline}
.cap a,.cap button{color:var(--accent);text-transform:none;letter-spacing:0;font-size:.875rem;font-weight:500}
/* grouped list */
.group{background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;min-height:3rem;position:relative;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:1rem;border-top:1px solid var(--line)}
.row.ind+.row.ind::before{left:3.75rem}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:500;line-height:1.3}
.row .tx span{display:block;font-size:.8125rem;color:var(--muted);line-height:1.35}
.row .val{color:var(--muted);font-size:.9375rem}
.chev{color:var(--muted);opacity:.6}
.sq{width:2rem;height:2rem;border-radius:.5rem;display:grid;place-items:center;flex:none;color:#fff;background:var(--c,var(--accent))}
.sq svg{width:1.2rem;height:1.2rem}
.foot{font-size:.8125rem;color:var(--muted);margin:.5rem 1rem 0;line-height:1.4}
/* controls */
.seg{display:flex;background:var(--surface2);border-radius:.6rem;padding:.15rem;gap:.15rem}
.seg button{flex:1;border-radius:.5rem;padding:.4rem .6rem;font-size:.875rem;font-weight:500;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sw{width:3.1rem;height:1.9rem;border-radius:1rem;background:var(--surface2);position:relative;flex:none;transition:background .2s;border:1px solid var(--line)}
.sw::after{content:"";position:absolute;top:.15rem;left:.15rem;width:1.5rem;height:1.5rem;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(1.2rem)}
.swatches{display:flex;gap:.6rem;flex-wrap:wrap}
.swatch{width:2rem;height:2rem;border-radius:50%;background:var(--s);position:relative}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--s)}
.inp{height:2.25rem;border-radius:.5rem;border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:0 .6rem;font:inherit;font-size:.9375rem;max-width:11rem}
.stack{display:flex;flex-direction:column;gap:.6rem;padding:.75rem 1rem}
.stack+.row::before,.row+.stack{border-top:1px solid var(--line)}
.preview{font-size:.9375rem;color:var(--ink2);padding:.75rem 1rem;border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:.75rem;padding:.8rem 1.1rem;font-weight:600;font-size:1rem;background:var(--accent);color:var(--on-accent)}
.btn.sec{background:var(--surface2);color:var(--ink)}
.btn.wide{width:100%}
.danger{color:var(--bad)}
/* player card */
.player{background:var(--surface);border-radius:1.25rem;padding:1rem;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:.9rem;align-items:center}
.lvl{width:4rem;height:4rem;position:relative}
.lvl svg{width:100%;height:100%;transform:rotate(-90deg)}
.lvl b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.375rem;font-weight:800;letter-spacing:-.02em}
.lvl small{position:absolute;left:0;right:0;bottom:-.2rem;text-align:center;font-size:.625rem;font-weight:700;color:var(--muted);letter-spacing:.06em}
.pname{font-weight:700;font-size:1.125rem;line-height:1.2}
.psub{font-size:.8125rem;color:var(--muted);margin-top:.1rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.55rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;font-size:.8125rem;font-weight:600;padding:.25rem .6rem;border-radius:999px;background:var(--surface2);color:var(--ink2)}
.chip svg{width:.9rem;height:.9rem}
.chip.xp{color:var(--xp)}
/* run CTA */
.cta{margin-top:.9rem;border-radius:1.25rem;padding:1.1rem 1.1rem 1rem;background:var(--accent);color:var(--on-accent);display:block;position:relative;overflow:hidden}
.cta .k{font-size:.8125rem;font-weight:600;opacity:.85}
.cta .h{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin:.1rem 0 .6rem}
.cta .stats{display:flex;gap:1.25rem;font-size:.875rem;opacity:.95}
.cta .stats b{display:block;font-size:1.375rem;font-weight:800}
.cta .play{position:absolute;right:1rem;top:50%;transform:translateY(-50%);width:3.25rem;height:3.25rem;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center}
/* continue */
.cont{display:grid;grid-template-columns:5.5rem 1fr auto;gap:.85rem;align-items:center;padding:.65rem;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.cont img{width:5.5rem;aspect-ratio:16/10;object-fit:cover;object-position:top left;border-radius:.6rem;display:block;max-width:100%;background:var(--surface2)}
.cont b{display:block;font-weight:600;line-height:1.25}
.cont span{font-size:.8125rem;color:var(--muted)}
/* chapter tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(9rem,44%),1fr));gap:.6rem}
.tile{background:var(--surface);border-radius:var(--r);padding:.85rem;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:.5rem;min-height:7.25rem;position:relative}
.tile .gl{width:2.25rem;height:2.25rem;border-radius:.6rem;display:grid;place-items:center;background:var(--c);color:#fff}
.tile .gl svg{width:1.3rem;height:1.3rem}
.tile b{font-weight:600;font-size:.9375rem;line-height:1.25}
.tile .meta{margin-top:auto;display:flex;align-items:center;gap:.5rem;font-size:.75rem;color:var(--muted)}
.bar{flex:1;height:.3rem;border-radius:1rem;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:1rem}
.tile.locked{background:transparent;box-shadow:none;border:1px dashed var(--line)}
.tile.locked .gl{background:var(--surface2);color:var(--muted)}
.tile.locked b{color:var(--muted)}
/* chapter page */
.chead{display:flex;gap:.9rem;align-items:center;margin:.25rem 0 1rem}
.chead .gl{width:3.5rem;height:3.5rem;border-radius:1rem;display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.chead .gl svg{width:2rem;height:2rem}
.chead h1{margin:0;font-size:1.75rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.chead p{margin:.1rem 0 0;color:var(--muted);font-size:.9375rem}
.mstat{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.mstat div{background:var(--surface);border-radius:var(--r);padding:.75rem;box-shadow:var(--shadow)}
.mstat b{display:block;font-size:1.375rem;font-weight:800;letter-spacing:-.02em}
.mstat span{font-size:.75rem;color:var(--muted)}
.tabs{display:flex;gap:.4rem;overflow-x:auto;margin:1.25rem -16px 0;padding:0 16px .25rem;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border-radius:999px;padding:.4rem .85rem;font-weight:500;font-size:.875rem;background:var(--surface);box-shadow:var(--shadow);color:var(--ink2)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tab.soon{color:var(--muted);background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}.tab.soon[aria-pressed="true"]{background:var(--surface2);color:var(--ink2);box-shadow:none}
.soonbox{border:1.5px dashed var(--line);border-radius:14px;padding:1.25rem 1rem;color:var(--muted);font-size:.875rem;text-align:center;margin-top:.5rem}
.soonrow{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-top:1.5rem;font-size:.8125rem;color:var(--muted)}.soonrow span{margin-right:.25rem}
.soonrow button{border:1.5px dashed var(--line);border-radius:999px;padding:.25rem .7rem;color:var(--muted);font-size:.8125rem;background:none}
.atl{display:grid;grid-template-columns:repeat(auto-fill,minmax(16rem,1fr));gap:.75rem}
.atlas{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.atlas .shot{display:block;aspect-ratio:16/8;overflow:hidden;background:var(--surface2)}
.atlas .shot img{width:100%;height:100%;object-fit:cover;object-position:top left;display:block}
.atlas .bd{padding:.8rem .9rem .9rem;display:flex;flex-direction:column;gap:.35rem}
.atlas .bd b{font-weight:600;font-size:1.0625rem}
.atlas .bd span{font-size:.8125rem;color:var(--muted)}
.atlas .bd p{margin:0;font-size:.875rem;color:var(--ink2);line-height:1.45}
.pips{display:flex;gap:.2rem;flex:none}
.pips i{width:.45rem;height:1rem;border-radius:.2rem;background:var(--surface2)}
.pips i.on{background:var(--c,var(--accent))}
.empty{padding:1.5rem 1rem;text-align:center;color:var(--muted);font-size:.9375rem;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
/* search */
.sbox{position:relative;margin-bottom:1rem}
.sbox input{width:100%;height:2.5rem;border-radius:.65rem;border:0;background:var(--surface2);color:var(--ink);padding:0 .75rem 0 2.25rem;font:inherit;font-size:1rem;outline:none}
.sbox svg{position:absolute;left:.65rem;top:.6rem;width:1.25rem;height:1.25rem;color:var(--muted)}
mark{background:color-mix(in srgb,var(--accent) 30%,transparent);color:inherit;border-radius:3px}
/* achievements */
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.6rem}
.ach div{background:var(--surface);border-radius:var(--r);padding:.8rem;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:.35rem}
.ach .md{width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;background:var(--xp);color:#fff}
.ach .md svg{width:1.3rem;height:1.3rem}
.ach b{font-size:.875rem;font-weight:600;line-height:1.25}
.ach span{font-size:.75rem;color:var(--muted);line-height:1.35}
.ach .off{opacity:.45}
.ach .off .md{background:var(--surface2);color:var(--muted)}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.8) blur(18px);-webkit-backdrop-filter:saturate(1.8) blur(18px);border-top:1px solid var(--line);padding-bottom:var(--sab)}
.nav ul{list-style:none;margin:0 auto;padding:0;display:grid;grid-template-columns:repeat(4,1fr);max-width:36rem;height:var(--nav-h)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;height:100%;font-size:.6875rem;font-weight:500;color:var(--muted);position:relative}
.nav a[aria-current="page"]{color:var(--accent)}
.nav .dot[hidden]{display:none}
.nav .dot{position:absolute;top:.45rem;left:calc(50% + .45rem);min-width:1.05rem;height:1.05rem;padding:0 .25rem;border-radius:1rem;background:var(--bad);color:#fff;font-size:.625rem;font-weight:700;display:grid;place-items:center}
/* full screens */
.full{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.full[hidden]{display:none}
.vbar{flex:none;display:flex;align-items:center;gap:.25rem;padding:calc(var(--sat) + .25rem) max(8px,env(safe-area-inset-right,0px)) .25rem max(8px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--surface) 92%,transparent);border-bottom:1px solid var(--line)}
.vbar .bb{width:2.75rem;height:2.75rem;border-radius:50%;display:grid;place-items:center;color:var(--accent);flex:none}
.vbar .back{padding:0 .4rem;margin:0}
.vbar .vt{flex:1;min-width:0;text-align:center;padding:0 .25rem}
.vbar .vt b{display:block;font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbar .vt span{display:block;font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbar [aria-pressed="true"] svg{fill:currentColor}
#frame{flex:1;width:100%;border:0;background:#fff;display:block}
/* run */
.run{padding:calc(var(--sat) + .5rem) max(16px,env(safe-area-inset-right,0px)) calc(var(--sab) + 1rem) max(16px,env(safe-area-inset-left,0px));max-width:36rem;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;gap:1rem}
.rtop{display:flex;align-items:center;gap:.75rem}
.rprog{flex:1;height:.5rem;border-radius:1rem;background:var(--surface2);overflow:hidden}
.rprog i{display:block;height:100%;background:var(--accent);border-radius:1rem;transition:width .3s}
.combo{font-weight:800;font-size:.9375rem;color:var(--xp);min-width:3.5rem;text-align:right}
.card{flex:1;background:var(--surface);border-radius:1.5rem;box-shadow:var(--shadow);padding:1.5rem 1.25rem;display:flex;flex-direction:column;justify-content:center;gap:.75rem;position:relative}
.card .k{font-size:.8125rem;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.card h2{margin:0;font-size:1.75rem;line-height:1.2;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:.9375rem}
.card .open{align-self:flex-start;display:inline-flex;gap:.35rem;align-items:center;font-weight:600;color:var(--accent);font-size:.9375rem;margin-top:.25rem}
.card .gain{position:absolute;top:1rem;right:1.1rem;font-weight:800;color:var(--xp);opacity:0;transform:translateY(.5rem);transition:all .35s}
.card .gain.show{opacity:1;transform:none}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.rate button{border-radius:1rem;padding:.9rem .5rem;font-weight:700;font-size:1rem;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:.15rem}
.rate button span{font-size:.75rem;font-weight:500;color:var(--muted)}
.rate .r0{color:var(--bad)} .rate .r1{color:var(--warn)} .rate .r2{color:var(--good)}
.result{text-align:center;display:flex;flex-direction:column;gap:.5rem;align-items:center;justify-content:center;flex:1}
.result .big{font-size:3.5rem;font-weight:800;letter-spacing:-.03em;color:var(--xp);line-height:1}
.result .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;width:100%;margin-top:1rem}
.result .grid div{background:var(--surface);border-radius:var(--r);padding:.75rem;box-shadow:var(--shadow)}
.result .grid b{display:block;font-size:1.25rem;font-weight:800}
.result .grid span{font-size:.75rem;color:var(--muted)}
.lvup{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:.4rem 1rem;font-weight:700}
.newach{display:flex;gap:.5rem;align-items:center;background:var(--surface);border-radius:var(--r);padding:.6rem .9rem;box-shadow:var(--shadow);font-weight:600;font-size:.9375rem}
/* sheet + toast */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.sheet{width:100%;max-width:36rem;max-height:85vh;overflow:auto;background:var(--bg);border-radius:1.25rem 1.25rem 0 0;padding:.5rem 1rem calc(1rem + var(--sab))}
.grab{width:2.25rem;height:.3rem;border-radius:1rem;background:var(--line);margin:0 auto .75rem}
.sheet h3{margin:.25rem 0 .25rem;font-size:1.375rem;font-weight:800;letter-spacing:-.01em}
.sheet .sub{color:var(--muted);font-size:.875rem;margin-bottom:1rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + var(--sab) + .75rem);z-index:90;background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:.75rem;font-weight:600;font-size:.9375rem}
.toast[hidden]{display:none}

.rank{font-size:.75rem;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);padding:.1rem .45rem;border-radius:.4rem;vertical-align:.15rem;margin-left:.25rem}
.stars{display:inline-flex;gap:.1rem;vertical-align:middle}
.stars i{width:.9rem;height:.9rem;color:var(--line);display:inline-block}
.stars i svg{width:100%;height:100%;display:block}
.stars i.on{color:var(--xp)}
.stars.tr{position:absolute;top:.85rem;right:.85rem}
.stars.big3 i{width:2rem;height:2rem}
.chead .stars{margin-top:.25rem}
.tick{color:var(--accent);font-weight:700}
.lock{font-size:.75rem;font-weight:700;color:var(--muted);background:var(--surface2);padding:.15rem .45rem;border-radius:.4rem;white-space:nowrap}
.row.dim,.dim{opacity:.55}
.row[disabled]{cursor:not-allowed}
.swatch.locked{display:grid;place-items:center;opacity:.35;color:#fff}
.swatch.locked svg{width:.9rem;height:.9rem}
.bosscard{margin-top:.75rem;display:flex;align-items:center;gap:1rem;justify-content:space-between;padding:1rem;border-radius:var(--r);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,var(--surface)),var(--surface));box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.bosscard .k{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.bosscard b{display:block;font-size:1.125rem;font-weight:700;line-height:1.25}
.bosscard span{font-size:.8125rem;color:var(--muted)}
.bosscard .btn{flex:none}
.bosscard .btn[disabled]{background:var(--surface2);color:var(--muted)}
.bodycard{margin-top:.9rem;background:var(--surface);border-radius:1.25rem;box-shadow:var(--shadow);display:grid;grid-template-columns:8.5rem 1fr;gap:.75rem;padding:.75rem .9rem .75rem .5rem;align-items:center}
.bm svg{width:100%;height:auto;display:block}
.sil *{fill:var(--surface2);stroke-linejoin:round}.sil .o *{stroke:var(--line);stroke-width:2.6}.sil .f *{stroke:none}

  if(S.goal){const x=S.xpDay[today()]||0;chips.push(`<span class="chip" style="color:${x>=S.goal?"var(--good)":"var(--ink2)"}">${I.target}${t("goalToday",{x:Math.min(x,S.goal),g:S.goal})}</span>`)}

}

/* ---------- review / game modes ---------- */
const qsOf=id=>(QB.topics&&QB.topics[id])||[];
function pickCards(scope,n){
  let pool=items().filter(x=>inScope(x,scope));
  const due=pool.filter(x=>isDue(x.id)).sort((a,b)=>S.T[a.id].due-S.T[b.id].due);
  const nw=pool.filter(x=>!S.T[x.id]);
  let out=[...due,...nw].slice(0,n);
  if(out.length<n){const rest=pool.filter(x=>!out.includes(x)).sort(()=>Math.random()-.5);out=out.concat(rest.slice(0,n-out.length))}
  return out.map(x=>{const qs=qsOf(x.id);return{x,q:qs.length?qs[Math.floor(Math.random()*qs.length)]:null}});
}
function qPool(scope){let pool=items().filter(x=>inScope(x,scope));return pool.flatMap(x=>qsOf(x.id).map(q=>({x,q})))}
const lockRow=(l)=>`<span class="lock">LV ${l}</span>`;
function reviewHome(scope){
  const live=chapters().filter(c=>c.checklist.length);
  const sc=scopeChap(scope),pool=items().filter(x=>inScope(x,scope)),smod=scope&&scope.startsWith("m:")?modById(scope.slice(2)):null;
  const mbN=mbList(scope).length,dd=S.daily[today()],cn=caseList(scope).length;
  const G=[[t("gDaily"),[
   {k:"daily",ic:I.star,c:"#E0952F",t:t("mDaily"),s:dd?t("dailyDone",dd)+" · "+t("dailyStreak",{n:dailyStreak()}):t("mDailyS"),l:1,done:!!dd},
   {k:"dx",ic:I.search,c:"#6C70D8",t:t("mDx"),s:(()=>{const d=S.dxDay[today()];return d?t("dxDoneS",{r:(d.w?d.g.length:"X")+"/6"})+(dxStreak()?" · 🔥 "+dxStreak():""):t("mDxS")})(),l:1,done:!!S.dxDay[today()],off:!dxAll().length},{k:"review",ic:I.bolt,c:"var(--accent)",t:t("mReview"),s:t("mReviewS"),l:1},
   {k:"mb",ic:I.shield,c:"#DC2626",t:t("mMb"),s:mbN?t("mMbS",{n:mbN}):t("mbEmpty"),l:1,off:!mbN}]],
   [t("gGame"),[
   {k:"blitz",ic:I.timer,c:"#F59E0B",t:t("mBlitz"),s:t("mBlitzS")+(S.blitzBest?" · "+t("best",{n:S.blitzBest}):""),l:UNL.blitz},
   {k:"surv",ic:I.flame,c:"#EF4444",t:t("mSurv"),s:t("mSurvS")+(S.survBest?" · "+t("best",{n:S.survBest}):""),l:UNL.surv},
   {k:"ghost",ic:I.play,c:"#64748B",t:t("mGhost"),s:t("mGhostS"),l:UNL.ghost},
   {k:"hunt",ic:I.search,c:"#0EA5E9",t:t("mHunt"),s:t("mHuntS")+(S.hunt?" · "+S.hunt:""),l:UNL.hunt}]],
   [t("gExam2"),[
   {k:"exam",ic:I.cal,c:"#7C3AED",t:t("mExam"),s:t("mExamS")+(S.examBest?" · "+t("best",{n:S.examBest+"%"}):""),l:UNL.exam},
   {k:"case",ic:I.tag,c:"#BE185D",t:t("mCase"),s:t("mCaseS")+` · ${cn}`,l:UNL.case,off:!cn}]]];
  const row=m=>{const ok=lvlOf(S.xp)>=m.l&&!m.off;return `<button class="row ind${ok?"":" dim"}" type="button" data-mode="${m.k}" ${ok?"":"disabled"}><span class="sq" style="--c:${m.c};${m.c.startsWith("linear")?"background:"+m.c:""}">${m.ic}</span><span class="tx"><b>${m.t}</b><span>${m.s}</span></span>${m.done?'<span class="tick">✓</span>':ok?I.chev:lvlOf(S.xp)<m.l?lockRow(m.l):""}</button>`};
  view.innerHTML=`<div class="fade"><h1 class="lt">${t("reviewT")}</h1>
   ${smod?`<div class="scopehd"><span>${t("byBook")}</span><b>${esc(smod.title)}</b><a href="#/v/${smod.id}">${t("openAtlas")} ${I.chev}</a></div>`:""}
   ${G.map(([g,ms])=>`<div class="mgrp">${g}</div><div class="group">${ms.map(row).join("")}</div>`).join("")}
   ${sc?`<div class="cap">${t("byBook")} · ${esc(chName(sc))}</div><div class="group">${sc.modules.map(m=>{const xs=items().filter(x=>inScope(x,"m:"+m.id)),nq=xs.reduce((a,x)=>a+qsOf(x.id).length,0);if(!xs.length)return"";const on=scope==="m:"+m.id;
     return `<a class="row ind" href="#/review/m:${m.id}"><img class="mth" src="${m.thumb}" alt=""><span class="tx"><b>${esc(m.title)}</b><span>${xs.length} ${t("topics")} · ${nq} MCQ · ${Math.round(mastery(xs)*100)}%</span></span>${on?'<span class="tick">✓</span>':I.chev}</a>`}).join("")}</div>`:""}
   <div class="cap">${t("scope")}</div>
   <div class="group"><a class="row ind" href="#/review"><span class="sq">${I.bolt}</span><span class="tx"><b>${t("allCh")}</b><span>${items().filter(x=>isDue(x.id)).length} ${t("due")} · ${items().filter(x=>!S.T[x.id]).length} ${t("newT")}</span></span>${!scope?'<span class="tick">✓</span>':""}</a>
   ${live.map(c=>`<a class="row ind" href="#/review/${c.id}"><span class="sq" style="--c:${c.color}">${g(c.glyph)}</span><span class="tx"><b>${esc(chName(c))}</b><span>${c.checklist.filter(x=>isDue(x.id)).length} ${t("due")} · ${c.checklist.filter(x=>!S.T[x.id]).length} ${t("newT")} · ${Math.round(mastery(c.checklist)*100)}%</span></span>${scope===c.id||(sc&&!smod&&sc.id===c.id&&scope===c.id)?'<span class="tick">✓</span>':""}</a>`).join("")}</div>
   <p class="foot">${pool.length} ${t("topics")} · ${qPool(scope).length} MCQ</p></div>`;
  view.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{const k=b.dataset.mode;
   if(k==="review")pickCount("cards",pool.length,n=>startRun(scope,n));else if(k==="blitz")startBlitz(scope);else if(k==="exam")pickCount("exam",qPool(scope).length,n=>startExam(scope,n));
   else if(k==="daily")startDaily();else if(k==="dx")startDx(!!S.dxDay[today()]&&false);else if(k==="mb")pickCount("mbN",mbList(scope).length,n=>startMb(scope,n));else if(k==="surv")startSurv(scope);else if(k==="ghost")startGhost(scope);else if(k==="case")pickCase(scope);else if(k==="hunt")startHunt(scope)});

let RUN=null;const RN=$("#runner");
function openRunner(){RN.hidden=false;document.body.style.overflow="hidden"}
function endRun(){clearInterval(RUN&&RUN.timer);RN.hidden=true;document.body.style.overflow="";RUN=null;render()}
function topBar(prog,right=""){return `<div class="rtop"><button class="bb" type="button" id="rx" aria-label="Close">${I.x}</button><div class="rprog"><i style="width:${prog*100}%"></i></div><span class="combo">${right}</span></div>`}
function pickCount(kind,max,go){
  const key=kind==="exam"?"examN":kind==="mbN"?"mbN":"cards",cur=S[key]||10,opts=[5,10,20,30,50].filter(n=>n<max);
  openSheet(`<h3>${t("howMany")}</h3><div class="sub">${t("qAvail",{n:max})}</div>
   <div class="cnt">${opts.map(n=>`<button type="button" data-n="${n}" class="${n===cur?"on":""}">${n}</button>`).join("")}<button type="button" data-n="${max}" class="${cur>=max?"on":""}">${max}<span>${t("allQ")}</span></button></div>`);
  $("#sheet").querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{const n=+b.dataset.n;S[key]=n;persist();closeSheet();go(n)});
}
function qnH(i,n){return `<div class="qn">${n?t("qOf",{i:`<b>${i}</b>`,n}):t("blitzN",{i:`<b>${i}</b>`})}</div>`}
function logMiss(x,q,a){if(!RUN.miss)RUN.miss=[];RUN.miss.push({x,q,a});if(q){const qi=qsOf(x.id).indexOf(q);S.wrongLog=[[x.id,qi,Date.now()],...(S.wrongLog||[])].slice(0,300);if(qi>=0){mbInit();S.mb[x.id+"|"+qi]=2}}}
function missList(list){
  if(!list||!list.length)return `<div class="allok">${t("allRight")}</div>`;
  return `<div class="wlist"><div class="cap" style="margin-top:1rem">${t("missT",{n:list.length})}</div>${list.map((p,k)=>`<div class="wq">
   <span class="tg">${esc(chName(p.x.ch))} · ${esc(p.x.t)}</span>
   ${p.q?`<b>${esc(p.q.q)}</b><div class="ans">${p.a>=0?`<span class="badc">✗ ${esc(p.q.o[p.a])}</span>`:`<span class="badc">${t("timeUp")}</span>`}<span class="okc">✓ ${esc(p.q.o[p.q.a])}</span></div><p>${esc(p.q.e)}</p>`:`<b>${esc(p.x.t)}</b><span class="badc">${t("forgot")}</span>`}
   ${p.x.link?`<button class="go" type="button" data-go="${k}">${t("seeAtlas")} ${I.chev}</button>`:""}</div>`).join("")}
   <button class="btn sec retry" type="button" id="rmiss">${t("retryMiss",{n:list.length})}</button></div>`;
}
function wireMiss(list){
  RN.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const x=list[+b.dataset.go].x;if(!x.link)return;
    FIND={m:x.link.m,terms:termsOf(x.t),label:x.t,secs:[],start:x.link.h,quiet:true};RN.hidden=true;RUN.peek=true;location.hash=linkOf(x)});
  const r=$("#rmiss");if(r)r.onclick=()=>startMiss(list);
}
function startMiss(list){const cards=list.map(p=>({x:p.x,q:p.q}));const scope=RUN&&RUN.scope;clearInterval(RUN&&RUN.timer);
  RUN={mode:"review",scope,cards,i:0,combo:0,best:0,xp:0,good:0,gold:-1,lvl0:lvlOf(S.xp),crits:0,retry:true};openRunner();drawCard()}
function buzz(p){try{if(!S.motion&&navigator.vibrate)navigator.vibrate(p)}catch(e){}}
const qKey=(x,q)=>x.id+"|"+qsOf(x.id).indexOf(q);
function mbInit(){if(S.mb)return;S.mb={};(S.wrongLog||[]).forEach(([id,qi])=>{if(qi>=0)S.mb[id+"|"+qi]=2})}
function mbHit(x,q){mbInit();if(!q)return;const k=qKey(x,q);if(S.mb[k]){S.mb[k]--;if(S.mb[k]<=0){delete S.mb[k];S.mbCleared=(S.mbCleared||0)+1;if(RUN)RUN.cleared=(RUN.cleared||0)+1}}}
function mbList(scope){mbInit();return Object.keys(S.mb).map(k=>{const[id,qi]=k.split("|"),x=itemById(id),q=x&&qsOf(id)[+qi];return x&&q&&inScope(x,scope)?{x,q}:null}).filter(Boolean)}
function dailyStreak(){let n=0;const d=new Date();if(!S.daily[dkey(d)])d.setDate(d.getDate()-1);while(S.daily[dkey(d)]){n++;d.setDate(d.getDate()-1)}return n}
function dailySet(){const all=qPool(null);if(!all.length)return[];let seed=+today().replace(/-/g,"");const r=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  const idx=all.map((_,i)=>i).sort((a,b)=>r()-.5);const out=[],seen=new Set();for(const i of idx){if(seen.has(all[i].x.id))continue;seen.add(all[i].x.id);out.push(all[i]);if(out.length===5)break}return out}
function startDaily(){const cards=dailySet();if(!cards.length){toast(t("noCards"));return}
  RUN={mode:"review",kind:"daily",scope:null,cards,i:0,combo:0,best:0,xp:0,good:0,gold:-1,lvl0:lvlOf(S.xp),crits:0,title:t("mDaily")};openRunner();drawCard()}
function startMb(scope,n){const L=mbList(scope).sort(()=>Math.random()-.5).slice(0,n);if(!L.length){toast(t("mbEmpty"));return}
  RUN={mode:"review",kind:"mb",scope,cards:L,i:0,combo:0,best:0,xp:0,good:0,gold:-1,lvl0:lvlOf(S.xp),crits:0,title:t("mMb"),n};openRunner();drawCard()}
/* survival */
function startSurv(scope){const pool=qPool(scope).sort(()=>Math.random()-.5);if(pool.length<4){toast(t("noCards"));return}
  RUN={mode:"surv",scope,pool,i:0,hp:3,score:0,combo:0,best:0,xp:0,lvl0:lvlOf(S.xp)};openRunner();drawSurv()}
function heartsH(pop){return `<div class="hearts" aria-label="${t("hearts")}">${[0,1,2].map(k=>`<i class="${k<RUN.hp?"":"off"}${pop===k?" pop":""}">❤️</i>`).join("")}</div>`}
function drawSurv(pop){const {x,q}=RUN.pool[RUN.i%RUN.pool.length];
  RN.innerHTML=`<div class="run" style="--c:${x.ch.color}">${topBar(Math.min(1,(RUN.score%10)/10),RUN.combo>1?"×"+RUN.combo:"")}${heartsH(pop)}${qnH(RUN.i+1,0)}
   <div class="blitzscore"><b>${RUN.score}</b><span>${t("score")}</span></div>
   <div class="card"><div class="k">${esc(x.t)}</div><h2 class="qstem">${esc(q.q)}</h2><div class="opts">${q.o.map((o,i)=>`<button class="opt" type="button" data-o="${i}"><span class="ol">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div><div class="expl" id="expl" hidden></div></div></div>`;
  $("#rx").onclick=()=>endSurv();
  RN.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{const k=+b.dataset.o,ok=k===q.a;RN.querySelectorAll("[data-o]").forEach(y=>{y.disabled=true;const j=+y.dataset.o;if(j===q.a)y.classList.add("ok");else if(j===k)y.classList.add("bad")});
    setLevel(x.id,ok?2:0);let pp=-1;
    if(ok){RUN.score++;RUN.combo++;RUN.best=Math.max(RUN.best,RUN.combo);mbHit(x,q);buzz(15);if(RUN.score%10===0&&RUN.hp<3){RUN.hp++;pp=RUN.hp-1;toast(t("heartBack"))}}
    else{RUN.combo=0;RUN.hp--;logMiss(x,q,k);buzz([40,40,40]);RN.querySelector(".card").classList.add("shake");const ex=$("#expl");ex.hidden=false;ex.innerHTML=`<b class="badc">${t("wrong")}</b> ${esc(q.e)}`}
    persist();setTimeout(()=>{if(!RUN||RUN.mode!=="surv")return;if(RUN.hp<=0)endSurv();else{RUN.i++;drawSurv(pp)}},ok?(S.motion?60:420):1900)})}
function endSurv(){if(!RUN||RUN.done)return;RUN.done=true;const rec=RUN.score>S.survBest;if(rec)S.survBest=RUN.score;RUN.xp=RUN.score*5+(rec?20:0);addXP(RUN.xp);const scope=RUN.scope;
  resultScreen({title:RUN.hp<=0?t("survOver"):t("mSurv"),extra:rec&&RUN.score?`<div class="lvup" style="background:#EF4444">${t("newBest")}</div>`:"",stats:[[RUN.score,t("score")],[S.survBest,t("bestL")],["×"+RUN.best,t("bestCombo")]],list:missList(RUN.miss),miss:RUN.miss,again:()=>startSurv(scope)})}
/* ghost duel */
function startGhost(scope){const pool=qPool(scope).sort(()=>Math.random()-.5).slice(0,10);if(pool.length<4){toast(t("noCards"));return}
  const gk=scope||"all";RUN={mode:"ghost",scope,gk,pool,i:0,good:0,xp:0,lvl0:lvlOf(S.xp),t0:Date.now(),pen:0,splits:[],gh:S.ghost[gk]||null};openRunner();drawGhost();
  RUN.timer=setInterval(ghostTick,120)}
function ghostDone(ms){const g=RUN.gh;if(!g)return 0;let k=0;while(k<g.t.length&&g.t[k]<=ms)k++;return k}
function ghostTick(){if(!RUN||RUN.mode!=="ghost")return;const ms=Date.now()-RUN.t0+RUN.pen,n=RUN.pool.length,el=RN.querySelector(".duel");if(!el)return;
  el.querySelector(".y i").style.width=(RUN.i/n*100)+"%";el.querySelector(".y em").textContent=(ms/1000).toFixed(1)+"s";
  const gi=el.querySelector(".g i");if(gi&&RUN.gh){gi.style.width=(ghostDone(ms)/n*100)+"%";el.querySelector(".g em").textContent=(RUN.gh.total/1000).toFixed(1)+"s"}}
function drawGhost(){const {x,q}=RUN.pool[RUN.i],n=RUN.pool.length;
  RN.innerHTML=`<div class="run" style="--c:${x.ch.color}">${topBar(RUN.i/n,"")}${qnH(RUN.i+1,n)}
   <div class="duel"><div class="y"><span>${t("you")}</span><span class="tr"><i></i></span><em>0.0s</em></div>${RUN.gh?`<div class="g"><span>${t("ghost")}</span><span class="tr"><i></i></span><em></em></div>`:""}</div>

   ${qnH(RUN.i+1,0)}<div class="blitzscore"><b>${RUN.score}</b><span>${t("score")}</span>${RUN.combo>1?`<em>×${RUN.combo}</em>`:""}</div>
   <div class="card"><div class="k">${esc(x.t)}</div><h2 class="qstem">${esc(q.q)}</h2><div class="opts">${q.o.map((o,i)=>`<button class="opt" type="button" data-o="${i}"><span class="ol">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div></div></div>`;
  $("#rx").onclick=()=>{clearInterval(RUN.timer);endBlitz()};
  RN.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{const ok=+b.dataset.o===q.a;b.classList.add(ok?"ok":"bad");
    if(ok){RUN.score++;RUN.combo++;RUN.best=Math.max(RUN.best,RUN.combo);mbHit(x,q);buzz(12)}else{RUN.combo=0;RUN.end-=3000;logMiss(x,q,+b.dataset.o);buzz([40,40,40])}
    RN.querySelectorAll("[data-o]").forEach(x=>x.disabled=true);setTimeout(()=>{if(!RUN||RUN.mode!=="blitz")return;RUN.i++;if(Date.now()<RUN.end)drawBlitz()},S.motion?50:260)});
}
function endBlitz(){if(!RUN||RUN.done)return;RUN.done=true;const rec=RUN.score>S.blitzBest;if(rec)S.blitzBest=RUN.score;
  RUN.xp=RUN.score*4;addXP(RUN.xp);const scope=RUN.scope;
  resultScreen({title:t("mBlitz"),extra:rec&&RUN.score?`<div class="lvup" style="background:#F59E0B">${t("newBest")}</div>`:"",stats:[[RUN.score,t("score")],[S.blitzBest,t("bestL")],["×"+RUN.best,t("bestCombo")]],list:missList(RUN.miss),miss:RUN.miss,again:()=>startBlitz(scope)})}
/* exam */
function startExam(scope,n){
  const pool=qPool(scope).sort(()=>Math.random()-.5).slice(0,n||S.examN||20);if(pool.length<4){toast(t("noCards"));return}
  RUN={mode:"exam",scope,pool,i:0,ans:[],xp:0,lvl0:lvlOf(S.xp)};openRunner();drawExam();
  RUN.timer=setInterval(()=>{const left=Math.max(0,RUN.qend-Date.now()),el=$("#et");if(el)el.textContent=Math.ceil(left/1000);if(!left)examPick(-1)},250);
}
function drawExam(){
  const {x,q}=RUN.pool[RUN.i];RUN.qend=Date.now()+90000;
  RN.innerHTML=`<div class="run" style="--c:${x.ch.color}">${topBar(RUN.i/RUN.pool.length,`<span id="et">90</span>s`)}
   ${qnH(RUN.i+1,RUN.pool.length)}
   <div class="card"><h2 class="qstem">${esc(q.q)}</h2><div class="opts">${q.o.map((o,i)=>`<button class="opt" type="button" data-o="${i}"><span class="ol">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div></div></div>`;
  $("#rx").onclick=()=>{clearInterval(RUN.timer);if(RUN.i)endExam();else endRun()};
  RN.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>examPick(+b.dataset.o));
}
function examPick(i){if(!RUN||RUN.mode!=="exam"||RUN.locked)return;RUN.locked=true;
  const {x,q}=RUN.pool[RUN.i];RUN.ans.push(i);setLevel(x.id,i===q.a?2:0);if(i!==q.a)logMiss(x,q,i);else mbHit(x,q);
  setTimeout(()=>{RUN.locked=false;RUN.i++;if(RUN.i>=RUN.pool.length)endExam();else drawExam()},S.motion?40:150)}
function endExam(){clearInterval(RUN.timer);const n=RUN.ans.length,c=RUN.ans.filter((a,i)=>a===RUN.pool[i].q.a).length,pct=n?Math.round(c/n*100):0;
  RUN.xp=Math.round(c*10*1.5);addXP(RUN.xp);if(n>=10)S.examBest=Math.max(S.examBest,pct);const scope=RUN.scope;
  const wrong=RUN.pool.slice(0,n).map((p,i)=>({...p,a:RUN.ans[i]})).filter(p=>p.a!==p.q.a);
  resultScreen({title:t("mExam"),stats:[[pct+"%",t("score")],[t("ofN",{c,n}),t("correct")],[S.examBest+"%",t("bestL")]],
   list:missList(RUN.miss),miss:RUN.miss,again:()=>startExam(scope,RUN.pool.length)})}
/* boss */
function startBoss(cid){
  const b=QB.boss&&QB.boss[cid];if(!b)return;const c=chap(cid);
  RUN={mode:"boss",cid,b,i:0,good:0,xp:0,combo:0,best:0,lvl0:lvlOf(S.xp)};openRunner();drawBoss();
}
function drawBoss(){
  const {b,i}=RUN,q=b.qs[i],c=chap(RUN.cid);
  RN.innerHTML=`<div class="run fade" style="--c:${c.color}">${topBar(i/b.qs.length,`${RUN.good}/${b.pass}`)}${qnH(i+1,b.qs.length)}
   <div class="card boss"><div class="k">${t("boss")} · ${esc(b.title[S.lang]||b.title.en)}</div><details class="case" ${i?"":"open"}><summary>Case</summary><p>${esc(b.case)}</p></details>
    <h2 class="qstem">${esc(q.q)}</h2><div class="opts">${q.o.map((o,k)=>`<button class="opt" type="button" data-o="${k}"><span class="ol">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div><div class="expl" id="expl" hidden></div></div>
   <button class="btn wide" type="button" id="next" hidden>${t("next")}</button></div>`;
  $("#rx").onclick=endRun;
  RN.querySelectorAll("[data-o]").forEach(bt=>bt.onclick=()=>{const k=+bt.dataset.o,ok=k===q.a;
    RN.querySelectorAll("[data-o]").forEach(x=>{x.disabled=true;const j=+x.dataset.o;if(j===q.a)x.classList.add("ok");else if(j===k)x.classList.add("bad")});
    if(ok)RUN.good++;else{const bx=c.checklist.find(z=>z.link)||c.checklist[0];RUN.miss=RUN.miss||[];RUN.miss.push({x:{...bx,ch:c,t:b.title[S.lang]||b.title.en,link:null},q,a:k})}const ex=$("#expl");ex.hidden=false;ex.innerHTML=`<b class="${ok?"okc":"badc"}">${ok?t("correct"):t("wrong")}</b> ${esc(q.e)}`;$("#next").hidden=false;
    const cb=RN.querySelector(".combo");if(cb)cb.textContent=`${RUN.good}/${RUN.b.pass}`});
  $("#next").onclick=()=>{RUN.i++;if(RUN.i>=b.qs.length)endBoss();else drawBoss()};
}
function endBoss(){const win=RUN.good>=RUN.b.pass,first=win&&!S.boss[RUN.cid];if(win)S.boss[RUN.cid]=Date.now();
  RUN.xp=win?(first?200:60):20;addXP(RUN.xp);const cid=RUN.cid;
  resultScreen({title:win?t("bossWin"):t("bossLose",{n:RUN.b.pass}),extra:win?`<div class="stars big3">${starsH(chap(cid))}</div>`:"",stats:[[`${RUN.good}/${RUN.b.qs.length}`,t("correct")],[RUN.b.pass,t("needed")],[win?"✓":"✗",t("boss")]],list:missList(RUN.miss),again:()=>startBoss(cid)})}

/* ---------- topic sheet ---------- */
function openTopic(id){
  const x=itemById(id);if(!x)return;const st=S.T[x.id];
  const nd=st?Math.round((st.due-Date.now())/DAY):null;
  const when=!st?t("lv0"):st.due<=Date.now()?t("dueNow"):t("nextIn",{d:nd<=0?t("today"):nd===1?t("tomorrow"):t("inDays",{n:nd})});
  openSheet(`<div style="--c:${x.ch.color}"><div class="k" style="font-size:.8125rem;font-weight:600;color:var(--c);text-transform:uppercase;letter-spacing:.05em">${esc(chName(x.ch))} · ${esc(x.sub)}</div>
   <h3>${esc(x.t)}</h3><div class="sub" style="display:flex;gap:.5rem;align-items:center">${pips(lv(x.id))}<span>${t("lv"+lv(x.id))} · ${when}</span></div>
   <div class="rate" style="margin-bottom:.75rem"><button class="r0" type="button" data-sr="0">${t("again")}</button><button class="r1" type="button" data-sr="1">${t("hard")}</button><button class="r2" type="button" data-sr="2">${t("good")}</button></div>
   <div class="group">${x.link?`<a class="row" href="${linkOf(x)}" data-close><span class="tx"><b style="color:var(--accent)">${t("open")}</b></span>${I.chev}</a>`:""}
    <button class="row" type="button" id="tsave"><span class="tx"><b style="color:var(--accent)">${isSaved("t:"+x.id)?t("unsave"):t("save")}</b></span></button></div></div>`);
  $("#sheet").querySelectorAll("[data-sr]").forEach(b=>b.onclick=()=>{const r=+b.dataset.sr,s0=S.T[x.id]||{l:0,n:0};let l=s0.l;
    if(r===0)l=Math.max(0,l-1);else if(r===1)l=Math.max(1,l);else l=Math.min(3,l+1);
    S.T[x.id]={l,n:(s0.n||0)+1,due:Date.now()+(r===0?10*6e4:(r===1?1:INTERVAL[l+1]||30)*DAY)};const gn=[2,4,6][r];addXP(gn);S.reviews++;persist();checkAch().forEach(a=>setTimeout(()=>toast(t("newAch",{a:achName(a)})),900));
    closeSheet();toast("+"+gn+" XP");render()});
  $("#tsave").onclick=()=>{toggleSave("t:"+x.id);closeSheet();if(parse().k==="saved")render()};
}
function openSheet(html){$("#sheet").innerHTML=`<div class="grab"></div>`+html;$("#scrim").hidden=false;$("#sheet").querySelectorAll("[data-close]").forEach(a=>a.addEventListener("click",closeSheet))}
function closeSheet(){$("#scrim").hidden=true}
$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
document.addEventListener("click",e=>{const r=e.target.closest("[data-topic]");if(r){e.preventDefault();openTopic(r.dataset.topic)}});

/* ---------- viewer ---------- */
const V=$("#viewer"),frame=$("#frame");let vMod=null,FIND=null,FOC=false;
function sendFocus(){if(!FOC)return;FOC=false;setTimeout(()=>{try{frame.contentWindow.postMessage({sb:"focus"},"*")}catch(e){}},250)}
function sendFind(){if(!FIND||!vMod||FIND.m!==vMod.id)return;const f=FIND;FIND=null;setTimeout(()=>{try{frame.contentWindow.postMessage({sb:"find",quiet:!!f.quiet,terms:f.terms,label:f.label,secs:f.secs,start:f.start,str:{close:t("findClose"),next:t("findNextSec"),none:t("findNone")}},"*")}catch(e){}},380)}
function openViewer(id,h){
  const m=modById(id);if(!m){location.hash="#/";return}
  vMod=m;V.hidden=false;document.body.style.overflow="hidden";
  $("#vtitle").textContent=m.title;$("#vsub").textContent=chName(m.ch)+" · "+m.subs.join(" · ");
  $("#vstar").setAttribute("aria-pressed",isSaved("m:"+m.id));$("#vtopics").hidden=!m.topics.length;
  const src=m.href+(h?"#"+h:""),cur=frame.getAttribute("src")||"";
  const same=cur.split("#")[0]===m.href;FOC=!!h;if(!same)frame.setAttribute("src",src);else{if(h){try{frame.contentWindow.location.hash=h}catch(e){frame.setAttribute("src",src)}}sendFocus();sendFind()}
  S.recent=[{m:m.id,h:h||"",t:Date.now()},...S.recent.filter(r=>r.m!==m.id)].slice(0,8);
  const dk=today();if(S.opened[m.id]!==dk){S.opened[m.id]=dk;addXP(2)}touchDay();persist();checkAch().forEach(a=>toast(t("newAch",{a:achName(a)})));
}
function closeViewer(){if(!V.hidden){V.hidden=true;document.body.style.overflow="";if(RUN&&RUN.peek){RUN.peek=false;RN.hidden=false;document.body.style.overflow="hidden"}}}
$("#vback").onclick=()=>goBack(vMod?"#/c/"+vMod.ch.id:"#/");
$("#vstar").onclick=()=>{toggleSave("m:"+vMod.id);$("#vstar").setAttribute("aria-pressed",isSaved("m:"+vMod.id))};
$("#vquiz").onclick=()=>{if(vMod)location.hash="#/review/m:"+vMod.id};
function lqMsg(){return {sb:"lq",lang:S.lang,str:{whatIs:t("whatIs"),done:t("done"),again:t("again2"),next:t("next"),title:t("labelQ"),howMany:t("howMany"),all:t("allQ"),avail:t("qAvail",{n:"{n}"}),missT:t("missT",{n:"{n}"}),retry:t("retryMiss",{n:"{n}"}),allRight:t("allRight")}}}
$("#vlq").onclick=()=>{openSheet(`<h3>${t("lqOr")}</h3><div class="group" style="margin-top:.75rem"><button class="row ind" type="button" data-g="lq"><span class="sq" style="--c:#F59E0B">${I.tag}</span><span class="tx"><b>${t("labelQ")}</b><span>${t("lqDesc")}</span></span>${I.chev}</button><button class="row ind" type="button" data-g="hunt"><span class="sq" style="--c:#0EA5E9">${I.search}</span><span class="tx"><b>${t("mHunt")}</b><span>${t("huntDesc")}</span></span>${I.chev}</button></div>`);$("#sheet").querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{closeSheet();try{frame.contentWindow.postMessage(b.dataset.g==="hunt"?huntMsg():lqMsg(),"*")}catch(e){}})};
document.addEventListener("click",e=>{const x=e.target.closest&&e.target.closest("#dxGo");if(x){e.preventDefault();startDx(false)}});document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("#dailyGo");if(a&&!S.daily[today()]){e.preventDefault();startDaily()}});
window.addEventListener("message",e=>{const d=e.data;if(d&&d.sb==="open"&&modById(d.m)){location.hash=`#/v/${d.m}`;return}});
window.addEventListener("message",e=>{const d=e.data;if(d&&d.sb==="huntres"){if(d.ok){addXP(4);S.hunt=(S.hunt||0)+1;persist();checkAch().forEach(a=>toast(t("newAch",{a:achName(a)})))}if(d.end)toast(t("lqDone",{c:d.c,n:d.n}));return}if(!d||d.sb!=="lqres")return;if(d.ok){addXP(3);S.lq++;persist();checkAch().forEach(a=>toast(t("newAch",{a:achName(a)})))}if(d.end)toast(t("lqDone",{c:d.c,n:d.n}))});
$("#vtopics").onclick=()=>openSheet(`<h3>${t("sections")}</h3><div class="group" style="margin-top:.75rem">${vMod.topics.map(([l,h])=>`<a class="row" href="#/v/${vMod.id}/${h}" data-close><span class="tx"><b>${esc(l)}</b></span>${I.chev}</a>`).join("")}</div>`);
frame.addEventListener("load",()=>{sendFocus();sendFind();sendPend();try{const w=frame.contentWindow;const up=()=>{if(vMod&&S.recent[0]&&S.recent[0].m===vMod.id){S.recent[0].h=w.location.hash.slice(1);persist()}};w.addEventListener("hashchange",up);up()}catch(e){}});

/* ---------- render ---------- */
function render(){
  if(!LIB)return;const r=parse();applyPrefs();
  if(r.k==="v"){openViewer(r.a,r.b);setNav("");return}
  closeViewer();
  const map={home:["home",home],library:["library",library],c:["library",()=>chapter(r.a)],search:["home",search],me:["me",me],saved:["me",saved],settings:["me",settings],review:["review",()=>reviewHome(r.a)]};
  const [nav,fn]=map[r.k]||map.home;fn();setNav(nav);window.scrollTo(0,0);
}
applyPrefs();
let QB={topics:{},boss:{}};
/* question bank is split per chapter: q/index.json lists the parts; merge them into one QB */
function loadQB(){const E={topics:{},boss:{},cases:[],dx:{},dxl:[]};
 return fetch("q/index.json").then(r=>r.json()).then(ix=>Promise.all(ix.parts.map(c=>fetch("q/"+c+".json").then(r=>r.json()).then(p=>[c,p]).catch(()=>null))).then(ps=>{
  E.dxl=ix.dxl||[];ps.forEach(x=>{if(!x)return;const[c,p]=x;Object.assign(E.topics,p.topics||{});if(p.boss)E.boss[c]=p.boss;E.cases.push(...(p.cases||[]));if(p.dx&&p.dx.length)E.dx[c]=p.dx});return E})).catch(()=>E)}
Promise.all([fetch("library.json").then(r=>r.json()),loadQB()]).then(([d,q])=>{LIB=d;QB=q;if(d.alias){let ch=0;for(const[o,n]of Object.entries(d.alias)){if(S.T[o]){if(!S.T[n]||(S.T[o].l||0)>(S.T[n].l||0))S.T[n]=S.T[o];delete S.T[o];ch=1}}if(ch)persist()}const fz=applyFreezes();stack.push(location.hash||"#/");render();if(fz)setTimeout(()=>toast(t("freezeUsed",{n:fz})),600)})
 .catch(()=>{view.innerHTML='<div class="empty">Could not load the library. Check your connection and reopen.</div>'});
</script>
