<script>const ATLAS={"id": "renal-patho-2", "kind": "patho", "sys": "Renal", "root": "Pathology", "mmh": "map", "mapT": "Topic map", "leg": false, "drugs": false};</script>

<script>
/* Renal Pathology II · Urinary tract: stones, obstruction, infection, cysts & tumors — First Aid order;
   sections from Robbins Ch 20–21 and Harrison Ch 327/330/331 + FA-only topics */
(()=>{
/* Helpers shared by the original renal pathology atlases (Robbins Ch 20–21, Harrison Ch 319–331).
   Included inside each source block so their local helper names never clash. */
/* ================= physiology helpers ================= */
Object.assign(S,{g:'<b class="sbb guyton">G</b>',r:'<b class="sbb robbins">R</b>',h:'<b class="sbb harrison">H</b>',x:'<b class="sbb gen">Gen</b>'});
Object.assign(LEG,{na:["Na⁺","--s-na"],k:["K⁺","--s-k"],cl:["Cl⁻","--s-cl"],h2o:["H₂O","--s-h2o"],glc:["Glucose","--s-glc"],h:["H⁺","--s-h"],hco3:["HCO₃⁻","--s-hco3"],urea:["Urea","--s-urea"],ca:["Ca²⁺","--s-ca"],pi:["Phosphate","--s-pi"],nh4:["NH₄⁺","--s-nh4"],art:["Arteriole","--a-art"]});
Object.assign(ST,{labels:true,pg:60,pb:18,pic:32,kf:12.5,map:100,glc:100,step:0,pco2:40,hco3:24,ag:12,kfac:"diet",chart:"tfp",mic:"normal",dis:"aki",ra:1,re:1});
const f0=v=>Math.round(v),f1=v=>(Math.round(v*10)/10).toFixed(1);
function axes(x0,y0,w,h,xr,yr,xt,yt,xl,yl){const X=v=>x0+(v-xr[0])/(xr[1]-xr[0])*w,Y=v=>y0+h-(v-yr[0])/(yr[1]-yr[0])*h;
 let g=`<rect class="plot" x="${x0}" y="${y0}" width="${w}" height="${h}"/>`;
 xt.forEach(v=>g+=`<line class="gl" x1="${X(v)}" y1="${y0}" x2="${X(v)}" y2="${y0+h}"/>`+T(X(v),y0+h+16,v,{c:"s m"}));
 yt.forEach(v=>g+=`<line class="gl" x1="${x0}" y1="${Y(v)}" x2="${x0+w}" y2="${Y(v)}"/>`+T(x0-6,Y(v)+4,v,{a:"end",c:"s m"}));
 g+=`<path class="ax" d="M${x0},${y0} V${y0+h} H${x0+w}"/>`+T(x0+w/2,y0+h+36,xl,{c:"s"})+T(x0-42,y0+h/2,yl,{c:"s",r:-90});
 return {g,X,Y}}
const line=(pts,c,o={})=>`<path class="ln ${c}" d="M${pts.map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" L")}"${o.dash?' stroke-dasharray="6 4"':""}/>`;
const pl=(A,f,a,b,c,o)=>line(fpts(f,a,b).map(([x,y])=>[A.X(x),A.Y(y)]),c,o);
const fpts=(f,a,b,n=60)=>[...Array(n+1)].map((_,i)=>{const x=a+(b-a)*i/n;return [x,f(x)]});
const B=(x,y,w,h,ttl,lines,c="")=>`<rect class="box ${c}" x="${x}" y="${y}" width="${w}" height="${h}" rx="10"/>`+T(x+w/2,y+20,ttl,{c:"bh"})+lines.map((l,i)=>T(x+w/2,y+38+i*15,l,{c:"s"})).join("");
const AR=(x1,y1,x2,y2,c="")=>`<path class="arw ${c}" d="M${x1},${y1} L${x2},${y2}"/>`;
const ion=(x,y,k,txt)=>`<circle class="ion" cx="${x}" cy="${y}" r="11" style="fill:var(--s-${k})"/>`+T(x,y+4,txt||LEG[k][0],{c:"ion"});
/* epithelial cell: lumen left, blood right */
function cell(x,y,w,h,lab){return `<rect class="lumen" x="${x-120}" y="${y-10}" width="120" height="${h+20}" rx="10"/><rect class="blood" x="${x+w}" y="${y-10}" width="120" height="${h+20}" rx="10"/><rect class="cell" x="${x}" y="${y}" width="${w}" height="${h}" rx="18"/>`+
 (ST.labels?T(x-60,y+8,"Lumen",{c:"s m"})+T(x+w+60,y+8,"Blood",{c:"s m"})+(lab?T(x+w/2,y+h+26,lab,{c:"b"}):""):"")}
/* transporter on membrane: side 'a' apical (x) or 'b' basolateral; kind: pump, co, ex, ch */
function tr(x,y,kind,lab,ions,dir=1){const k=ions||[];let g=`<g class="tr ${kind}"><circle cx="${x}" cy="${y}" r="15"/>${kind==="pump"?T(x,y+4,"ATP",{c:"atp"}):""}</g>`;
 k.forEach(([io,dx,dy,ddir],i)=>{g+=`<path class="flux" style="stroke:var(--s-${io})" d="M${x-28*(ddir??dir)},${y+dy} L${x+28*(ddir??dir)},${y+dy}" marker-end="url(#ah2)"/>`+T(x+(ddir??dir)*40,y+dy+4,LEG[io][0],{a:(ddir??dir)>0?"start":"end",c:"s ionl"}).replace('class="t','style="fill:var(--s-'+io+')" class="t')});
 if(ST.labels&&lab)g+=T(x,y-22,lab,{c:"s"});return g}
const pctBar=(x,y,w,segs)=>{let g="",cx=x;segs.forEach(([p,c,l])=>{const ww=w*p/100;g+=`<rect x="${cx}" y="${y}" width="${ww}" height="26" style="fill:var(${c})" class="seg"/>`+(ww>34?T(cx+ww/2,y+17,l,{c:"s w"}):"");cx+=ww});return g};
function sl(id,lab,min,max,step,unit){return `<label class="sl"><span>${lab} <b data-v="${id}">${ST[id]}</b> ${unit}</span><input type="range" min="${min}" max="${max}" step="${step}" value="${ST[id]}" data-k="${id}"></label>`}
function wireSl(after){const s=cur;document.querySelectorAll('#tools-'+s.id+' input[type=range]').forEach(r=>r.oninput=()=>{ST[r.dataset.k]=+r.value;r.closest(".tools").querySelector('[data-v="'+r.dataset.k+'"]').textContent=r.value;document.getElementById("dia-"+s.id).innerHTML=s.draw();if(after)after()})}
const live=()=>{const el=document.getElementById("live");if(el&&cur.live)el.innerHTML=cur.live()};


/* ================= glomerular lesion engine: EM · IF · LM ================= */
Object.assign(ST,{gv:"em"});
const GV=[["gv",[["em","EM"],["if","IF"],["lm","LM"]]]];
function rng(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
/* EM: a capillary wall as the electron microscope sees it — lumen above, urinary space below,
   every layer following one meandering baseline so nothing reads as a stack of rectangles.
   o: {sub_ep:'humps'|'spikes', sub_en, mes, intra, linear, eff, split, thin, thick, dbl, fib, neut, nod} */
function glomEM(o={}){const r=rng(7),W=640,H=420;let b="";
 /* one wavy baseline; every layer is an offset of it */
 const wav=x=>Math.sin(x/104)*7.5+Math.sin(x/41+1.3)*3.2+Math.sin(x/19+.7)*1.1;
 const mid=198,th=o.thick?44:o.thin?12:26;            /* GBM mid-line and thickness */
 const top=x=>mid-th/2+wav(x),bot=x=>mid+th/2+wav(x);
 const epi=o.sub_ep==='spikes'?19:(o.eff&&o.sub_ep==='humps')?30:1;
 const endoT=x=>top(x)-13,fpT=x=>bot(x)+epi,fpH=o.eff?17:26,fpB=x=>fpT(x)+fpH;
 const P=(f,a,c,st=8)=>{const p=[];for(let x=a;x<c;x+=st)p.push([x,f(x)]);p.push([c,f(c)]);return p};
 const J=p=>p.map(([x,y])=>x.toFixed(1)+","+y.toFixed(1)).join(" L");
 const area=(f1,f2,a=0,c=W)=>"M"+J(P(f1,a,c))+" L"+J(P(f2,a,c).reverse())+"Z";
 /* a granular electron-dense deposit */
 const dep=(cx,cy,rx,ry)=>{let g=`<ellipse class="em-dep" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}"/>`;
  for(let i=0;i<9;i++){const a=r()*6.283,k=Math.sqrt(r())*.78;g+=`<circle class="em-gran" cx="${(cx+Math.cos(a)*rx*k).toFixed(1)}" cy="${(cy+Math.sin(a)*ry*k).toFixed(1)}" r="${(1.1+r()*2).toFixed(1)}"/>`}return g};
 const lead=(x,y1,y2)=>`<path class="em-lead" d="M${x},${y1.toFixed(1)} L${x},${y2.toFixed(1)}"/>`;
 const MX=150,mesR=y=>140-26*Math.sin(y/70);          /* mesangium bulging into the angle */
 b+=`<rect class="em-bg" x="0" y="0" width="${W}" height="${H}"/>`;
 /* ---- capillary lumen ---- */
 b+=`<path class="em-lum" d="M${mesR(0).toFixed(1)},0 L${W},0 L${W},${endoT(W).toFixed(1)} L${J(P(endoT,MX,W).reverse())} L${J([...Array(9)].map((_,i)=>{const y=endoT(MX)*(8-i)/8;return [mesR(y),y]}))}Z"/>`;
 /* red cells: biconcave, deformed by the loop */
 [[300,78,48,11],[476,62,42,-13],[212,116,34,7]].forEach(([x,y,R,s])=>{
  b+=`<ellipse class="em-rbc" cx="${x}" cy="${y}" rx="${R}" ry="${(R*.56).toFixed(1)}" transform="rotate(${s} ${x} ${y})"/>`;
  b+=`<ellipse class="em-rbcp" cx="${x}" cy="${y}" rx="${(R*.44).toFixed(1)}" ry="${(R*.24).toFixed(1)}" transform="rotate(${s} ${x} ${y})"/>`});
 if(o.neut)[[372,124],[536,116],[236,44]].forEach(([x,y])=>{
  b+=`<circle class="em-pmn" cx="${x}" cy="${y}" r="24"/>`;
  [[-11,-5,8],[7,-9,7],[3,10,7]].forEach(([dx,dy,rr])=>b+=`<circle class="em-n" cx="${x+dx}" cy="${y+dy}" r="${rr}"/>`);
  for(let i=0;i<18;i++){const a=r()*6.283,k=Math.sqrt(r())*20;b+=`<circle class="em-grn" cx="${(x+Math.cos(a)*k).toFixed(1)}" cy="${(y+Math.sin(a)*k).toFixed(1)}" r="${(1+r()*1.4).toFixed(1)}"/>`}});
 /* ---- mesangium: matrix + a cell with processes ---- */
 b+=`<path class="em-mes" d="M0,0 L${mesR(0).toFixed(1)},0 L`+[...Array(22)].map((_,i)=>{const y=(i+1)/22*(top(0)+6);return mesR(y).toFixed(1)+","+y.toFixed(1)}).join(" L")+` L0,${(top(0)+6).toFixed(1)}Z"/>`;
 b+=`<path class="em-mc" d="M12,44 C54,32 94,52 98,88 C102,124 76,156 42,160 C14,163 2,140 2,112Z"/><ellipse class="em-n" cx="50" cy="100" rx="29" ry="20"/>`;
 if(o.nod){const ny=118;b+=`<circle class="em-nod" cx="58" cy="${ny}" r="40"/>`;
  for(let i=0;i<46;i++){const a=r()*6.283,k=Math.sqrt(r())*37,x=58+Math.cos(a)*k,y=ny+Math.sin(a)*k;b+=`<line class="em-mfib" x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x+5).toFixed(1)}" y2="${(y+3).toFixed(1)}"/>`}}
 if(o.mes)for(let i=0;i<8;i++){const y=46+r()*130,x=12+r()*(mesR(y)-30);b+=dep(x,y,8+r()*7,6+r()*4)}
 if(o.fib)for(let i=0;i<70;i++){const y=40+r()*(top(0)-36),x=4+r()*(mesR(y)-6);b+=`<line class="em-fib" x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x+7).toFixed(1)}" y2="${(y+(r()-.5)*7).toFixed(1)}"/>`}
 /* ---- urinary space ---- */
 b+=`<path class="em-us" d="M`+J(P(bot,0,W))+` L${W},${H} L0,${H}Z"/>`;
 /* ---- endothelium: an attenuated sheet interrupted by fenestrae ---- */
 {let x=120;while(x<W){const w=18+r()*16;b+=`<path class="em-endo" d="${area(endoT,top,x,Math.min(x+w,W))}"/>`;x+=w+7}}
 /* ---- GBM: lamina rara interna · lamina densa · lamina rara externa ---- */
 const dT=x=>top(x)+th*.3,dB=x=>bot(x)-th*.3;
 b+=`<path class="em-lr" d="${area(top,bot)}"/>`;
 if(o.split){/* Alport: the densa splits into interweaving lamellae */
  for(let k=0;k<4;k++){const f1=x=>dT(x)-th*.06+k*th*.13+Math.sin(x/23+k*1.7)*th*.1;
   b+=`<path class="em-densa" d="${area(f1,x=>f1(x)+th*.11)}"/>`}
  for(let k=0;k<3;k++){const f1=x=>dT(x)+k*th*.17-Math.sin(x/17+k)*th*.13;
   b+=`<path class="em-densa" style="opacity:.65" d="${area(f1,x=>f1(x)+th*.08)}"/>`}}
 else b+=`<path class="em-densa" d="${area(dT,dB)}"/>`;
 if(o.intra)b+=`<path class="em-dense" d="${area(x=>dT(x)+th*.07,x=>dB(x)-th*.07)}"/>`;
 if(o.linear)b+=`<path class="em-lin" d="${area(x=>top(x)+th*.42,x=>top(x)+th*.58)}"/>`;
 if(o.fib)for(let i=0;i<60;i++){const x=MX+r()*(W-MX-10),y=top(x)+r()*th;b+=`<line class="em-fib" x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x+8).toFixed(1)}" y2="${(y+(r()-.5)*5).toFixed(1)}"/>`}
 /* ---- subendothelial deposits ---- */
 if(o.sub_en)for(let x=MX+36;x<W-16;x+=48+r()*32)b+=dep(x,top(x)+th*.16,11+r()*9,th*.2+2);
 /* ---- double contour: new basement membrane with mesangial cytoplasm interposed ---- */
 if(o.dbl){b+=`<path class="em-mesx" d="${area(x=>top(x)-9,x=>top(x)-2,MX,W)}"/>`;
  b+=`<path class="em-densa" d="${area(x=>top(x)-14,x=>top(x)-9.5,MX,W)}"/>`}
 /* ---- subepithelial deposits on the outer surface ---- */
 const busy=[];
 if(o.sub_ep==="humps")[214,352,498].forEach(x=>{const w=28,h=27;busy.push([x-w-5,x+w+5]);
  b+=`<path class="em-dep" d="M${x-w},${bot(x-w).toFixed(1)} C${(x-w*.92).toFixed(1)},${(bot(x)+h).toFixed(1)} ${(x+w*.92).toFixed(1)},${(bot(x)+h).toFixed(1)} ${x+w},${bot(x+w).toFixed(1)}Z"/>`;
  for(let i=0;i<11;i++){const a=r()*3.14,k=Math.sqrt(r());b+=`<circle class="em-gran" cx="${(x-Math.cos(a)*w*.68*k).toFixed(1)}" cy="${(bot(x)+3+Math.sin(a)*h*.58*k).toFixed(1)}" r="${(1.1+r()*2).toFixed(1)}"/>`}});
 if(o.sub_ep==="spikes")for(let x=MX+20;x<W-18;x+=44){
  b+=dep(x,bot(x)+8,12,8);
  [-16,16].forEach(dx=>b+=`<path class="em-densa" d="M${(x+dx-3.5).toFixed(1)},${bot(x+dx).toFixed(1)} L${(x+dx).toFixed(1)},${(bot(x+dx)+17).toFixed(1)} L${(x+dx+3.5).toFixed(1)},${bot(x+dx).toFixed(1)}Z"/>`)}
 /* ---- podocyte foot processes ---- */
 if(o.eff){b+=`<path class="em-pod" d="${area(fpT,x=>fpB(x)+2.5*Math.sin(x/13))}"/>`;
  [84,262,430,588].forEach(x=>b+=`<path class="em-pod" d="M${x-26},${fpB(x).toFixed(1)} C${x-22},${(fpB(x)+15).toFixed(1)} ${x+22},${(fpB(x)+15).toFixed(1)} ${x+26},${fpB(x).toFixed(1)}Z"/>`)}
 else for(let x=10;x<W-6;x+=21){if(busy.some(([a,c])=>x>a&&x<c))continue;
  const y=fpT(x),h=fpH*(.86+r()*.26);
  b+=`<path class="em-pod" d="M${x-8},${y.toFixed(1)} C${(x-9).toFixed(1)},${(y+h*.7).toFixed(1)} ${(x-7).toFixed(1)},${(y+h).toFixed(1)} ${x},${(y+h).toFixed(1)} C${(x+7).toFixed(1)},${(y+h).toFixed(1)} ${(x+9).toFixed(1)},${(y+h*.7).toFixed(1)} ${x+8},${y.toFixed(1)}Z"/>`;
  b+=`<line class="em-slit" x1="${(x+10.5).toFixed(1)}" y1="${(fpT(x+10.5)+1).toFixed(1)}" x2="${(x+10.5).toFixed(1)}" y2="${(fpT(x+10.5)+6).toFixed(1)}"/>`}
 /* ---- the podocyte body these processes arise from ---- */
 {const cx=492,y0=fpB(cx)-2;
  b+=`<path class="em-pod" d="M${cx-80},${(y0+5).toFixed(1)} C${cx-58},${(y0-5).toFixed(1)} ${cx+58},${(y0-5).toFixed(1)} ${cx+80},${(y0+5).toFixed(1)} C${cx+95},${(y0+34).toFixed(1)} ${cx+56},${(y0+58).toFixed(1)} ${cx},${(y0+58).toFixed(1)} C${cx-56},${(y0+58).toFixed(1)} ${cx-95},${(y0+34).toFixed(1)} ${cx-80},${(y0+5).toFixed(1)}Z"/>`;
  b+=`<ellipse class="em-n" cx="${cx}" cy="${(y0+32).toFixed(1)}" rx="40" ry="18"/>`;
  for(let i=0;i<22;i++){const a=r()*6.283,k=Math.sqrt(r());b+=`<circle class="em-chr" cx="${(cx+Math.cos(a)*38*k).toFixed(1)}" cy="${(y0+32+Math.sin(a)*16*k).toFixed(1)}" r="${(1.4+r()*2).toFixed(1)}"/>`}
  b+=T(cx-62,(y0+20).toFixed(1),"Podocyte",{c:"s m"})}
 /* ---- EM grain over everything ---- */
 for(let i=0;i<330;i++)b+=`<circle class="em-gr" cx="${(r()*W).toFixed(1)}" cy="${(r()*H).toFixed(1)}" r="${(.6+r()*1.3).toFixed(1)}"/>`;
 /* ---- labels ---- */
 if(ST.labels){
  b+=T(404,28,"Capillary lumen",{c:"s m"})+T(66,22,"Mesangium",{c:"s m"})+T(632,344,"Urinary (Bowman) space",{a:"end",c:"s m"})
   +T(MX+10,endoT(MX+30)-9,"Endothelium (fenestrated)",{a:"start",c:"s m"});
  [[o.split?"GBM split · basket-weave":o.thin?"GBM บาง (thin basement membrane)":o.thick?"GBM หนาสม่ำเสมอ":"GBM · lamina densa ตรงกลาง",118,mid+wav(118)],
   [o.eff?"Foot processes effaced (แบนติดกัน)":"Foot processes + slit diaphragm",286,fpB(286)-6]
  ].forEach(([t,x,y],i)=>{const ly=318+i*28;b+=lead(x,y+4,ly-11)+T(x,ly,t,{c:"s"})});
  const L=[];
  if(o.sub_ep==="humps")L.push(["subepithelial humps",214,bot(214)+27]);
  if(o.sub_ep==="spikes")L.push(["subepithelial deposits + GBM spikes",MX+64,bot(MX+64)+16]);
  if(o.sub_en)L.push(["subendothelial deposits",MX+84,top(MX+84)+6]);
  if(o.dbl)L.push(["double contour + mesangial interposition",400,top(400)-14]);
  if(o.intra)L.push(["dense deposits (intramembranous)",400,mid+wav(400)]);
  if(o.linear)L.push(["linear IgG along GBM",400,mid+wav(400)]);
  L.forEach(([t,x,y],i)=>{const ly=370+i*24;b+=lead(x,y+4,ly-11)+T(x,ly,t,{c:"bad"})});
  const M=[];
  if(o.mes)M.push("mesangial deposits");
  if(o.fib)M.push("random fibrils");
  if(o.nod)M.push("matrix nodule (Kimmelstiel–Wilson)");
  M.forEach((t,i)=>b+=T(8,192+i*18,t,{a:"start",c:"bad"}))}
 return b}
/* IF: one glomerulus, pattern: granular | linear | mesangial | c3 | none | fullhouse */
function glomIF(p){const r=rng(11);let b=`<rect class="if-bg" x="0" y="0" width="640" height="420"/>`;const cx=320,cy=210,R=170;
 b+=`<circle class="if-tuft" cx="${cx}" cy="${cy}" r="${R}"/>`;
 const loops=[];for(let i=0;i<14;i++){const a=i/14*Math.PI*2,k=R*(.45+.35*(i%2));loops.push([cx+Math.cos(a)*k,cy+Math.sin(a)*k,R*.24])}
 if(p==="linear")loops.forEach(([x,y,rr])=>b+=`<circle class="if-lin" cx="${x}" cy="${y}" r="${rr}"/>`);
 else if(p==="mesangial"){for(let i=0;i<60;i++){const a=r()*Math.PI*2,k=r()*R*.55;b+=`<circle class="if-dot" cx="${cx+Math.cos(a)*k}" cy="${cy+Math.sin(a)*k}" r="${4+r()*5}"/>`}
  for(let i=0;i<6;i++){const a=i/6*Math.PI*2;b+=`<path class="if-br" d="M${cx},${cy} L${cx+Math.cos(a)*R*.7},${cy+Math.sin(a)*R*.7}"/>`}}
 else if(p&&p!=="none")loops.forEach(([x,y,rr])=>{for(let i=0;i<14;i++){const a=i/14*Math.PI*2;b+=`<circle class="if-dot" cx="${x+Math.cos(a)*rr}" cy="${y+Math.sin(a)*rr}" r="${p==="c3"?3.5:4.5+r()*3}"/>`}});
 b+=T(cx,404,{granular:"Granular (lumpy-bumpy) IgG + C3",linear:"Linear IgG along GBM",mesangial:"Mesangial IgA (± C3)",c3:"C3 only (no Ig)",none:"Negative / no deposits",fullhouse:"‘Full house’ IgG IgA IgM C3 C1q"}[p]||p,{c:"if-t"});return b}
/* LM: glomerulus with features */
function glomLM(f={}){const r=rng(3);let b=`<rect class="lm-bg" x="0" y="0" width="640" height="420"/>`;const cx=320,cy=210,R=180;
 b+=`<circle class="lm-us" cx="${cx}" cy="${cy}" r="${R}"/><circle class="lm-cap" cx="${cx}" cy="${cy}" r="${R}"/>`;
 if(f.cres)b+=`<path class="lm-cres" d="M${cx-R+4},${cy} A${R-4},${R-4} 0 0 1 ${cx+R*.4},${cy-R*.9} C${cx+R*.1},${cy-R*.6} ${cx-R*.55},${cy-R*.35} ${cx-R*.6},${cy+R*.1}Z"/>`;
 const TR=f.cres?R*.62:R*.86,tc=f.cres?[cx+30,cy+30]:[cx,cy];
 b+=`<circle class="lm-tuft${f.scl?"":""}" cx="${tc[0]}" cy="${tc[1]}" r="${TR}"/>`;
 const N=f.prolif?26:f.normal===false?14:16;for(let i=0;i<N;i++){const k=Math.sqrt((i+.5)/N)*TR*.85,a=i*2.4,x=tc[0]+Math.cos(a)*k,y=tc[1]+Math.sin(a)*k;
  b+=`<circle class="lm-loop${f.thick?" thick":""}${f.wire&&i%3===0?" wire":""}" cx="${x}" cy="${y}" r="${TR*(f.prolif?.08:.13)}"/>`}
 const nn=f.prolif?140:40;for(let i=0;i<nn;i++){const a=r()*Math.PI*2,k=r()*TR*.9;b+=`<circle class="lm-nu" cx="${tc[0]+Math.cos(a)*k}" cy="${tc[1]+Math.sin(a)*k}" r="${f.prolif?3.6:3}"/>`}
 if(f.neut)for(let i=0;i<20;i++){const a=r()*Math.PI*2,k=r()*TR*.8;b+=`<circle class="lm-pmn" cx="${tc[0]+Math.cos(a)*k}" cy="${tc[1]+Math.sin(a)*k}" r="4"/>`}
 if(f.scl)b+=`<path class="lm-scl" d="M${tc[0]},${tc[1]} L${tc[0]+TR},${tc[1]-20} A${TR},${TR} 0 0 1 ${tc[0]+20},${tc[1]+TR}Z"/>`;
 if(f.nod)[[-60,-40],[50,30],[-10,80]].forEach(([dx,dy])=>b+=`<circle class="lm-nod" cx="${tc[0]+dx}" cy="${tc[1]+dy}" r="${TR*.2}"/>`);
 if(f.col)b+=`<circle class="lm-col" cx="${tc[0]}" cy="${tc[1]}" r="${TR*.55}"/>`;
 if(ST.labels){const l=[];if(f.prolif)l.push("hypercellular (proliferation)");if(f.cres)l.push("crescent ใน Bowman space");if(f.scl)l.push("segmental sclerosis");if(f.nod)l.push("nodules (Kimmelstiel–Wilson)");if(f.thick)l.push("capillary walls หนา");if(f.wire)l.push("wire loops");if(f.neut)l.push("neutrophils");if(f.col)l.push("collapsed tuft + podocyte hyperplasia");if(!l.length)l.push("LM เกือบปกติ");
  l.forEach((t2,i)=>b+=T(14,24+i*18,t2,{a:"start",c:"s lm-t"}))}
 return b}

notes:()=>`<h3>นิยามและกลไกร่วม</h3><ul>
<li>Nephrotic syndrome คือ<b>โปรตีนรั่วมากกว่า 3.5 กรัมต่อวัน</b> ซึ่งนำไปสู่ albumin ในเลือดต่ำและบวมทั่วตัว ร่วมกับไขมันในเลือดสูงและไขมันในปัสสาวะ ${S.r}</li>
<li><b>กลไกต้นทางของทุกโรคในกลุ่มนี้คือการบาดเจ็บของ podocyte</b> — เมื่อ foot process แบนราบลง ช่องกรองที่เคยกั้นโปรตีนไว้ก็เปิดออก · จำไว้ว่าเป็นโรคของ<b>ตัวกรอง</b> ไม่ใช่โรคของการอักเสบ ซึ่งเป็นเหตุที่ปัสสาวะมักไม่มีเม็ดเลือดแดงหรือ cast แบบ nephritic ${S.r}</li>
<li>ผลตามมาที่อธิบายอาการได้ทั้งหมด — albumin ต่ำทำให้ oncotic pressure ลดและเกิดบวม · ตับเร่งสร้างไลโปโปรตีนชดเชยจึงเกิดไขมันสูง · และ<b>การสูญเสียโปรตีนตัวอื่นไปกับปัสสาวะ</b> ทั้ง immunoglobulin ที่ทำให้ติดเชื้อง่าย และ antithrombin III ที่ทำให้เกิดลิ่มเลือด ${S.x}</li></ul>
<h3>สาเหตุหลักเรียงตามอายุ</h3><ul>
<li><b>Minimal change disease เป็นสาเหตุที่พบบ่อยที่สุดในเด็ก</b> — โปรตีนรั่วพร้อม <b>foot process แบนราบ แต่ไม่มี antibody สะสมเลย</b> จึงเห็นทุกอย่างปกติด้วยกล้องธรรมดา · ยังไม่ทราบกลไกที่แท้จริง · ชนิดทุติยภูมิถูกกระตุ้นได้ด้วยการติดเชื้อ การฉีดวัคซีน ยา และเนื้องอกบางชนิด · <b>ตอบสนองต่อ steroid ดีมาก</b> ${S.r}</li>
<li><b>FSGS</b> — ชนิดปฐมภูมิเกิดจาก podocyte บาดเจ็บโดยไม่ทราบสาเหตุ ส่วนชนิดทุติยภูมิตามหลัง glomerulonephritis เดิม ความดันโลหิตสูง หรือการติดเชื้ออย่าง HIV · กล้องเห็นหลอดเลือดฝอย<b>ตันเป็นบางส่วนในบาง glomerulus</b> พร้อม foot process ที่หายไป · <b>มักดื้อต่อการรักษาและลุกลามไปเป็น ESRD</b> ${S.r}</li>
<li><b>Membranous nephropathy</b> — สาเหตุที่พบบ่อยในผู้ใหญ่ เกิดจาก immune complex ใต้ epithelium ${S.r}</li>
<li><b>MPGN</b> — ส่วนใหญ่เกิดจาก immune complex สะสมทั้งที่ mesangium และที่ผนังหลอดเลือดฝอย มักสัมพันธ์กับการติดเชื้อทั่วร่างกาย ${S.r}</li>
<li><b>Dense deposit disease</b> ซึ่งเดิมเรียก MPGN type II นิยามด้วยสารทึบอิเล็กตรอนที่แทรกอยู่ใน GBM · พบในเด็กและผู้ใหญ่ตอนต้น และเกิดจาก<b>ความผิดปกติของการควบคุม complement ทางเลือก</b> ทั้งที่เป็นมาแต่กำเนิดและที่เกิดภายหลัง ${S.r}</li>
<li><b>Diabetic nephropathy และ amyloidosis</b> เป็นสาเหตุทุติยภูมิที่ต้องนึกถึงเสมอในผู้ใหญ่ ${S.r}</li></ul>`});
G("membranous","d","Membranous nephropathy",{em:{sub_ep:"spikes",eff:true},if:"granular",lm:{thick:true},sum:[["LM","capillary walls หนา (diffuse) · silver: spikes"],["IF","granular IgG (IgG4) + C3 ตาม GBM"],["EM","subepithelial deposits · spike & dome · effacement"]]},
()=>`<h3>กลไก</h3><ul><li><b>Primary (~75%)</b>: autoantibody ต่อ podocyte antigen — <b>PLA2R</b> (70–80%), THSD7A ${S.r}</li>
 <li><b>Secondary</b>: infections (HBV, HCV, syphilis, malaria), malignant tumors (lung, colon, melanoma), SLE, drugs (NSAIDs, penicillamine, gold) ${S.r}</li>
 <li>Complement C5b–C9 ทำร้าย podocyte · deposits ไม่สัมผัสเลือด จึงไม่ค่อยอักเสบ ${S.r}</li></ul>
 <h3>Clinical</h3><ul><li>ผู้ใหญ่ 30–60 ปี · nephrotic ค่อยๆ เป็น · proteinuria แบบ nonselective · ไม่ค่อยตอบ steroid ${S.r}</li>
 <li>~1/3 หายเอง, 1/3 คงที่, 1/3 แย่ลง · เสี่ยง <b>renal vein thrombosis</b> ${S.r}</li></ul>`);
G("mcd","d","Minimal change disease",{em:{eff:true},if:"none",lm:{},sum:[["LM","ปกติ · PCT มี lipid (lipoid nephrosis)"],["IF","ไม่มี deposits"],["EM","diffuse effacement of foot processes"]]},
()=>`<h3>ลักษณะ</h3><ul><li>สาเหตุ nephrotic ที่พบบ่อยที่สุดใน<b>เด็ก</b> (อายุ 1–7 ปี) ${S.r}</li>
 <li>Selective proteinuria (albumin เป็นหลัก) · ไม่มี HT, ไม่มี hematuria เด่น · ไตทำงานปกติ ${S.r}</li>
 <li>กลไกสงสัยจาก T-cell cytokine/podocyte factor (หรือ anti-nephrin antibody) · สัมพันธ์กับ URI, vaccination, atopy, <b>Hodgkin lymphoma</b>, NSAIDs ${S.r}</li></ul>
 <h3>Prognosis</h3><ul><li>เด็ก &gt;90% ตอบสนองต่อ corticosteroids · อาจกลับเป็นซ้ำ (steroid-dependent) · พยากรณ์ดีมาก ${S.r}</li></ul>`);
G("fsgs","d","Focal segmental glomerulosclerosis",{em:{eff:true},if:"none",lm:{scl:true},sum:[["LM","บาง glomeruli · บางส่วน: sclerosis + hyalinosis"],["IF","IgM, C3 เฉพาะที่ sclerosis (nonspecific)"],["EM","effacement + podocyte detachment"]]},
()=>`<h3>รูปแบบ</h3><ul><li><b>Primary</b> (idiopathic) · <b>secondary</b>: HIV, heroin, sickle cell, obesity, nephron loss (reflux, unilateral agenesis, ปลายทางของ GN) · <b>genetic</b>: NPHS1 (nephrin), NPHS2 (podocin), TRPC6, ACTN4 ${S.r}</li>
 <li><b>APOL1</b> variants (chr 22) เพิ่มความเสี่ยงในคนเชื้อสายแอฟริกา ${S.r}</li></ul>
 <h3>Clinical</h3><ul><li>สาเหตุ nephrotic ที่พบบ่อยในผู้ใหญ่ · hematuria และ HT มากกว่า MCD · proteinuria nonselective ${S.r}</li>
 <li>ตอบ steroid ไม่ดี · ~50% ESRD ใน 10 ปี · กลับเป็นใน graft ได้ 25–50% ${S.r}</li></ul>
 <h3>Collapsing glomerulopathy</h3><ul><li>Tuft ยุบ + podocyte hyperplasia · พยากรณ์แย่ · พบใน <b>HIV-associated nephropathy</b> (+ tubular microcysts) ${S.r}</li></ul>`);
G("mpgn","d","MPGN & C3 glomerulopathy",{em:{sub_en:true,dbl:true},if:"granular",lm:{prolif:true,thick:true},sum:[["LM","lobular, mesangial proliferation · capillary wall หนา (tram-track)"],["IF","MPGN: IgG + C3 · C3G: C3 อย่างเดียว"],["EM","subendothelial deposits · DDD: intramembranous ribbon"]]},
()=>`<h3>MPGN (immune complex)</h3><ul><li>Mesangial cells แทรก (interposition) + BM ใหม่ → <b>double contour/tram-track</b> ใน silver/PAS ${S.r}</li>
 <li>สาเหตุ secondary: chronic infections (<b>HCV</b> ± cryoglobulin, HBV, endocarditis), autoimmune (SLE), malignancy (CLL, lymphoma) ${S.r}</li>
 <li>Nephrotic + nephritic ผสม · 50% ESRD ใน 10 ปี ${S.r}</li></ul>
 <h3>C3 glomerulopathy</h3><ul><li>Alternative complement pathway ผิดปกติ · <b>C3NeF</b> stabilize C3 convertase · C3 ต่ำ ${S.r}</li>
 <li><b>Dense deposit disease</b>: deposits หนาแน่นเป็นริบบิ้นใน lamina densa · <b>C3 GN</b>: deposits ไม่หนาแน่นขนาดนั้น ${S.r}</li></ul>`);

SEC.push({id:"lupus",k:"e",t:"Lupus nephritis",tools:[...GV,["lc",[["2","II"],["3","III"],["4","IV"],["5","V"],["6","VI"]]]],leg:[],
draw(){const c=ST.lc||"4";const D={"2":{em:{mes:true},if:"mesangial",lm:{prolif:false}},"3":{em:{sub_en:true,mes:true},if:"fullhouse",lm:{prolif:true}},"4":{em:{sub_en:true,mes:true},if:"fullhouse",lm:{prolif:true,wire:true}},"5":{em:{sub_ep:"spikes",eff:true},if:"granular",lm:{thick:true}},"6":{em:{thick:true},if:"none",lm:{scl:true}}}[c];
 const txt={"2":"Mesangial proliferative · deposits ใน mesangium","3":"Focal (<50%) proliferative · subendothelial","4":"Diffuse (≥50%) proliferative · wire loops · พบบ่อยและรุนแรงที่สุด","5":"Membranous · subepithelial → nephrotic","6":"Advanced sclerosing (>90% sclerosed)"}[c];
 const b=(ST.gv==="if"?glomIF(D.if):ST.gv==="lm"?glomLM(D.lm):glomEM(D.em))+`<rect class="gsum" x="0" y="420" width="640" height="44"/>`+T(14,447,`Class ${c==="2"?"II":c==="3"?"III":c==="4"?"IV":c==="5"?"V":"VI"} · ${txt}`,{a:"start",c:"bh"});
 return svg(b,"0 0 640 466")},
notes:()=>`<h3>ทำไมต้องแบ่งเป็นชั้น</h3><ul>
<li>SLE ทำให้ไตเสียหายได้<b>แทบทุกแบบ</b> ตั้งแต่เลือดปนปัสสาวะแบบมองไม่เห็น ไปจนถึง nephritic syndrome, RPGN, nephrotic syndrome, ไตวายเฉียบพลันหรือเรื้อรัง และความดันโลหิตสูง — <b>อาการทางคลินิกอย่างเดียวจึงบอกไม่ได้ว่าไตเสียหายแบบไหน</b> ต้องเจาะชิ้นเนื้อ ${S.r}</li>
<li>กลไกเดียวกันทั้งหมดคือ<b>การสะสมของ immune complex</b> ที่ glomerular basement membrane ที่ mesangium หรือทั่วทั้ง glomerulus · ความต่างของแต่ละชั้นคือ<b>สะสมที่ไหนและมากแค่ไหน</b> ${S.r}</li>
<li>ชั้นเหล่านี้<b>คาบเกี่ยวกันได้และเปลี่ยนจากชั้นหนึ่งไปอีกชั้นเมื่อเวลาผ่านไป</b> การเจาะซ้ำเมื่ออาการเปลี่ยนจึงมีเหตุผล ${S.r}</li></ul>
<h3>หกชั้นตามลำดับความรุนแรง</h3><ul>
<li><b>Class I · minimal mesangial</b> — พบน้อยที่สุด มี immune complex ที่ mesangium เห็นได้ด้วย immunofluorescence และ electron microscopy เท่านั้น <b>light microscopy ปกติ</b> ${S.r}</li>
<li><b>Class II · mesangial proliferative</b> — mesangial cell เพิ่มจำนวนพร้อม matrix และมี deposit แบบ granular ที่ mesangium <b>แต่ยังไม่แตะผนังหลอดเลือดฝอย</b> ${S.r}</li>
<li><b>Class III · focal</b> — <b>น้อยกว่า 50% ของ glomeruli</b> เสียหาย อาจเป็นบางส่วนหรือทั้งลูก · เห็น endothelial และ mesangial cell บวมและเพิ่มจำนวน มีเม็ดเลือดขาวแทรก capillary necrosis และ hyaline thrombi บางรายมี crescent · ทางคลินิกตั้งแต่เลือดและโปรตีนในปัสสาวะเล็กน้อยไปจนถึงไตวายเฉียบพลัน และ <b>RBC cast พบบ่อยเมื่อโรคกำลัง active</b> ${S.r}</li>
<li><b>Class IV · diffuse</b> — <b>พบบ่อยที่สุดและรุนแรงที่สุด</b> รอยโรคเหมือน class III แต่กินมากกว่า คือ<b>ตั้งแต่ครึ่งหนึ่งของ glomeruli ขึ้นไป</b> · ลักษณะเด่นคือ <b>wire loop</b> ซึ่งเกิดจาก immune complex สะสมใต้ endothelium จำนวนมากจนผนังหลอดเลือดฝอยหนาขึ้นเห็นได้ด้วยกล้องธรรมดา · ผู้ป่วยมักมีอาการชัดเจน ทั้งเลือดและโปรตีนในปัสสาวะ ความดันสูง และไตเสื่อม ${S.r}</li>
<li><b>Class V · membranous</b> — ผนังหลอดเลือดฝอยหนาขึ้นทั่วจาก immune complex ที่สะสม<b>เหนือ</b> basement membrane เหมือน idiopathic membranous nephropathy · ทำให้เกิด<b>โปรตีนรั่วมากหรือ nephrotic syndrome</b> และเกิดพร้อมกับ class III หรือ IV ได้ ${S.r}</li>
<li><b>Class VI · advanced sclerosing</b> — <b>glomeruli แข็งตัวไปมากกว่า 90%</b> คือ ESRD แล้ว การให้ยากดภูมิไม่ช่วยอะไรอีก ${S.r}</li></ul>
<h3>จุดที่มักถูกมองข้าม</h3><ul>
<li>ความเสียหายไม่ได้อยู่แค่ที่ glomerulus — <b>พบการเปลี่ยนแปลงที่ท่อไตและเนื้อเยื่อระหว่างท่อบ่อย</b> และบางรายรอยโรคที่ tubulointerstitium เด่นกว่าที่ glomerulus เสียอีก ${S.r}</li>
<li>พบ immune complex แบบเดียวกันที่ basement membrane ของท่อไตและของหลอดเลือดฝอยรอบท่อในผู้ป่วยจำนวนมาก ${S.r}</li></ul>`});
G("diabetic","e","Diabetic nephropathy",{em:{thick:true,nod:true},if:"none",lm:{nod:true,thick:true},sum:[["LM","mesangial expansion · nodular glomerulosclerosis (KW) · hyaline arteriolosclerosis"],["IF","linear IgG/albumin ‘sticking’ (nonimmune)"],["EM","GBM หนาทั่วไป (สิ่งแรกที่เห็น)"]]},
()=>`<h3>Lesions</h3><ul><li><b>GBM thickening</b> ทั่วไป · <b>diffuse mesangial sclerosis</b> · <b>nodular (Kimmelstiel–Wilson)</b> PAS+ ${S.r}</li>
 <li><b>Hyaline arteriolosclerosis</b> ทั้ง afferent และ efferent · pyelonephritis และ <b>papillary necrosis</b> พบบ่อย ${S.r}</li>

 <h3>Clinical</h3><ul><li>Microalbuminuria → overt proteinuria → nephrotic → ESRD · สาเหตุ ESRD อันดับ 1 ${S.r}</li></ul>`);

notes:()=>`<h3>สาเหตุ AKI ที่พบบ่อยที่สุด</h3><ul><li><b>Ischemic</b>: shock, hemorrhage, sepsis, burns, DIC ${S.r}</li><li><b>Nephrotoxic</b>: aminoglycosides, radiographic contrast, heavy metals (Hg), ethylene glycol (oxalate crystals), myoglobin/hemoglobin, chemotherapy ${S.r}</li></ul>
 <h3>Pathogenesis</h3><ul><li>Tubular cell บาดเจ็บ (O₂ demand สูง, toxin มาเข้มข้น) → cell polarity เสีย (Na⁺/K⁺-ATPase ย้ายไป apical) → NaCl ถึง macula densa มาก → TGF → vasoconstriction ${S.r}</li>
 <li>เศษเซลล์อุด lumen → ความดันใน tubule ↑ → GFR ↓ · filtrate รั่วกลับ (backleak) ${S.r}</li></ul>
 <h3>Clinical course</h3><ul><li><b>Initiation</b> (~36 ชม.) → <b>maintenance</b> (oliguria, K⁺ สูง, acidosis, คั่งน้ำ) → <b>recovery</b> (polyuria, เสีย K⁺) ${S.r}</li><li>Nonoliguric ATN พบบ่อยกับ nephrotoxin ${S.r}</li></ul>`});

notes:()=>`<h3>ทำไมต้องรู้</h3><ul>
<li><b>ความผิดปกติของการเจริญของไตคิดเป็น 20% ของโรคไตเรื้อรังในเด็ก</b> จึงไม่ใช่เรื่องของรูปร่างแปลก ๆ อย่างเดียว ${S.r}</li>
<li>ส่วนใหญ่<b>ไม่ได้ถ่ายทอดทางพันธุกรรม แต่เป็นความผิดพลาดของการเจริญระหว่างตั้งครรภ์</b> · ยีนที่ควบคุมการเจริญของไตเมื่อเสียไปมักทำให้<b>ผิดปกติทั้งไตและทางเดินปัสสาวะไปด้วยกัน</b> ไม่ใช่อย่างใดอย่างเดียว ${S.r}</li>
<li>ยกเว้น horseshoe kidney แล้ว <b>ที่เหลือทั้งหมดพบไม่บ่อย</b> ${S.r}</li></ul>
<h3>Agenesis</h3><ul>
<li><b>สองข้างเข้ากันไม่ได้กับการมีชีวิต</b> พบในทารกตายคลอด และมาพร้อมความผิดปกติอื่นรวมทั้งปอดที่เจริญไม่เต็มที่ ${S.r}</li>
<li><b>ข้างเดียวพบไม่บ่อยและอยู่ได้ปกติ</b>ถ้าไม่มีความผิดปกติอื่นร่วม · ไตที่เหลือจะโตขึ้นเพื่อชดเชย ${S.r}</li>
<li>แต่จุดสำคัญคือ<b>บางรายไตข้างที่เหลือค่อย ๆ เกิด glomerular sclerosis</b> จากการที่ nephron ที่โตขึ้นต้องปรับตัวรับงานเกินตัว และกลายเป็นโรคไตเรื้อรังในที่สุด — เป็นเหตุผลที่คนไตเดียวต้องติดตามความดันและโปรตีนในปัสสาวะไปตลอด ${S.r}</li></ul>
<h3>Hypoplasia</h3><ul>
<li>คือไต<b>เจริญไม่ถึงขนาดปกติ</b> · สองข้างทำให้ไตวายในวัยเด็กต้น ๆ แต่<b>พบบ่อยกว่าแบบข้างเดียว</b> ${S.r}</li>
<li>พบใน<b>ทารกน้ำหนักตัวน้อย</b> · การแยกจากไตที่ฝ่อภายหลังอาจทำไม่ได้เลยด้วยตาเปล่า ${S.r}</li></ul>
<h3>Ectopic kidney</h3><ul>
<li>ไตอยู่ผิดที่ โดย<b>อยู่เหนือ pelvic brim หรือในอุ้งเชิงกราน</b> · ขนาดมักปกติหรือเล็กลงเล็กน้อย และเนื้อไตไม่มีอะไรผิด ${S.r}</li>
<li>ปัญหาเกิดจาก<b>ตำแหน่ง ไม่ใช่จากเนื้อไต</b> — ท่อไตหักงอหรือบิดจนปัสสาวะไหลไม่สะดวก และนำไปสู่<b>การติดเชื้อแบคทีเรีย</b> ${S.r}</li></ul>
<h3>Horseshoe kidney</h3><ul>
<li>ไตสองข้างเชื่อมกัน โดย<b>เชื่อมที่ขั้วล่าง 90% และที่ขั้วบนเพียง 10%</b> กลายเป็นรูปเกือกม้าที่ทอดข้ามแนวกลางลำตัวอยู่<b>ด้านหน้าของหลอดเลือดใหญ่</b> ${S.r}</li>
<li>พบ <b>1 ใน 500 ถึง 1 ใน 1,000 ของการชันสูตร</b> จึงเป็นความผิดปกติแต่กำเนิดของไตที่พบบ่อยที่สุด ${S.r}</li>
<li>เป็น<b>สองข้างโดยนิยาม</b> — รายที่รายงานว่าเป็นข้างเดียวน่าจะเป็น multicystic dysplasia มากกว่า ${S.r}</li></ul>`});

notes:()=>`<h3>วิธีจัดกลุ่มที่ใช้ได้จริง</h3><ul>
<li>ถุงน้ำในไตเป็นกลุ่มโรคที่ปนกันทั้ง<b>กรรมพันธุ์ ความผิดปกติของการเจริญ และที่เกิดขึ้นภายหลัง</b> จึงต้องแยกด้วยคำถามสามข้อคือ <b>ไตโตหรือเล็ก ถุงน้ำอยู่ตรงไหน และอายุที่เริ่มเป็น</b> ${S.r}</li>
<li>ที่ต้องรู้จักเพราะสามเหตุผล — พบได้บ่อยและมักเป็นปัญหาในการแปลผลภาพถ่าย · บางชนิดเป็น<b>สาเหตุสำคัญของไตวายเรื้อรัง</b> · และบางครั้ง<b>แยกจากเนื้องอกร้ายได้ยาก</b> ${S.r}</li></ul>
<h3>ไตโตทั้งสองข้าง</h3><ul>
<li><b>ADPKD</b> — ถุงน้ำกลมหลายขนาดกระจายทั่วไต เริ่มเห็นในวัยผู้ใหญ่ มาพร้อมถุงน้ำที่ตับและ berry aneurysm · ไตวายในช่วงอายุ 40–60 ปี ${S.r}</li>
<li><b>ARPKD</b> — ไตโตตั้งแต่แรกเกิด ถุงน้ำเรียงเป็นแนวรัศมีตั้งฉากกับผิวไต มาพร้อม congenital hepatic fibrosis ${S.r}</li></ul>
<h3>ไตเล็กหรือไตผิดรูป</h3><ul>
<li><b>Nephronophthisis</b> — ถุงน้ำอยู่ที่รอยต่อ cortex กับ medulla แต่<b>ไตหดเล็กลง</b> เด็กมาด้วยปัสสาวะมาก ซีด และการเจริญเติบโตช้า ${S.r}</li>
<li><b>Multicystic renal dysplasia</b> — ไม่ใช่กรรมพันธุ์ เป็นความผิดปกติของการเจริญ มีถุงน้ำขนาดไม่เท่ากันร่วมกับเนื้อเยื่อผิดที่อย่างกระดูกอ่อน · มักมีความผิดปกติอื่นของทางเดินปัสสาวะร่วมด้วย และ<b>ถ้าเป็นข้างเดียวผ่าตัดออกก็หายขาด</b> ${S.r}</li></ul>
<h3>ถุงน้ำที่อยู่เฉพาะใน medulla</h3><ul>
<li><b>Medullary sponge kidney</b> — collecting duct ใน medulla ขยายเป็นถุงเล็ก ๆ · การทำงานของไตปกติ ปัญหาคือนิ่ว เลือดปนปัสสาวะ และการติดเชื้อซ้ำ · <b>เป็นภาวะที่ไม่ร้ายแรง</b> ${S.r}</li></ul>
<h3>ที่เกิดขึ้นภายหลัง</h3><ul>
<li><b>Acquired cystic disease</b> ในผู้ที่ฟอกเลือดมานาน — ไตเสื่อมแล้วเกิดถุงน้ำขึ้นใหม่ ภาวะแทรกซ้อนคือเลือดออกและการกลายเป็นมะเร็ง ${S.r}</li>
<li><b>Simple cysts</b> ที่ cortex ขนาด 1–5 เซนติเมตร ผนังเรียบใส · พบบ่อยมากและ<b>ไม่มีความหมายทางคลินิก</b> ข้อควรระวังเพียงอย่างเดียวคืออย่าสับสนกับเนื้องอก ${S.r}</li></ul>`});

notes:()=>`<h3>นิยามและเหตุผลที่ต้องรีบ</h3><ul>
<li><b>Hydronephrosis</b> คือการที่ renal pelvis และ calyces ขยายออกพร้อมกับเนื้อไตฝ่อลงเรื่อย ๆ จากการที่ปัสสาวะไหลออกไม่ได้ ${S.r}</li>
<li>การอุดกั้นก่อปัญหาสามทางพร้อมกัน — <b>เพิ่มโอกาสติดเชื้อ</b> เพราะปัสสาวะค้าง · <b>เพิ่มโอกาสเกิดนิ่ว</b> ด้วยเหตุผลเดียวกัน · และ<b>ถ้าไม่แก้ไขแทบทุกรายจบลงด้วยเนื้อไตฝ่อถาวร</b> ${S.r}</li>
<li>จุดที่ทำให้เรื่องนี้คุ้มค่าแก่การตามหาคือ <b>ส่วนใหญ่แก้ไขได้ด้วยการผ่าตัดหรือด้วยยา</b> ต่างจากโรคไตอื่นอีกหลายโรค ${S.r}</li></ul>
<h3>พยาธิสภาพตามเวลา</h3><ul>
<li>ไตอาจโตขึ้นเล็กน้อยจนถึงโตมาก ขึ้นกับ<b>ระดับความรุนแรงและระยะเวลา</b>ของการอุดกั้น ${S.r}</li>
<li>ภาพในระยะแรกคือ pelvis และ calyces ขยาย แต่สิ่งที่มักถูกมองข้ามคือ<b>มีการอักเสบของเนื้อเยื่อระหว่างท่อไตอย่างชัดเจน แม้ไม่มีการติดเชื้อเลย</b> ${S.r}</li>
<li>เมื่อเรื้อรัง ภาพจะกลายเป็น<b>ท่อไตใน cortex ฝ่อพร้อมพังผืดกระจายทั่ว</b> · ในรายที่เป็นมานาน calyces จะถูกเบียดจน<b>เว้าเป็นถ้วย</b> pyramid หายไปทั้งหมด และเนื้อไตบางลงจนเหลือเป็นเพียงเปลือก ${S.r}</li></ul>
<h3>อาการ</h3><ul>
<li>การอุดกั้นเฉียบพลันทำให้ปวดจาก<b>การที่ระบบรวบรวมปัสสาวะหรือเปลือกไตถูกยืด</b> ${S.r}</li>
<li>แต่อาการช่วงแรกส่วนใหญ่มาจาก<b>ต้นเหตุ ไม่ใช่จากตัว hydronephrosis</b> — นิ่วที่ค้างในท่อไตทำให้ปวดบิด ต่อมลูกหมากโตทำให้มีอาการทางการปัสสาวะ ${S.r}</li>
<li><b>การอุดกั้นข้างเดียวเงียบได้นานมาก</b>ไม่ว่าจะอุดสมบูรณ์หรือไม่ เพราะไตอีกข้างรับงานแทนได้หมด หลายรายจึงถูกพบโดยบังเอิญจากการตรวจภาพด้วยเรื่องอื่น ${S.r}</li>
<li><b>ระยะแรกราวไม่กี่สัปดาห์แรกยังแก้กลับได้</b> ซึ่งเป็นเหตุผลที่การอุดกั้นเป็นภาวะที่ต้องวินิจฉัยให้เร็ว ${S.r}</li></ul>`});

notes:()=>`<h3>Renal papillary adenoma</h3><ul>
<li>เป็นเนื้องอกที่พบบ่อยในการชันสูตร · มีลักษณะทางพันธุกรรมคือ<b>trisomy 7 และ 17</b> ซึ่ง<b>เหมือนกับ papillary renal cell carcinoma</b> จึงเป็นเหตุที่เส้นแบ่งระหว่างสองอย่างนี้ไม่คมชัด ${S.r}</li>
<li><b>ใช้ขนาดเป็นตัวบอกพยากรณ์โรค</b> โดยมีจุดตัดที่แยกก้อนที่แพร่กระจายจากก้อนที่แทบไม่แพร่ · แต่เพราะมีรายงานก้อนเล็กที่แพร่กระจายอยู่เป็นครั้งคราว <b>บางคนจึงถือว่า adenoma ทุกก้อนไม่ว่าขนาดเท่าไรมีศักยภาพเป็นมะเร็งได้</b> ${S.r}</li></ul>
<h3>Angiomyolipoma</h3><ul>
<li>ประกอบด้วย<b>หลอดเลือด กล้ามเนื้อเรียบ และไขมัน</b> ซึ่งมาจาก perivascular epithelioid cell — องค์ประกอบไขมันนี้คือสิ่งที่ทำให้<b>วินิจฉัยได้จากภาพถ่ายโดยไม่ต้องเจาะ</b> ${S.r}</li>
<li>พบในผู้ป่วย <b>tuberous sclerosis</b> ซึ่งเกิดจากการกลายพันธุ์แบบสูญเสียการทำงานของยีนกดเนื้องอก <b>TSC1 หรือ TSC2</b> ${S.r}</li>
<li>tuberous sclerosis มีลักษณะคือ<b>รอยโรคใน cerebral cortex ที่ทำให้ชักและมี intellectual disability</b> ร่วมกับความผิดปกติของผิวหนังหลายแบบ ${S.r}</li>
<li>ความสำคัญทางคลินิกคือ<b>เสี่ยงต่อการมีเลือดออก</b> ซึ่งเป็นเหตุผลของการติดตามและการรักษาเมื่อก้อนโตถึงขนาดหนึ่ง ${S.x}</li></ul>
<h3>Oncocytoma</h3><ul>
<li>เป็นเนื้องอกของเยื่อบุที่ประกอบด้วย<b>เซลล์ขนาดใหญ่ติดสี eosinophil เข้ม มีนิวเคลียสกลมเล็กที่หน้าตาไม่ร้าย</b> ${S.r}</li>
<li><b>โตได้ถึง 12 เซนติเมตร</b> ซึ่งใหญ่พอที่จะทำให้สับสนกับมะเร็ง ${S.r}</li>
<li>มี<b>บางครอบครัวที่เนื้องอกชนิดนี้เกิดหลายก้อนหลายตำแหน่งแทนที่จะเป็นก้อนเดียว</b> ${S.r}</li></ul>`});

 /* red cells: biconcave, deformed by the loop */
 [[300,78,48,11],[476,62,42,-13],[212,116,34,7]].forEach(([x,y,R,s])=>{

 if(o.neut)[[372,124],[536,116],[236,44]].forEach(([x,y])=>{

  for(let i=0;i<18;i++){const a=r()*6.283,k=Math.sqrt(r())*20;b+=`<circle class="em-grn" cx="${(x+Math.cos(a)*k).toFixed(1)}" cy="${(y+Math.sin(a)*k).toFixed(1)}" r="${(1+r()*1.4).toFixed(1)}"/>`}});
 /* ---- mesangium: matrix + a cell with processes ---- */
 b+=`<path class="em-mes" d="M0,0 L${mesR(0).toFixed(1)},0 L`+[...Array(22)].map((_,i)=>{const y=(i+1)/22*(top(0)+6);return mesR(y).toFixed(1)+","+y.toFixed(1)}).join(" L")+` L0,${(top(0)+6).toFixed(1)}Z"/>`;
 b+=`<path class="em-mc" d="M12,44 C54,32 94,52 98,88 C102,124 76,156 42,160 C14,163 2,140 2,112Z"/><ellipse class="em-n" cx="50" cy="100" rx="29" ry="20"/>`;
 if(o.nod){const ny=118;b+=`<circle class="em-nod" cx="58" cy="${ny}" r="40"/>`;
  for(let i=0;i<46;i++){const a=r()*6.283,k=Math.sqrt(r())*37,x=58+Math.cos(a)*k,y=ny+Math.sin(a)*k;b+=`<line class="em-mfib" x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x+5).toFixed(1)}" y2="${(y+3).toFixed(1)}"/>`}}
 if(o.mes)for(let i=0;i<8;i++){const y=46+r()*130,x=12+r()*(mesR(y)-30);b+=dep(x,y,8+r()*7,6+r()*4)}
 if(o.fib)for(let i=0;i<70;i++){const y=40+r()*(top(0)-36),x=4+r()*(mesR(y)-6);b+=`<line class="em-fib" x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x+7).toFixed(1)}" y2="${(y+(r()-.5)*7).toFixed(1)}"/>`}
 /* ---- urinary space ---- */
 b+=`<path class="em-us" d="M`+J(P(bot,0,W))+` L${W},${H} L0,${H}Z"/>`;
 /* ---- endothelium: an attenuated sheet interrupted by fenestrae ---- */
 {let x=120;while(x<W){const w=18+r()*16;b+=`<path class="em-endo" d="${area(endoT,top,x,Math.min(x+w,W))}"/>`;x+=w+7}}
 /* ---- GBM: lamina rara interna · lamina densa · lamina rara externa ---- */
 const dT=x=>top(x)+th*.3,dB=x=>bot(x)-th*.3;

 if(o.split){/* Alport: the densa splits into interweaving lamellae */

 else b+=`<path class="em-densa" d="${area(dT,dB)}"/>`;
 if(o.intra)b+=`<path class="em-dense" d="${area(x=>dT(x)+th*.07,x=>dB(x)-th*.07)}"/>`;
 if(o.linear)b+=`<path class="em-lin" d="${area(x=>top(x)+th*.42,x=>top(x)+th*.58)}"/>`;
 if(o.fib)for(let i=0;i<60;i++){const x=MX+r()*(W-MX-10),y=top(x)+r()*th;b+=`<line class="em-fib" x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x+8).toFixed(1)}" y2="${(y+(r()-.5)*5).toFixed(1)}"/>`}
 /* ---- subendothelial deposits ---- */
 if(o.sub_en)for(let x=MX+36;x<W-16;x+=48+r()*32)b+=dep(x,top(x)+th*.16,11+r()*9,th*.2+2);
 /* ---- double contour: new basement membrane with mesangial cytoplasm interposed ---- */
 if(o.dbl){b+=`<path class="em-mesx" d="${area(x=>top(x)-9,x=>top(x)-2,MX,W)}"/>`;

 /* ---- subepithelial deposits on the outer surface ---- */
 const busy=[];
 if(o.sub_ep==="humps")[214,352,498].forEach(x=>{const w=28,h=27;busy.push([x-w-5,x+w+5]);
  b+=`<path class="em-dep" d="M${x-w},${bot(x-w).toFixed(1)} C${(x-w*.92).toFixed(1)},${(bot(x)+h).toFixed(1)} ${(x+w*.92).toFixed(1)},${(bot(x)+h).toFixed(1)} ${x+w},${bot(x+w).toFixed(1)}Z"/>`;
  for(let i=0;i<11;i++){const a=r()*3.14,k=Math.sqrt(r());b+=`<circle class="em-gran" cx="${(x-Math.cos(a)*w*.68*k).toFixed(1)}" cy="${(bot(x)+3+Math.sin(a)*h*.58*k).toFixed(1)}" r="${(1.1+r()*2).toFixed(1)}"/>`}});
 if(o.sub_ep==="spikes")for(let x=MX+20;x<W-18;x+=44){
  b+=dep(x,bot(x)+8,12,8);
  [-16,16].forEach(dx=>b+=`<path class="em-densa" d="M${(x+dx-3.5).toFixed(1)},${bot(x+dx).toFixed(1)} L${(x+dx).toFixed(1)},${(bot(x+dx)+17).toFixed(1)} L${(x+dx+3.5).toFixed(1)},${bot(x+dx).toFixed(1)}Z"/>`)}
 /* ---- podocyte foot processes ---- */
 if(o.eff){b+=`<path class="em-pod" d="${area(fpT,x=>fpB(x)+2.5*Math.sin(x/13))}"/>`;
  [84,262,430,588].forEach(x=>b+=`<path class="em-pod" d="M${x-26},${fpB(x).toFixed(1)} C${x-22},${(fpB(x)+15).toFixed(1)} ${x+22},${(fpB(x)+15).toFixed(1)} ${x+26},${fpB(x).toFixed(1)}Z"/>`)}
 else for(let x=10;x<W-6;x+=21){if(busy.some(([a,c])=>x>a&&x<c))continue;
  const y=fpT(x),h=fpH*(.86+r()*.26);
  b+=`<path class="em-pod" d="M${x-8},${y.toFixed(1)} C${(x-9).toFixed(1)},${(y+h*.7).toFixed(1)} ${(x-7).toFixed(1)},${(y+h).toFixed(1)} ${x},${(y+h).toFixed(1)} C${(x+7).toFixed(1)},${(y+h).toFixed(1)} ${(x+9).toFixed(1)},${(y+h*.7).toFixed(1)} ${x+8},${y.toFixed(1)}Z"/>`;
  b+=`<line class="em-slit" x1="${(x+10.5).toFixed(1)}" y1="${(fpT(x+10.5)+1).toFixed(1)}" x2="${(x+10.5).toFixed(1)}" y2="${(fpT(x+10.5)+6).toFixed(1)}"/>`}
 /* ---- the podocyte body these processes arise from ---- */
 {const cx=492,y0=fpB(cx)-2;
  b+=`<path class="em-pod" d="M${cx-80},${(y0+5).toFixed(1)} C${cx-58},${(y0-5).toFixed(1)} ${cx+58},${(y0-5).toFixed(1)} ${cx+80},${(y0+5).toFixed(1)} C${cx+95},${(y0+34).toFixed(1)} ${cx+56},${(y0+58).toFixed(1)} ${cx},${(y0+58).toFixed(1)} C${cx-56},${(y0+58).toFixed(1)} ${cx-95},${(y0+34).toFixed(1)} ${cx-80},${(y0+5).toFixed(1)}Z"/>`;
  b+=`<ellipse class="em-n" cx="${cx}" cy="${(y0+32).toFixed(1)}" rx="40" ry="18"/>`;
  for(let i=0;i<22;i++){const a=r()*6.283,k=Math.sqrt(r());b+=`<circle class="em-chr" cx="${(cx+Math.cos(a)*38*k).toFixed(1)}" cy="${(y0+32+Math.sin(a)*16*k).toFixed(1)}" r="${(1.4+r()*2).toFixed(1)}"/>`}
  b+=T(cx-62,(y0+20).toFixed(1),"Podocyte",{c:"s m"})}
 /* ---- EM grain over everything ---- */
 for(let i=0;i<330;i++)b+=`<circle class="em-gr" cx="${(r()*W).toFixed(1)}" cy="${(r()*H).toFixed(1)}" r="${(.6+r()*1.3).toFixed(1)}"/>`;
 /* ---- labels ---- */
 if(ST.labels){
  b+=T(404,28,"Capillary lumen",{c:"s m"})+T(66,22,"Mesangium",{c:"s m"})+T(632,344,"Urinary (Bowman) space",{a:"end",c:"s m"})
   +T(MX+10,endoT(MX+30)-9,"Endothelium (fenestrated)",{a:"start",c:"s m"});
  [[o.split?"GBM split · basket-weave":o.thin?"GBM บาง (thin basement membrane)":o.thick?"GBM หนาสม่ำเสมอ":"GBM · lamina densa ตรงกลาง",118,mid+wav(118)],
   [o.eff?"Foot processes effaced (แบนติดกัน)":"Foot processes + slit diaphragm",286,fpB(286)-6]
  ].forEach(([t,x,y],i)=>{const ly=318+i*28;b+=lead(x,y+4,ly-11)+T(x,ly,t,{c:"s"})});
  const L=[];
  if(o.sub_ep==="humps")L.push(["subepithelial humps",214,bot(214)+27]);
  if(o.sub_ep==="spikes")L.push(["subepithelial deposits + GBM spikes",MX+64,bot(MX+64)+16]);
  if(o.sub_en)L.push(["subendothelial deposits",MX+84,top(MX+84)+6]);
  if(o.dbl)L.push(["double contour + mesangial interposition",400,top(400)-14]);
  if(o.intra)L.push(["dense deposits (intramembranous)",400,mid+wav(400)]);
  if(o.linear)L.push(["linear IgG along GBM",400,mid+wav(400)]);
  L.forEach(([t,x,y],i)=>{const ly=370+i*24;b+=lead(x,y+4,ly-11)+T(x,ly,t,{c:"bad"})});
  const M=[];

  if(o.fib)M.push("random fibrils");
  if(o.nod)M.push("matrix nodule (Kimmelstiel–Wilson)");
  M.forEach((t,i)=>b+=T(8,192+i*18,t,{a:"start",c:"bad"}))}
 return b}
/* IF: one glomerulus, pattern: granular | linear | mesangial | c3 | none | fullhouse */
function glomIF(p){const r=rng(11);let b=`<rect class="if-bg" x="0" y="0" width="640" height="420"/>`;const cx=320,cy=210,R=170;
 b+=`<circle class="if-tuft" cx="${cx}" cy="${cy}" r="${R}"/>`;
 const loops=[];for(let i=0;i<14;i++){const a=i/14*Math.PI*2,k=R*(.45+.35*(i%2));loops.push([cx+Math.cos(a)*k,cy+Math.sin(a)*k,R*.24])}
 if(p==="linear")loops.forEach(([x,y,rr])=>b+=`<circle class="if-lin" cx="${x}" cy="${y}" r="${rr}"/>`);
 else if(p==="mesangial"){for(let i=0;i<60;i++){const a=r()*Math.PI*2,k=r()*R*.55;b+=`<circle class="if-dot" cx="${cx+Math.cos(a)*k}" cy="${cy+Math.sin(a)*k}" r="${4+r()*5}"/>`}
  for(let i=0;i<6;i++){const a=i/6*Math.PI*2;b+=`<path class="if-br" d="M${cx},${cy} L${cx+Math.cos(a)*R*.7},${cy+Math.sin(a)*R*.7}"/>`}}
 else if(p&&p!=="none")loops.forEach(([x,y,rr])=>{for(let i=0;i<14;i++){const a=i/14*Math.PI*2;b+=`<circle class="if-dot" cx="${x+Math.cos(a)*rr}" cy="${y+Math.sin(a)*rr}" r="${p==="c3"?3.5:4.5+r()*3}"/>`}});
 b+=T(cx,404,{granular:"Granular (lumpy-bumpy) IgG + C3",linear:"Linear IgG along GBM",mesangial:"Mesangial IgA (± C3)",c3:"C3 only (no Ig)",none:"Negative / no deposits",fullhouse:"‘Full house’ IgG IgA IgM C3 C1q"}[p]||p,{c:"if-t"});return b}
/* LM: glomerulus with features */
function glomLM(f={}){const r=rng(3);let b=`<rect class="lm-bg" x="0" y="0" width="640" height="420"/>`;const cx=320,cy=210,R=180;
 b+=`<circle class="lm-us" cx="${cx}" cy="${cy}" r="${R}"/><circle class="lm-cap" cx="${cx}" cy="${cy}" r="${R}"/>`;
 if(f.cres)b+=`<path class="lm-cres" d="M${cx-R+4},${cy} A${R-4},${R-4} 0 0 1 ${cx+R*.4},${cy-R*.9} C${cx+R*.1},${cy-R*.6} ${cx-R*.55},${cy-R*.35} ${cx-R*.6},${cy+R*.1}Z"/>`;
 const TR=f.cres?R*.62:R*.86,tc=f.cres?[cx+30,cy+30]:[cx,cy];
 b+=`<circle class="lm-tuft${f.scl?"":""}" cx="${tc[0]}" cy="${tc[1]}" r="${TR}"/>`;
 const N=f.prolif?26:f.normal===false?14:16;for(let i=0;i<N;i++){const k=Math.sqrt((i+.5)/N)*TR*.85,a=i*2.4,x=tc[0]+Math.cos(a)*k,y=tc[1]+Math.sin(a)*k;
  b+=`<circle class="lm-loop${f.thick?" thick":""}${f.wire&&i%3===0?" wire":""}" cx="${x}" cy="${y}" r="${TR*(f.prolif?.08:.13)}"/>`}
 const nn=f.prolif?140:40;for(let i=0;i<nn;i++){const a=r()*Math.PI*2,k=r()*TR*.9;b+=`<circle class="lm-nu" cx="${tc[0]+Math.cos(a)*k}" cy="${tc[1]+Math.sin(a)*k}" r="${f.prolif?3.6:3}"/>`}
 if(f.neut)for(let i=0;i<20;i++){const a=r()*Math.PI*2,k=r()*TR*.8;b+=`<circle class="lm-pmn" cx="${tc[0]+Math.cos(a)*k}" cy="${tc[1]+Math.sin(a)*k}" r="4"/>`}
 if(f.scl)b+=`<path class="lm-scl" d="M${tc[0]},${tc[1]} L${tc[0]+TR},${tc[1]-20} A${TR},${TR} 0 0 1 ${tc[0]+20},${tc[1]+TR}Z"/>`;
 if(f.nod)[[-60,-40],[50,30],[-10,80]].forEach(([dx,dy])=>b+=`<circle class="lm-nod" cx="${tc[0]+dx}" cy="${tc[1]+dy}" r="${TR*.2}"/>`);
 if(f.col)b+=`<circle class="lm-col" cx="${tc[0]}" cy="${tc[1]}" r="${TR*.55}"/>`;
 if(ST.labels){const l=[];if(f.prolif)l.push("hypercellular (proliferation)");if(f.cres)l.push("crescent ใน Bowman space");if(f.scl)l.push("segmental sclerosis");if(f.nod)l.push("nodules (Kimmelstiel–Wilson)");if(f.thick)l.push("capillary walls หนา");if(f.wire)l.push("wire loops");if(f.neut)l.push("neutrophils");if(f.col)l.push("collapsed tuft + podocyte hyperplasia");if(!l.length)l.push("LM เกือบปกติ");
  l.forEach((t2,i)=>b+=T(14,24+i*18,t2,{a:"start",c:"s lm-t"}))}
 return b}

 if(i<R.length-1)b+=`<path class="arw" d="M320,${y+58} L320,${y+76}" marker-end="url(#ah)"/>`;y+=80});return svg(b,`0 0 640 ${y}`)}

<h3>Ureteropelvic junction obstruction</h3><ul>
<li>เป็น<b>สาเหตุของ hydronephrosis ที่พบบ่อยที่สุดในทารกและเด็ก</b> ${S.r}</li>
<li>รายที่มาตั้งแต่วัยทารก<b>พบในเพศชายมากกว่า</b> · <b>เป็นสองข้างราว 20%</b> · และ<b>มักมีความผิดปกติอื่นร่วม</b> ${S.r}</li>

notes:()=>`<h3>Why this group is worth knowing at all</h3><ul>
 <li>รอยโรคกลุ่มนี้สำคัญเพราะมัน<b>เลียนแบบมะเร็ง bladder ทั้งทางคลินิกและทางจุลพยาธิวิทยา</b> — malakoplakia, polypoid cystitis, cystitis cystica et glandularis และ nephrogenic adenoma ${S.r}</li>
 <li><b>Polypoid cystitis</b> เกิดจากการระคายเคืองเยื่อบุ โดยเฉพาะจากการใส่เครื่องมือและสายสวนคาไว้ · submucosal edema ดัน urothelium ขึ้นเป็นติ่งป้าน ๆ จนถูกเข้าใจผิดว่าเป็น papillary urothelial carcinoma ${S.r}</li></ul>
 <h3>Cystitis cystica et glandularis</h3><ul>
 <li>von Brunn nest งอกลงไปใน lamina propria แล้วเซลล์ตรงกลาง nest เปลี่ยนเป็น cuboidal/columnar (glandularis) หรือยุบเป็นโพรงบุด้วย urothelium แบน (cystica) · สองอย่างนี้มักอยู่ด้วยกันจึงเรียกรวม ${S.r}</li>
 <li>พบบ่อยและไม่มีความสำคัญ ยกเว้นเมื่อเป็น <b>intestinal metaplasia</b> ที่กว้างขวางและหลายตำแหน่ง ซึ่งเป็น precursor ของ adenocarcinoma ${S.r}</li></ul>
 <h3>Squamous metaplasia — the adjective matters</h3><ul>
 <li>เป็นการตอบสนองต่อการบาดเจ็บเรื้อรัง โดยเปลี่ยนไปเป็นเยื่อบุชนิด squamous ซึ่ง<b>ทนกว่า</b> · เป็นได้ทั้งชนิด keratinizing และ nonkeratinizing ${S.r}</li>
 <li>ที่เป็น precursor ของ dysplasia, CIS และ SCC คือชนิด <b>keratinizing</b> ที่กว้างขวางและหลายตำแหน่งเท่านั้น · ตัวอย่างคลาสสิกคือ schistosomiasis ของ bladder ${S.r}</li>
 <li>ต้องแยกจาก glycogenated squamous epithelium ซึ่ง<b>ปกติ</b>อยู่ที่ trigone ของผู้หญิง ${S.r}</li></ul>
 <h3>Nephrogenic adenoma</h3><ul>
 <li>อาจไม่ใช่ metaplasia จริง — หลักฐานจากผู้รับไตปลูกถ่ายชี้ว่าอย่างน้อยบางรอยโรคเกิดจาก renal tubular cell ที่หลุดมาฝังตรงที่เยื่อบุ bladder ถลอก ${S.r}</li>
 <li>ส่วนใหญ่เล็กกว่า 1 cm แต่ที่ใหญ่กว่านั้นมีรายงานและทำให้สงสัยมะเร็งได้ · ที่หลอกยิ่งกว่าคือ tubular proliferation สามารถแทรกลงไปใน lamina propria และ detrusor ชั้นตื้น จนดูเหมือนมะเร็งลุกล้ำใต้กล้อง ${S.r}</li></ul>`});

 <li>CIS คือเซลล์ที่มีลักษณะมะเร็งแต่ยังอยู่ในชั้นเยื่อบุ ไม่ลุกล้ำ basement membrane · ตามนิยามแล้วถือเป็น <b>high grade เสมอ</b> ${S.r}</li>
 <li>ในผู้ป่วยมะเร็ง bladder ที่ลุกล้ำประมาณครึ่งหนึ่ง ก้อนลุกล้ำผนังไปแล้วตั้งแต่แรกพบและ<b>หา precursor ไม่เจอ</b> — เข้าใจว่าถูกส่วน high-grade ที่ลุกล้ำทำลายไปหมด ${S.r}</li></ul>
 <h3>The two papillomas</h3><ul>
 <li><b>Exophytic papilloma</b> มี fibrovascular core บุด้วย urothelium ที่เหมือนปกติทุกประการ · recur และ progression พบน้อยมาก ${S.r}</li>
 <li><b>Inverted papilloma</b> เป็นสายเซลล์ urothelium หน้าตาปกติที่ไหลลงไปใน lamina propria — <b>ดูเหมือนลุกล้ำแต่ benign สนิท</b> ${S.r}</li></ul>
 <h3>Why cytology works, and why recurrence is not failure</h3><ul>
 <li>High-grade papillary UC และ CIS มีจุดร่วมคือเซลล์<b>ไม่เกาะกัน</b> จึงหลุดลงปัสสาวะ ซึ่งเป็นเหตุผลที่ urine cytology จับสองตัวนี้ได้ดี · ถ้าหลุดมากอาจเหลือเซลล์เกาะอยู่บน basement membrane เพียงไม่กี่เซลล์ ${S.r}</li>
 <li>การกลับเป็นซ้ำส่วนใหญ่ขึ้นที่<b>ตำแหน่งอื่น</b> แต่ยังเป็น clone เดียวกับก้อนเดิม — คือเซลล์หลุดไปฝังที่อื่น · บางส่วนเป็น clone คนละอันซึ่งคือ second primary ${S.r}</li>
 <li>ความเสี่ยงของการกลับเป็นซ้ำและการเลื่อนระดับขึ้นกับขนาด stage grade ความหลายตำแหน่ง ประวัติเคยเป็นซ้ำ และการมี <b>CIS ในเยื่อบุรอบ ๆ</b> ${S.r}</li>
 <li>Papilloma, PUNLMP และ low-grade papillary UC มี 10-year survival <b>98% ไม่ว่าจะเป็นซ้ำกี่ครั้ง</b> — การเป็นซ้ำจึงไม่เท่ากับพยากรณ์โรคแย่ ${S.r}</li>
 <li>CIS อย่างเดียว vs CIS ที่มากับ invasive: ไปเป็น muscle-invasive 28% vs 59% · เสียชีวิต 7% vs 45% ${S.r}</li>
 <li>Non-muscle-invasive ต้องติดตามตลอดชีวิตด้วย cystoscopy, biopsy และ urine cytology ${S.r}</li></ul>`});

 <h3>Where the survival curve actually breaks</h3><ul>
 <li>การลุกล้ำ lamina propria ทำให้พยากรณ์โรคแย่ลงก็จริง แต่ที่อัตรารอดชีวิต<b>ตกฮวบ</b>คือเมื่อลุกล้ำ muscularis propria (detrusor) · เมื่อถึงจุดนั้นแล้วอัตราตายที่ 5 ปีคือ 30% ${S.r}</li>
 <li>Non-muscle-invasive (Ta, Tis, T1) = 70–80% · muscle-invasive = 20–30% และ<b>ส่วนน้อยเท่านั้น</b>ที่มีประวัติเป็น non-muscle-invasive มาก่อน — ส่วนใหญ่จึงเกิดขึ้นแบบลุกล้ำตั้งแต่ต้น ${S.r}</li>

 <li>ก้อน papillary ที่เล็ก เฉพาะที่ และ low grade — <b>TURBT เพื่อวินิจฉัยก็พอ</b> ไม่ต้องทำอะไรต่อ ${S.r}</li>

 <li>Non-muscle-invasive กลับเป็นซ้ำได้สูงถึง <b>70%</b> และเลื่อนระดับ grade หรือ stage ขึ้นได้ จึงต้องติดตามตลอด ${S.r}</li></ul>

 <li>CIS หรือ high-grade papillary ที่<b>ดื้อต่อ BCG</b> และยาใส่กระเพาะปัสสาวะอื่น ${S.r}</li>

 <li>บางรายของ non-muscle-invasive high-grade papillary ที่หลายตำแหน่งจนใหญ่เกินกว่าจะตัดหมดด้วย TURBT ${S.r}</li>

/* ---------- 320 · Cell biology ---------- */
HS("320","a","cb-seg","Segmental transport",{
draw:()=>tbl(["Segment","What it moves"],[
 ["Proximal tubule","~60% ของ Na⁺ และน้ำ · glucose (SGLT2), amino acids, HCO₃⁻, PO₄ · iso-osmotic"],
 ["Thin descending limb","ดูดน้ำ (AQP1) · สร้าง medullary gradient"],
 ["Thick ascending limb","NKCC2 ~25% ของ Na⁺ · กันน้ำ · Ca²⁺ Mg²⁺ paracellular · target ของ loop diuretics"],
 ["Distal convoluted tubule","NCC (thiazide) · Ca²⁺ ผ่าน TRPV5"],
 ["Collecting duct","principal: ENaC + ROMK (aldosterone) · AQP2 (vasopressin) · intercalated: H⁺/HCO₃⁻"]]),
notes:()=>`<h3>The division of labour along the nephron</h3><ul>
 <li><b>Proximal tubule</b> ทำหน้าที่ขนของปริมาณมากแบบ iso-osmotic คือน้ำตามโซเดียมไปทันที น้ำในท่อจึงลดปริมาณลงมากแต่ความเข้มข้นแทบไม่เปลี่ยน — ที่นี่จึงไม่ใช่จุดที่ร่างกายใช้ปรับความเข้มข้นของปัสสาวะ ${S.g}</li>
 <li><b>Loop of Henle</b> เป็นตัวสร้างความต่างของ osmolarity ในชั้น medulla ด้วย countercurrent multiplier จนถึงประมาณ 1200 mOsm/L ซึ่งเป็นทุนที่ collecting duct เอาไปใช้ดูดน้ำกลับทีหลัง ${S.g}</li>
 <li>น้ำที่ออกจาก loop เข้าสู่ distal convoluted tubule จึง<b>เจือจาง</b> เหลือราว 100 mOsm/L · ปลายท่อจึงเลือกได้ทั้งสองทาง คือปล่อยเจือจางออกไป หรือดูดน้ำกลับจนปัสสาวะเข้มข้น ${S.g}</li>
 <li><b>Distal nephron</b> ขน Na⁺ ปริมาณน้อยแต่อยู่ใต้การควบคุมของฮอร์โมน (aldosterone ผ่าน ENaC/ROMK · vasopressin ผ่าน AQP2) จึงเป็นจุดที่ร่างกายใช้ปรับละเอียด และเป็นจุดที่ยาและโรคพันธุกรรมส่วนใหญ่ลงมือ ${S.h}</li></ul>
 <h3>Why loop diuretics impair both concentrating and diluting</h3><ul>
 <li>เพราะ loop diuretic ไม่ได้แค่ขับ Na⁺ ออก แต่<b>ทำลาย countercurrent multiplier</b> ด้วย — medullary gradient จางลง ไตจึงทั้งทำปัสสาวะให้เข้มข้นไม่ได้ และทำให้เจือจางไม่ได้ ${S.g}</li>
 <li>GFR เองถูกกำหนดโดย Starling forces, afferent/efferent tone, tubuloglomerular feedback และ RAS ${S.h}</li></ul>
 <div class="pearl">transporter ของแต่ละ segment เป็นทั้งเป้ายาและตำแหน่งของโรคกรรมพันธุ์ — ดูหัวข้อถัดไป</div>`});
HS("320","a","cb-inh","Inherited tubular disorders (Table 320-1)",{
draw:()=>{const R=[["PT","Fanconi (Dent, cystinosis) · proximal RTA · cystinuria · renal glycosuria (SGLT2)"],["TAL","Bartter (NKCC2, ROMK, ClC-Kb, barttin, CaSR) → hypoK alkalosis, Ca²⁺ ในปัสสาวะสูง"],["DCT","Gitelman (NCC) → hypoK alkalosis, Mg ต่ำ, Ca²⁺ ในปัสสาวะต่ำ · Gordon (WNK) → HT, K สูง"],["CD","Liddle (ENaC gain) → HT, K ต่ำ · PHA-1 (ENaC/MR loss) · distal RTA · nephrogenic DI (V2R, AQP2)"]];
 let b="";R.forEach(([s,d],i)=>{const y=14+i*82;b+=`<rect class="box ${["vn","ar","gl","vn"][i]}" x="14" y="${y}" width="80" height="70" rx="12"/>`+T(54,y+42,s,{c:"bb"})+`<rect class="box" x="104" y="${y}" width="522" height="70" rx="12"/>`+wrapT(118,y+28,d,70,"s")});return svg(b,"0 0 640 346")},
notes:()=>`<h3>วิธีจำที่ได้ผลที่สุด</h3><ul>
<li>โรคท่อไตที่ถ่ายทอดทางพันธุกรรมแต่ละโรค<b>เลียนแบบยาขับปัสสาวะที่ออกฤทธิ์ตรงส่วนนั้นพอดี</b> ถ้ารู้ว่ายาตัวไหนทำอะไรกับเกลือแร่ ก็ทำนายผลเลือดของโรคได้ทันทีโดยไม่ต้องท่อง ${S.x}</li></ul>
<h3>Thick ascending limb และ distal tubule</h3><ul>
<li><b>Bartter syndrome</b> เสียการทำงานของ NKCC2 หรือโปรตีนที่ทำงานร่วมกัน — เหมือน<b>กิน loop diuretic ตลอดชีวิต</b> จึงได้โพแทสเซียมต่ำ เลือดเป็นด่าง และ<b>แคลเซียมในปัสสาวะสูง</b> เพราะ TAL เป็นที่ที่ดูดกลับแคลเซียมตามความต่างศักย์ ${S.h}</li>
<li><b>Gitelman syndrome</b> เสีย NCC ที่ DCT — เหมือน<b>กิน thiazide ตลอดชีวิต</b> จึงได้โพแทสเซียมต่ำและเลือดเป็นด่างเหมือนกัน แต่<b>แคลเซียมในปัสสาวะต่ำ</b>และแมกนีเซียมในเลือดต่ำ ซึ่งเป็นคู่ที่ใช้แยกจาก Bartter ได้ ${S.h}</li>
<li><b>Gordon syndrome</b> กลับทางกัน คือ NCC ทำงานมากเกินจากความผิดปกติของ WNK — ได้ความดันสูง <b>โพแทสเซียมสูง</b> และเลือดเป็นกรด · และเพราะต้นเหตุคือ NCC ที่ทำงานเกิน <b>thiazide จึงรักษาได้ตรงจุด</b> ${S.h}</li></ul>
<h3>Collecting duct</h3><ul>
<li><b>Liddle syndrome</b> — ENaC ทำงานมากเกิน จึงดูดโซเดียมกลับไม่หยุด ได้ความดันสูงกับโพแทสเซียมต่ำ แต่<b>renin และ aldosterone ต่ำ</b> เพราะร่างกายพยายามปิดระบบแล้วแต่ช่องยังเปิดอยู่ · รักษาด้วย <b>amiloride</b> ที่ปิดช่องโดยตรง ไม่ใช่ spironolactone ซึ่งออกฤทธิ์ที่ตัวรับ ${S.h}</li>
<li><b>Nephrogenic diabetes insipidus</b> จากความผิดปกติของ AVPR2 ซึ่งถ่ายทอดแบบ X-linked หรือของ AQP2 — ปัสสาวะมากและ<b>ไม่ตอบสนองต่อ vasopressin</b> ซึ่งเป็นจุดที่แยกจาก central DI ${S.h}</li></ul>
<h3>Proximal tubule</h3><ul>
<li><b>Fanconi syndrome</b> คือการสูญเสียทุกอย่างที่ PT ควรดูดกลับพร้อมกัน ทั้งกลูโคส กรดอะมิโน ฟอสเฟต และไบคาร์บอเนต · สาเหตุทางพันธุกรรมได้แก่ cystinosis และ Dent disease ${S.h}</li>
<li><b>Cystinuria</b> เสียตัวขนส่งที่รับกรดอะมิโนสี่ตัวร่วมกัน และ<b>renal glycosuria</b> เสีย SGLT2 ซึ่งทำให้มีน้ำตาลในปัสสาวะทั้งที่น้ำตาลในเลือดปกติ ${S.h}</li></ul>`});
HS("320","b","cb-na","Sodium & water balance",{
draw:()=>tbl(["Quantity","What it reflects"],[
 ["Plasma Na⁺ = tonicity","สะท้อนสมดุลน้ำ ไม่ใช่ปริมาณ Na⁺ ในร่างกาย"],
 ["ECF volume = total body Na⁺","คุมด้วย RAAS, sympathetic, ANP, pressure natriuresis"],
 ["Vasopressin","osmoreceptor (ไวต่อ ~1–2%) และ baroreceptor → AQP2 ใน CD"],
 ["Thirst","กลไกป้องกัน hypernatremia"]]),
notes:()=>`<h3>Two systems, not one</h3><ul>
 <li>Harrison ย้ำว่ากลไกที่คุม <b>osmoregulation</b> แยกจากกลไกที่คุม <b>extracellular volume</b> แม้จะใช้สรีรวิทยาร่วมกันอยู่บ้าง · การแยกสองเรื่องนี้ออกจากกันคือกุญแจของทั้งบท ${S.h}</li>
 <li>Plasma Na⁺ เป็นเพียง<b>ตัวแทน</b>ของ tonicity ซึ่งเท่ากับจำนวน effective osmole ทั้งตัวหารด้วย total body water · ดังนั้น<b>ความผิดปกติของ Na⁺ ในเลือดคือความผิดปกติของน้ำ ไม่ใช่ของเกลือ</b> ${S.h}</li>
 <li>น้ำในร่างกายเพิ่ม → hyponatremia, hypotonicity, water intoxication (เซลล์บวม) · น้ำลด → hypernatremia, hypertonicity, dehydration (เซลล์เหี่ยว) ทั้งสองทางทำให้เซลล์ทำงานผิดปกติ ${S.h}</li></ul>
 <h3>The water loop</h3><ul>
 <li>Total body water ลดลง → Na⁺ ในเลือดสูงขึ้น → กระหายน้ำทันที พร้อมกับหลั่ง vasopressin จาก posterior pituitary เพื่อลดการขับน้ำ · Na⁺ ต่ำลง → กด vasopressin → ขับน้ำออกมากขึ้น ${S.h}</li>
 <li>Osmoreceptor ไวมาก รับรู้การเปลี่ยนแปลงระดับ 1–2% · tonicity ปกติจึงถูกคุมแคบราว 280 mosmol/L ${S.h}</li></ul>
 <h3>The sodium loop</h3><ul>
 <li>ปริมาตรเลือดนอกเซลล์ถูกคุมด้วย <b>Na⁺ balance</b> โดยมี baroreceptor ในหลอดเลือดและฮอร์โมนเป็นตัวสั่งงาน ได้แก่ ANP, renin–angiotensin–aldosterone, adenosine, vasopressin และระบบ adrenergic ${S.h}</li>
 <li>กินเกลือเกินขับ (positive Na⁺ balance) → ปริมาตรเลือดเพิ่ม → ขับ Na⁺ ทางปัสสาวะมากขึ้นตามสัดส่วน · กลับกันถ้าขับเกินกิน ปริมาตรลด → ไตดูด Na⁺ กลับมากขึ้นและขับออกน้อยลง ${S.h}</li></ul>`});

notes:()=>mc("B9.2.7",1)+`<h3>KDIGO definition</h3><ul><li>Cr เพิ่ม ≥0.3 mg/dL ใน 48 ชม. · หรือ ≥1.5 เท่าของ baseline ใน 7 วัน · หรือ UO &lt;0.5 mL/kg/h นาน &gt;6 ชม. ${S.h}</li>

notes:()=>`<h3>Prerenal azotemia</h3><ul><li>รูปแบบ AKI ที่พบบ่อยที่สุด · เนื้อไตปกติ แก้ได้เมื่อ perfusion กลับมา ${S.h}</li>

 <li>Tubular toxins: aminoglycoside, cisplatin, tenofovir, vancomycin, zoledronate, ethylene glycol, aristolochic acid ${S.h}</li></ul>`});

notes:()=>`<h3>Management by cause</h3><ul><li>Prerenal: แก้ hemodynamics · การตอบสนองต่อการแก้ไขคือการวินิจฉัยที่ดีที่สุด ${S.h}</li>

 <h3>Dialysis</h3><ul><li>ข้อบ่งชี้: volume overload, hyperkalemia, acidosis ที่ medical management ไม่ได้ผล · toxic ingestion บางชนิด · uremic complications (asterixis, pericardial rub/effusion, encephalopathy, uremic bleeding) ${S.h}</li>
 <li>เริ่มเร็วกว่าไม่ได้เพิ่ม survival ใน RCT · หลายคนเริ่มเมื่อ BUN &gt;100 mg/dL และไม่มีสัญญาณฟื้น ${S.h}</li>
 <li>CRRT (CVVH, CVVHD, CVVHDF) เหมาะกับ hemodynamic ไม่เสถียร, cerebral edema · continuous ไม่ดีกว่า intermittent ในด้าน survival ${S.h}</li></ul>`});

notes:()=>mc("B9.2.7",1)+`<h3>นิยาม</h3><ul><li>CKD = ความผิดปกติของโครงสร้างหรือการทำงานของไตนาน &gt;3 เดือน · จัดตาม <b>GFR (G1–G5)</b> และ <b>albuminuria (A1–A3)</b> (Fig 322-1) ${S.h}</li>
 <li>eGFR คำนวณจาก creatinine ± cystatin C (Table 322-3) ${S.h}</li></ul>
 <h3>Progression</h3><ul><li>Nephron ลด → nephron ที่เหลือ hyperfiltration + intraglomerular hypertension → sclerosis (Fig 322-2) ${S.h}</li>
 <li>Risk factors (Table 322-1) และ monogenic loci เช่น APOL1 (Table 322-2) ${S.h}</li></ul>
 <div class="pearl">เลือก G และ A ด้านบนเพื่อดูความเสี่ยง (สีอ้างอิงแบบ KDIGO)</div>`});

notes:()=>mc("B9.2.5",1)+`<h3>Sodium and water</h3><ul>
 <li>ECF ขยายแบบ isonatric ถ้าผู้ป่วยดื่มน้ำไม่เกินความสามารถในการขับ — คือ Na⁺ คั่งแต่ระดับ Na⁺ ในเลือดยังปกติ · จำกัดเกลือคือหัวใจของการรักษา · chlorthalidone ยังใช้ได้แม้ stage 4 ${S.h}</li></ul>
 <h3>Potassium — a treatment dilemma</h3><ul>
 <li>ยาที่ทำให้ K สูงคือยาเดียวกับที่สั่งเพื่อ<b>ชะลอ CKD และปกป้องหัวใจ</b> — RAS inhibitors และ mineralocorticoid antagonist ทั้งชนิด steroidal และ nonsteroidal · จึงเป็นการชั่งน้ำหนัก ไม่ใช่การเลี่ยง ${S.h}</li>
 <li>ก่อนจะหยุดยาเหล่านั้น ให้ไล่แหล่ง potassium ที่ซ่อนอยู่ก่อน โดยเฉพาะ<b>เกลือแกงชนิดลดโซเดียม</b>ที่ใช้โพแทสเซียมแทน และอาหารเสริม ${S.h}</li>
 <li>เครื่องมือที่เหลือ: kaliuretic diuretic ขับ K ทางปัสสาวะ · potassium-binding resin (calcium resonium, sodium polystyrene และตัวใหม่อย่าง patiromer, sodium zirconium cyclosilicate) ขับ K ทางลำไส้ ${S.h}</li>
 <li><b>Intractable hyperkalemia</b> เป็นข้อบ่งชี้หนึ่งในการเริ่ม dialysis ใน CKD แม้จะพบไม่บ่อย ${S.h}</li></ul>
 <h3>Acidosis — treat earlier than you think</h3><ul>
 <li>ไตยังทำปัสสาวะให้เป็นกรดได้ แต่สร้าง ammonia ได้น้อยลง · net acid excretion อาจเหลือ &lt;30–40 mmol/วัน ${S.h}</li>
 <li>ให้ alkali เมื่อ serum bicarbonate ตกต่ำกว่า <b>20–23 mmol/L</b> เพื่อเลี่ยงภาวะ protein catabolic ที่เกิดได้แม้ acidosis จะไม่รุนแรง ${S.h}</li>
 <li>มีการศึกษาที่ชี้ว่าการให้ bicarbonate ใน CKD stage 3–5 สัมพันธ์กับการเข้าสู่ dialysis ช้าลง · แต่ต้องนับ<b>ปริมาณโซเดียม</b>ที่มาพร้อมกันด้วยเมื่อผู้ป่วยมี ECF ขยายอยู่แล้ว ${S.h}</li></ul>`});
HS("322","b","ckd-mbd","CKD–mineral bone disorder",{
draw:()=>flow([["GFR ↓ → phosphate คั่ง","FGF-23 ขึ้นเร็วมาก (osteocytes)","gl"],["Calcitriol ↓","phosphate + FGF-23 ยับยั้ง 1α-hydroxylase","vn"],["Ca²⁺ ↓ + PTH ↑","secondary hyperparathyroidism · Klotho ↓ → FGF-23 ยับยั้ง PTH ไม่ได้","ar"],["High turnover","osteitis fibrosa cystica","ar"],["Low turnover","adynamic bone disease · vascular calcification, calciphylaxis",""]]),
notes:()=>`<h3>The chain that starts with phosphate</h3><ul>
 <li>GFR ตก → ขับ phosphate ได้น้อยลง → <b>phosphate คั่ง</b> ซึ่งเป็นจุดเริ่มของทุกอย่างที่ตามมา ${S.h}</li>
 <li>Phosphate ที่คั่งกระตุ้นให้ osteocyte สร้าง <b>FGF-23</b> มากขึ้น กระตุ้น PTH และกระตุ้นให้ต่อม parathyroid โตขึ้นด้วย ${S.h}</li>
 <li>Ionized calcium ลดลงเพราะไตสร้าง <b>calcitriol</b> ได้น้อยลง — ทั้งจาก phosphate ที่คั่งและจาก FGF-23 ที่สูง ซึ่งยังเร่งการสลาย calcitriol อีกทาง ${S.h}</li>
 <li>Calcitriol ที่ต่ำดัน PTH ขึ้นสองทาง คือผ่าน hypocalcemia และโดยออกฤทธิ์ตรงที่การ transcribe ยีน PTH ${S.h}</li>
 <li>ปกติ FGF-23 จะช่วยยับยั้ง PTH ได้ แต่ฤทธิ์นั้นต้องพึ่ง <b>Klotho</b> ซึ่งลดลงใน CKD เบรกตัวนี้จึงหายไป ${S.h}</li>
 <li>วงจรนี้เริ่มเมื่อ GFR ต่ำกว่า 60 mL/min — บางการศึกษาชี้ว่า phosphate คั่งและ FGF-23 ขึ้นมา<b>ก่อน</b>ที่ GFR จะวัดได้ว่าลดลงเสียอีก ${S.h}</li></ul>
 <h3>Three bone lesions, not one</h3><ul>
 <li><b>High turnover</b> จาก PTH สูง → osteitis fibrosa cystica ซึ่งเป็นรอยโรคคลาสสิกของ secondary hyperparathyroidism ${S.h}</li>
 <li><b>Osteomalacia</b> จากฤทธิ์ vitamin D ที่ลดลง ${S.h}</li>
 <li><b>Adynamic bone disease</b> — turnover ต่ำโดยที่ PTH ต่ำหรือปกติ · พบมากขึ้น โดยเฉพาะในเบาหวานและผู้สูงอายุ · ผู้ป่วยคนเดียวมีหลายแบบผสมกันได้ ${S.h}</li>
 <li>กระดูกที่ turnover ต่ำอาจรับแคลเซียมที่กินเข้าไปไม่ได้ แคลเซียมจึงไปลงที่อื่นแทน ซึ่งเชื่อมกับ<b>vascular calcification</b> ที่พบใน media ของ coronary artery และลิ้นหัวใจ มากกว่าคนที่ไตปกติหลายเท่าตัว ${S.h}</li>
 <li><b>Calciphylaxis</b> เกือบพบเฉพาะในผู้ป่วยไตวายระยะท้าย — หลอดเลือดเล็กมี calcification จนผิวหนังตาย · <b>FGF-23</b> ที่สูงเป็นปัจจัยเสี่ยงอิสระของ LVH ${S.h}</li></ul>
 <h3>Where the drugs act on this chain</h3><ul>
 <li><b>Tenapanor</b> เป็น sodium–proton inhibitor ที่ลดการดูดซึม phosphate ทางลำไส้ ใช้คุม hyperphosphatemia ได้ ${S.h}</li>
 <li><b>Calcitriol</b> กด PTH ทั้งโดยตรงและโดยดัน ionized calcium ขึ้น · แต่ทำให้ hypercalcemia หรือ hyperphosphatemia ได้จากการดูดซึมทางลำไส้ที่เพิ่มขึ้น · analogue อย่าง <b>paricalcitol</b> กด PTH โดยทำให้แคลเซียมสูงน้อยกว่า ${S.h}</li></ul>`});

notes:()=>`<h3>Why intradialytic hypotension happens</h3><ul>
 <li>Hypotension เป็น acute complication ที่พบบ่อยที่สุดของ hemodialysis โดยเฉพาะในผู้ป่วยเบาหวาน ${S.h}</li>
 <li>ปัจจัยที่ทำให้เกิดคือ ดึงน้ำมากเกินโดยที่หลอดเลือด refill ไม่ทัน · การตอบสนองของ autonomic และ vasoactive เสีย · osmolar shift · ใช้ยาลดความดันมากเกิน และ cardiac reserve ที่เหลือน้อย ${S.h}</li></ul>
 <h3>Management and prevention</h3><ul>
 <li>เมื่อเกิดแล้ว: <b>หยุด ultrafiltration</b> แล้วให้ isotonic saline 100–250 mL · salt-poor albumin ใช้ได้แต่มักไม่มีใน outpatient ${S.h}</li>
 <li>ป้องกันโดยประเมิน <b>dry weight</b> ให้แม่น และใช้ ultrafiltration modeling คือ<b>ดึงน้ำมากในช่วงต้นมากกว่าช่วงท้าย</b>ของการฟอก ${S.h}</li>
 <li>เลี่ยงการดึงน้ำเร็วเกิน <b>&gt;13 mL/kg/h</b> ซึ่งสัมพันธ์กับผลลัพธ์ที่แย่รวมถึงการเสียชีวิตจากโรคหัวใจและหลอดเลือด ${S.h}</li>
 <li>วิธีเสริม: ทำ sequential ultrafiltration ก่อนแล้วค่อย dialysis · ลดอุณหภูมิ dialysate · ไม่กินมื้อหนักระหว่างฟอก · midodrine มีผู้แนะนำแต่หลักฐานยังไม่พอจะใช้เป็นกิจวัตร ${S.h}</li></ul>
 <h3>Cramps, reactions, high-output failure</h3><ul>
 <li><b>Muscle cramps</b> สาเหตุยังไม่ชัด แต่มักถูกกระตุ้นเมื่อดึงน้ำเร็วเกินหรือดึงต่ำกว่า dry weight ที่ประเมินไว้ · ป้องกันด้วยการลดปริมาณน้ำที่ดึง, ultrafiltration profiling และ sodium modeling ${S.h}</li>
 <li><b>Anaphylactoid reaction</b> ต่อ dialyzer พบมากที่สุดในการใช้ครั้งแรกและกับ membrane ชนิด bioincompatible ${S.h}</li>
 <li><b>High-output cardiac failure</b> เกิดจากเลือด shunt ผ่าน access · บางรายอาจต้องผูก fistula หรือ graft ทิ้ง ${S.h}</li></ul>`});
HS("323","b","pd","Peritoneal dialysis",{
draw:()=>tbl(["Aspect of peritoneal dialysis","Detail"],[
 ["The principle","ใส่น้ำยา dextrose 1.5–3 L เข้าช่องท้อง · dwell 2–4 ชม. · peritoneum เป็น membrane"],
 ["CAPD","เปลี่ยนเองด้วยมือวันละหลายรอบ + night dwell"],
 ["CCPD / APD","เครื่อง cycler เปลี่ยนตอนกลางคืน"],
 ["Icodextrin","ใช้กับ dwell ที่นานที่สุด (last fill)"],
 ["Peritonitis","WBC ≥100/mm³ และ neutrophil ≥50% · มักจาก sterile technique พลาด"]]),
notes:()=>`<h3>The one difference that explains everything else</h3><ul>
 <li>ใน hemodialysis การกำจัด solute อาศัย<b>ความต่างของความเข้มข้น</b> ส่วนการดึงน้ำอาศัย<b>แรงดันคร่อม membrane</b> · แต่ใน peritoneal dialysis <b>ความ hypertonic ของน้ำยาเป็นตัวขับทั้งสองอย่าง</b> ${S.h}</li>
 <li>ความ hypertonic นั้นมาจาก dextrose — ซึ่งเป็นเหตุผลว่าทำไมภาวะแทรกซ้อนของ PD จึงเป็นเรื่อง metabolic เสียเป็นส่วนใหญ่ ${S.h}</li>
 <li><b>Icodextrin</b> เป็น carbohydrate ที่ไม่ถูกดูดซึม ดึงน้ำได้ดีกว่า dextrose จึงใช้กับ dwell ที่นานที่สุด — last fill ของ CCPD หรือ dwell ยาวของ CAPD ${S.h}</li></ul>
 <h3>Metabolic cost</h3><ul>
 <li>Albumin และโปรตีนอื่นรั่วออกทาง peritoneum ไปพร้อมของเสีย · hypoproteinemia ที่ตามมาบังคับให้ต้อง<b>กินโปรตีนมากขึ้น</b>เพื่อรักษา nitrogen balance ${S.h}</li>
 <li>ร่างกายดูดซึม dextrose หลายร้อยกิโลแคลอรีต่อวัน จึงเกิด hyperglycemia และน้ำหนักขึ้น · ผู้ป่วยเบาหวานยังเสี่ยงต่อผลของ insulin resistance อื่น ๆ เช่น hypertriglyceridemia ${S.h}</li>
 <li>สารที่เติมในน้ำยาบ่อยที่สุดคือ <b>heparin</b> กัน fibrin อุดสาย และ antibiotics ระหว่าง peritonitis · ผู้ป่วยเบาหวานเติม insulin ได้ ${S.h}</li></ul>
 <h3>The catheter and its cuffs</h3><ul>
 <li>สายเป็น silicone rubber มีรูด้านข้างที่ปลาย และมี <b>Dacron cuff สองอัน</b> · แผลเป็นที่เกิดรอบ cuff ทำหน้าที่ยึดสายไว้ กันแบคทีเรียจากผิวหนังไต่เข้าช่องท้อง และกันน้ำยารั่วออกมาข้างนอก ${S.h}</li>
 <li>เกณฑ์ peritonitis (WBC ≥100/mm³, neutrophil ≥50%) ต่ำกว่าเกณฑ์ของ SBP ${S.h}</li></ul>`});

/* ---------- 325 · Transplant ---------- */
HS("325","a","tx-imm","Immunology of rejection",{
draw:()=>tbl(["Type of rejection","Mechanism"],[
 ["Hyperacute","preformed Ab (ABO, anti-HLA) · ป้องกันด้วย ABO matching + crossmatch"],
 ["T cell–mediated","CD4 ตอบสนอง class II (DR) · CD8 ทำลายผ่าน class I (A, B) · ต้องมี costimulation (CD28–CD80/86)"],
 ["Antibody-mediated","donor-specific Ab ต่อ HLA/non-HLA · C4d ใน peritubular capillaries"],
 ["HLA matching","จำนวน mismatch ที่ A, B, DR ยิ่งมากยิ่ง rejection มาก · HLA อยู่บน chromosome 6"]]),
notes:()=>`<h3>Two recognition pathways — unique to transplantation</h3><ul>
 <li><b>Direct pathway</b>: T cell ของผู้รับมอง MHC ของ donor APC ทั้งโมเลกุลเลย — CD4 จับ class II, CD8 จับ class I แล้วกลายเป็น cytotoxic cell · ทางนี้<b>ไม่ใช่</b>วิธีที่ T cell รู้จัก antigen ตามปกติ ${S.h}</li>
 <li><b>Indirect pathway</b>: MHC ของ donor ถูกย่อยเป็น peptide แล้วนำเสนอโดย self-APC ของผู้รับ ซึ่งเป็นกระบวนการปกติทางสรีรวิทยา · การปลูกถ่ายจึงเป็นสถานการณ์เดียวที่มี T cell clone สองชุดทำงานพร้อมกัน ${S.h}</li>
 <li>เมื่อ CD4 helper ถูกกระตุ้นแล้ว มันช่วยทั้ง macrophage, cytotoxic T cell และ B cell ผ่าน cytokine และการสัมผัสโดยตรง ${S.h}</li></ul>
 <h3>Diagnosis and treatment</h3><ul>
 <li><b>Allograft biopsy</b> เป็น gold standard ของทั้ง T cell–mediated และ antibody-mediated rejection · TCMR วินิจฉัยจาก immune cell แทรกใน interstitium, tubule หรือหลอดเลือด ตาม <b>Banff classification</b> ${S.h}</li>
 <li>รักษา TCMR ด้วย methylprednisolone ขนาดสูง 500–1000 mg IV วันละครั้ง 3 วัน · ถ้าไม่ตอบสนองคือข้อบ่งชี้ให้ใช้ antibody therapy ซึ่งมักเป็น ATG ${S.h}</li>
 <li><b>AMR</b>: endothelial injury + C4d ใน peritubular capillaries ร่วมกับ donor-specific antibody ในเลือด · การรักษายังยาก ใช้ plasmapheresis, IVIG, rituximab (B cell) และ bortezomib (plasma cell) ${S.h}</li>
 <li>ตัวช่วยที่ไม่ต้อง biopsy: donor-derived cell-free DNA, urine chemokine เช่น CXCL9 และ urine exosome ${S.h}</li></ul>
 <h3>Screening before transplant</h3><ul>
 <li>Preformed antibodies → <b>hyperacute rejection</b> · คัดกรองด้วย ABO matching และ cytotoxic crossmatch ${S.h}</li>
 <li>Crossmatch ใช้ donor T cells (มี class I) · ไม่ได้บอกความเสี่ยงของ T cell–mediated rejection ${S.h}</li>
 <li>HLA-identical ก็ยัง rejection ได้จาก non-HLA antigens เช่น LIMS-1 ${S.h}</li>
 <li>Graft survival 1 ปี: deceased 94%, living 98% · 5 ปี: 76% และ 87% (Table 325-2) ${S.h}</li></ul>`});
HS("325","a","tx-drug","Maintenance immunosuppression",{
draw:()=>{const R=[["Glucocorticoids","ยับยั้ง transcription ของ IL-1, 2, 3, 6, TNF","HT, glucose, lipid, osteoporosis"],["Cyclosporine","cyclophilin + calcineurin → IL-2 ↓","nephrotoxic, HT, hirsutism, gum hyperplasia"],["Tacrolimus","FKBP-12 + calcineurin","คล้าย CsA · DM มากกว่า · ไม่มี hirsutism"],["Azathioprine","ยับยั้ง purine synthesis","marrow suppression"],["Mycophenolate","ยับยั้ง IMPDH","GI, marrow"],["Sirolimus/everolimus","FKBP-12 → mTOR","lipid, proteinuria, wound healing"],["Belatacept","จับ CD80/86 กัน CD28","PTLD (EBV−)"]];
 let b="";R.forEach(([n,m,s],i)=>{const y=12+i*52;b+=`<rect class="box ${i===1||i===2?"vn":""}" x="10" y="${y}" width="620" height="46" rx="10"/>`+T(22,y+19,n,{a:"start",c:"bh"})+T(22,y+37,m,{a:"start",c:"s"})+T(620,y+28,s,{a:"end",c:"s m"})});return svg(b,"0 0 640 380")},
notes:()=>`<h3>The calcineurin inhibitors</h3><ul>
 <li>ทั้งคู่ทำงานแบบเดียวกันคือสร้าง trimolecular complex แล้วบล็อก calcineurin จนสร้าง cytokine โดยเฉพาะ IL-2 ไม่ได้ — ต่างกันที่โปรตีนที่จับ: cyclosporine จับ <b>cyclophilin</b> ส่วน tacrolimus จับ <b>FKBP-12</b> ${S.h}</li>
 <li>ทั้งคู่ยัง<b>กระตุ้นการสร้าง TGF-β</b> ด้วย ซึ่งเป็นเหตุผลที่ CNI ไม่ได้กดภูมิอย่างเดียวแต่ทิ้ง fibrosis ไว้ในไตด้วย ${S.h}</li>
 <li>ผลข้างเคียงต่างกันพอให้เลือกยา: cyclosporine ให้ <b>hirsutism และเหงือกบวม</b> ซึ่ง tacrolimus แทบไม่ให้ · แต่ tacrolimus ทำให้<b>เป็นเบาหวาน</b>มากกว่า ${S.h}</li>
 <li>Cyclosporine ดูดซึมไม่แน่นอน รูปแบบ microemulsion คาดเดาระดับยาได้ดีกว่า · tacrolimus เป็น macrolide ที่ดูดซึมดี ${S.h}</li></ul>
 <h3>The rest of the toolbox</h3><ul>
 <li><b>Sirolimus/everolimus</b> จับ FKBP-12 เหมือน tacrolimus แต่ไปบล็อก p70 S6 kinase ในเส้นทางหลัง IL-2 receptor จึงหยุดการแบ่งตัวแทนที่จะหยุดการสร้าง cytokine ${S.h}</li>
 <li><b>Azathioprine</b> เป็น prodrug ของ mercaptopurine ยับยั้ง purine synthesis · กดไขกระดูกโดยกระทบ WBC &gt; RBC &gt; platelet ${S.h}</li>
 <li><b>Belatacept</b> จับ CD80/CD86 กัน CD28 คือตัดสัญญาณ costimulation โดยตรง · ราคาที่ต้องจ่ายคือ PTLD ${S.h}</li>
 <li>Steroid ใช้ทั้ง induction และ maintenance — methylprednisolone 250–500 mg ให้ทันทีก่อนหรือขณะผ่าตัด แล้วค่อย taper ${S.h}</li>
 <li>แนวโน้มปัจจุบันคือเลี่ยง steroid ให้เร็วเพื่อลดผลต่อกระดูก ผิวหนังและน้ำตาล · และใช้ mTOR inhibitor มากขึ้นในผู้ที่เป็นมะเร็งผิวหนังซ้ำ ${S.h}</li></ul>`});

draw(){const P={early:["Wound infection","Herpesvirus","Oral candidiasis","UTI"],mid:["Pneumocystis","CMV","Legionella","Listeria","Hepatitis B","Hepatitis C"],late:["Aspergillus","Nocardia","BK virus (polyoma)","Herpes zoster","Hepatitis B","Hepatitis C"]};
 let b="";["early","mid","late"].forEach((k,i)=>{const on=ST.txt===k,x=14+i*208;b+=`<rect class="box ${on?"ar":""}" x="${x}" y="14" width="196" height="40" rx="12"/>`+T(x+98,40,["Peritransplant <1 เดือน","Early 1–6 เดือน","Late >6 เดือน"][i],{c:"bh"});
  P[k].forEach((n,j)=>b+=`<rect class="box" x="${x}" y="${64+j*40}" width="196" height="34" rx="10" style="opacity:${on?1:.45}"/>`+T(x+98,86+j*40,n,{c:"s"}))});
 b+=`<rect class="gsum" x="0" y="320" width="640" height="60" rx="12"/>`+T(16,344,"Malignancy: มะเร็งผิวหนังและริมฝีปากพบบ่อยที่สุด",{a:"start",c:"b"})+T(16,366,"PTLD: เกิดช่วงแรก (<1 ปี) หรือหลัง 7–10 ปี · ส่วนใหญ่สัมพันธ์กับ EBV",{a:"start",c:"s"});return svg(b,"0 0 640 384")},
notes:()=>`<h3>Why the timetable has three windows</h3><ul>
 <li>&lt;1 เดือน: wound, herpesvirus, oral candida, UTI · 1–6 เดือน: <b>PCP, CMV</b>, Legionella, Listeria, HBV, HCV · &gt;6 เดือน: Aspergillus, Nocardia, <b>BK virus</b>, zoster ${S.h}</li></ul>
 <h3>CMV</h3><ul>
 <li>ผู้รับที่ seronegative แต่ได้ไตจาก donor ที่ seropositive เสี่ยงสูงสุด ${S.h}</li>
 <li>อาการมีได้ตั้งแต่ viremia ที่ไม่มีอาการ ไปจนถึง systemic syndrome (ไข้ leukopenia) และโรคเฉพาะอวัยวะ — hepatitis, gastroenteritis, retinopathy ${S.h}</li>
 <li>วินิจฉัยด้วย plasma viral load ร่วมกับ IgM ต่อ CMV ที่ขึ้น · <b>valganciclovir</b> ใช้ได้ทั้งป้องกันและรักษา · HSV ใช้ acyclovir ${S.h}</li></ul>
 <h3>BK virus — a dose problem, not a drug problem</h3><ul>
 <li>BK เป็น polyomavirus ที่หลบอยู่เงียบ ๆ ในไตและ urothelium แล้วตื่นขึ้นเมื่อถูกกดภูมิ · ถ้าปล่อยไว้ จะเกิด fibrosis ลุกลามและเสียไตภายใน 1 ปีในผู้ป่วยส่วนใหญ่ ${S.h}</li>
 <li>แต่เพราะความเสี่ยงผูกกับ<b>ระดับการกดภูมิโดยรวม</b> การจัดการหลักจึงคือตรวจ BK viral load สม่ำเสมอแล้ว<b>ลดยากดภูมิอย่างพอเหมาะ</b> ไม่ใช่เพิ่มยาต้านไวรัส ${S.h}</li>
 <li>Biopsy ช่วยดู interstitial nephritis, tubular cytopathic change และ viral antigen ในไตที่ปลูกถ่าย ${S.h}</li>
 <li>รายที่ยาก มีผู้ลอง leflunomide, cidofovir, quinolone (ออกฤทธิ์ต่อ polyoma helicase) และ IVIG แต่ผลไม่สม่ำเสมอ ${S.h}</li></ul>
 <h3>Malignancy</h3><ul><li>มะเร็งผิวหนังและริมฝีปากพบบ่อยที่สุด · ต้องเฝ้าระวังและกัน UV ${S.h}</li><li><b>PTLD</b>: ส่วนใหญ่ EBV · พยากรณ์แย่ ${S.h}</li></ul>`});

notes:()=>`<h3>Why albumin, not total protein</h3><ul>
 <li>Albumin เป็นเพียง 20–60% ของโปรตีนทั้งหมดในปัสสาวะ แต่เป็นตัวที่รั่วก่อนเมื่อ filtration barrier เริ่มเสีย การวัด albumin จึงไวกว่าการวัด total protein ${S.h}</li>
 <li>Dipstick มองไม่เห็น microalbuminuria เลย — ถ้า dipstick ขึ้น albumin แปลว่าเลยขั้น microalbuminuria ไปแล้ว การคัดกรองจึงต้องใช้ albumin/creatinine ratio (ACR) หรือ radioimmunoassay ${S.h}</li>
 <li>Spot urine ACR &gt;30 mg/g = ต้องตามต่อ · albumin &gt;300 mg/24 h = frank proteinuria ซึ่งบอกว่าโรคไปไกลแล้ว ${S.h}</li></ul>
 <h3>Benign proteinuria vs real disease</h3><ul>
 <li><b>Transient (functional) proteinuria</b>: ไม่ต่อเนื่อง มักน้อยกว่า 1 g/24 h — ไข้ ออกกำลังกาย obesity, sleep apnea, ความเครียด และ heart failure อธิบายได้หมด ${S.h}</li>
 <li><b>Orthostatic proteinuria</b> (เจอเฉพาะตอนยืน) พยากรณ์โรคดี · แต่ isolated proteinuria ที่ยังอยู่ข้ามการมาตรวจหลายครั้ง เจอได้ใน glomerular lesion หลายชนิด ${S.h}</li>
 <li>Proteinuria ที่คงอยู่ &gt;1–2 g/24 h มักหมายถึงโรคที่ glomerulus · คนไข้มักไม่รู้ตัวจนกว่าจะบวมหรือเห็นปัสสาวะเป็นฟอง ${S.h}</li></ul>
 <h3>Screening in diabetes</h3><ul>
 <li>Microalbuminuria โผล่ 5–10 ปีหลังเริ่มเป็นเบาหวาน แล้วใช้เวลาอีก 5–10 ปีจึงกลายเป็น proteinuria พร้อม GFR ตก — แต่บางรายถอยกลับไปเป็น normoalbuminuria ได้ ${S.h}</li>
 <li>Type 1 เริ่มตรวจ 5 ปีหลังวินิจฉัยแล้วตรวจทุกปี · type 2 ตรวจตั้งแต่วันวินิจฉัยแล้วตรวจทุกปี ${S.h}</li>
 <li>Albuminuria เป็นตัวทำนาย GFR ตกเร็วที่ดีที่สุดเพียงตัวเดียว · ถ้ารักษาแล้ว albuminuria ลดลง ถือเป็นสัญญาณพยากรณ์โรคที่ดี ${S.h}</li></ul>`});

 <h3>Definitions that separate the groups</h3><ul>
 <li><b>Acute nephritic</b>: proteinuria 1–2 g/24 h + hematuria ที่มี RBC casts + pyuria + hypertension + คั่งน้ำ + creatinine ขึ้น · ถ้า creatinine ขึ้นเร็วเป็นสัปดาห์ = RPGN ซึ่งมี crescentic GN เป็นภาพพยาธิวิทยาคู่กัน ${S.h}</li>
 <li><b>Pulmonary–renal</b>: GN ที่มาพร้อม lung hemorrhage — Goodpasture, ANCA-associated vasculitis, lupus, cryoglobulinemia ${S.h}</li>
 <li><b>Nephrotic</b>: proteinuria &gt;3 g/24 h + hypertension + hypercholesterolemia + hypoalbuminemia + edema/anasarca + microscopic hematuria · ถ้ามีแต่โปรตีนรั่วมากโดยไม่มีอย่างอื่น เรียกเพียง nephrotic-range proteinuria ${S.h}</li>
 <li><b>Basement membrane</b>: GBM ผิดปกติโดยพันธุกรรม (Alport) หรือโดย autoimmune (anti-GBM) ${S.h}</li></ul>
 <h3>Clues from the sediment</h3><ul>
 <li>RBC เพียง 3–5 ตัวใน spun sediment ของปัสสาวะเช้าแรกก็น่าสงสัยแล้ว · gross hematuria พบน้อยมาก ยกเว้น IgA nephropathy และ sickle cell disease ${S.h}</li>
 <li>Microscopic hematuria ที่มี proteinuria น้อยกว่า 500 mg/24 h ต้องตัดรอยโรคทางกายวิภาคออกก่อน โดยเฉพาะมะเร็งทางเดินปัสสาวะในผู้ชายสูงอายุ ${S.h}</li>
 <li>PSGN และ MPGN มี pyuria ได้มาก ต้องแยกจากปัสสาวะที่ติดเชื้อ ${S.h}</li></ul>

notes:()=>mc("B9.2.1",3)+`<h3>สาเหตุ</h3><ul>
<li>พบ <b>1 ใน 400 ถึง 1 ใน 1,000 ของทารกเกิดมีชีพ</b> ทุกเชื้อชาติ และเป็นต้นเหตุของ <b>ESRD ที่ต้องฟอกเลือดราว 5–10% ของทั้งหมด</b> จึงไม่ใช่โรคหายาก ${S.r}</li>
<li><b>PKD1 บนโครโมโซม 16p13.3</b> คิดเป็นราว <b>85%</b> ของผู้ป่วย สร้าง <b>polycystin-1</b> ซึ่งเป็นโปรตีนขนาดใหญ่ 460 kD ฝังอยู่ในเยื่อหุ้มเซลล์ มีส่วนยื่นออกนอกเซลล์ยาวสำหรับจับกับเซลล์ข้างเคียงและกับ extracellular matrix ${S.r}</li>
<li><b>PKD2 บนโครโมโซม 4q21</b> เป็นสาเหตุของผู้ป่วยที่เหลือ สร้าง <b>polycystin-2</b> ซึ่งเป็น<b>ช่องไอออนที่ยอมให้ Ca²⁺ ผ่าน</b> พบได้ในทุกส่วนของท่อไต ${S.r}</li></ul>
<h3>พยาธิกำเนิด</h3><ul>
<li>เซลล์เยื่อบุท่อไตแต่ละเซลล์มี <b>primary cilium</b> หนึ่งเส้น ยาว 2–3 ไมโครเมตร ยื่นเข้าไปในรูท่อ ทำหน้าที่เป็น<b>ตัวรับแรง</b> คอยวัดการไหลของน้ำปัสสาวะและแรงเฉือนที่ผิวเซลล์ ${S.r}</li>
<li><b>polycystin-1 และ polycystin-2 อยู่ด้วยกันบน cilium นี้</b> และทำงานเป็นคู่ — เมื่อน้ำไหลผ่านทำให้ cilium โค้งงอ ช่อง Ca²⁺ จะเปิดและ Ca²⁺ ไหลเข้าเซลล์ ซึ่งเป็นสัญญาณที่กำหนดทิศทางของเซลล์และควบคุมไม่ให้แบ่งตัวเกิน ${S.r}</li>
<li>เมื่อยีนใดยีนหนึ่งเสีย <b>สัญญาณ Ca²⁺ ที่เกิดจากการไหลหายไป</b> เซลล์ท่อไตจึงแบ่งตัวผิดทิศและหลั่งสารเข้าไปในรูท่อ ท่อค่อย ๆ โป่งออกจนหลุดจาก nephron กลายเป็นถุงน้ำที่โตขึ้นเรื่อย ๆ ${S.r}</li>
<li>หลักฐานที่หนุนสมมติฐานนี้คือยีนอื่นที่ทำให้เกิดถุงน้ำในไต เช่นกลุ่ม nephrocystin ก็สร้างโปรตีนที่อยู่บน cilium หรือ basal body เช่นกัน ${S.r}</li></ul>
<h3>พยาธิสรีรวิทยาและอาการ</h3><ul>
<li>ถุงน้ำที่โตขึ้นเบียดเนื้อไตที่ยังดีอยู่ แต่<b>ยังมี nephron ที่ทำงานได้แทรกอยู่ระหว่างถุงน้ำ</b> ผู้ป่วยจำนวนมากจึง<b>ไม่มีอาการจนกระทั่งไตเริ่มวาย</b> ${S.r}</li>
<li>อาการที่พาผู้ป่วยมาพบแพทย์คือ<b>ปวด</b> จากเลือดออกในถุงน้ำหรือถุงน้ำที่โตขึ้น และ<b>ปวดบิดแบบนิ่ว</b>เมื่อก้อนเลือดถูกขับออกมาตามทางเดินปัสสาวะ ${S.r}</li>
<li><b>ไตโตจนคลำได้</b>ทางหน้าท้อง · <b>ความดันโลหิตสูงมาก่อนที่ GFR จะลด</b> เพราะถุงน้ำกดหลอดเลือดจนเกิดภาวะขาดเลือดเฉพาะที่และกระตุ้นระบบ renin ${S.h}</li>
<li>โปรตีนในปัสสาวะมักไม่เกิน 2 กรัมต่อวัน จึงไม่ใช่โรคของ glomerulus · ปัสสาวะมากเพราะไตเสียความสามารถในการเข้มข้นปัสสาวะ ${S.r}</li>
<li><b>อาการนอกไต</b> — ถุงน้ำที่ตับพบบ่อยที่สุดแต่ไม่ทำให้ตับวาย · <b>intracranial aneurysm</b> พบมากกว่าคนทั่วไป 4–5 เท่า · diverticula ของลำไส้ · ไส้เลื่อน ${S.h}</li></ul>
<h3>การพยากรณ์โรคและการวินิจฉัย</h3><ul>
<li><b>ชนิดของยีนบอกเวลาที่ไตจะวาย</b> — PKD1 มีโอกาสไตวายน้อยกว่า 5% เมื่ออายุ 40 ปี แต่เพิ่มเป็นมากกว่า 35% ที่อายุ 50 ปี มากกว่า 70% ที่ 60 ปี และมากกว่า 95% ที่ 70 ปี ส่วน <b>PKD2 ช้ากว่าราวสิบปี</b> คือน้อยกว่า 5% ที่อายุ 50 ปี 15% ที่ 60 ปี และ 45% ที่ 70 ปี ${S.r}</li>
<li>วินิจฉัยด้วย<b>อัลตราซาวด์ร่วมกับอายุ</b> — อายุ 30–59 ปีต้องมีถุงน้ำอย่างน้อย 2 ถุงในไตแต่ละข้าง และอายุ 60 ปีขึ้นไปต้องมีอย่างน้อย 4 ถุงแต่ละข้าง · ถ้าอายุ 30–59 ปีแล้วไม่ถึงเกณฑ์นี้ <b>ตัดโรคออกได้</b> ${S.h}</li>
<li>การติดเชื้อในถุงน้ำและ pyelonephritis มักเกิดจากแบคทีเรียแกรมลบ และต้องใช้ยาที่ซึมเข้าถุงน้ำได้ ${S.h}</li>
<li><b>Tolvaptan</b> ยับยั้ง vasopressin V2 receptor ทำให้ cAMP ในเซลล์ท่อไตลดลง ถุงน้ำจึงโตช้าลงและชะลอการเสื่อมของไต ${S.h}</li></ul>`});
