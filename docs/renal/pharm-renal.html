<div class="wrap">
  <header class="sb-hero">

    <div class="sb-sources"><span class="sb-src"><i class="katzung">K</i>Katzung 16e · Ch 15, 11</span><span class="sb-src"><i class="pt">PT</i>Pharmacotherapy 5e · Ch 25–28</span><span class="sb-src"><i class="gen">Gen</i>ความรู้ทั่วไปที่ใช้เติม</span></div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true"><div class="bar"><b id="lbt"></b><button type="button" id="zo" aria-label="Zoom out">−</button><button type="button" id="zi" aria-label="Zoom in">+</button><button type="button" id="lbx" aria-label="Close">✕</button></div><div class="sc" id="lbsc"><img id="lbi" alt=""></div></div>
<script>
/* ================= helpers ================= */
const T=(x,y,s,o={})=>`<text class="t${o.c?" "+o.c:""}" x="${x}" y="${y}" text-anchor="${o.a||"middle"}"${o.s?` font-size="${o.s}"`:""}${o.r?` transform="rotate(${o.r} ${x} ${y})"`:""}>${s}</text>`;
const TL=(x,y,ls,o={})=>ls.map((l,i)=>T(x,y+i*(o.lh||14),l,o)).join("");
const LD=(x1,y1,x2,y2)=>`<path class="ld" d="M${x1},${y1} L${x2},${y2}"/><circle class="ldd" cx="${x1}" cy="${y1}" r="1.8"/>`;
const F=(c,d,x="")=>`<path class="f ${c}" d="${d}" ${x}/>`;
const V=(c,d,w,x="")=>`<path class="vo" d="${d}" stroke-width="${w+2.2}" ${x}/><path class="v ${c}" d="${d}" stroke-width="${w}" ${x}/>`;
const C=(c,cx,cy,r)=>`<circle class="f ${c}" cx="${cx}" cy="${cy}" r="${r}"/>`;
const E=(c,cx,cy,rx,ry,rot=0)=>`<ellipse class="f ${c}" cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"${rot?` transform="rotate(${rot} ${cx} ${cy})"`:""}/>`;
function sm(p,closed=true){const n=p.length,Q=i=>p[(i+n)%n];let d=`M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;const last=closed?n:n-1;
 for(let i=0;i<last;i++){const a=closed?Q(i-1):p[Math.max(i-1,0)],b=Q(i),c=closed?Q(i+1):p[Math.min(i+1,n-1)],e=closed?Q(i+2):p[Math.min(i+2,n-1)];
  d+=` C${(b[0]+(c[0]-a[0])/6).toFixed(1)},${(b[1]+(c[1]-a[1])/6).toFixed(1)} ${(c[0]-(e[0]-b[0])/6).toFixed(1)},${(c[1]-(e[1]-b[1])/6).toFixed(1)} ${c[0].toFixed(1)},${c[1].toFixed(1)}`}
 return d+(closed?"Z":"")}
function rot(p,cx,cy,a){const c=Math.cos(a),s=Math.sin(a);return p.map(([x,y])=>[cx+(x-cx)*c-(y-cy)*s,cy+(x-cx)*s+(y-cy)*c])}
/* kidney bean: hilum on side (+1 right, -1 left), tilt in radians */
function beanPts(cx,cy,w,h,side=1,tilt=0,n=26){const p=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2,ca=Math.cos(a),sa=Math.sin(a);let x=cx+ca*w/2,y=cy+sa*h/2;
  if(ca*side>.55&&Math.abs(sa)<.5){x-=side*w*.2*(1-Math.abs(sa)/.5)}p.push([x,y])}return rot(p,cx,cy,tilt)}
const bean=(...a)=>sm(beanPts(...a));
const mir=(p,X=640)=>p.map(([x,y])=>[X-x,y]);
const DEFS=`<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--sb-ink2)"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--sb-ink2)"/></marker><linearGradient id="phg" x1="0" x2="1"><stop offset="0" stop-color="#ef4444"/><stop offset=".45" stop-color="#22c55e"/><stop offset=".55" stop-color="#22c55e"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs>`;
const svg=(body,vb="0 0 640 520")=>`<svg viewBox="${vb}" role="img" xmlns="http://www.w3.org/2000/svg">${DEFS}${body}</svg>`;



const PHARM={"sys": "Renal"};
/* ================= pharmacology core (shared by every pharmacology atlas) ================= */
const S={k:'<b class="sbb katzung">K</b>',p:'<b class="sbb pt">PT</b>',x:'<b class="sbb gen">Gen</b>'};
const LEG={ag:["Agonist / activator","--d-ag"],bl:["Antagonist / blocker","--d-bl"],inh:["Enzyme / transporter inhibitor","--d-inh"],mab:["Monoclonal antibody","--d-mab"],st:["Steroid / hormone","--d-st"],mod:["Other / modulator","--d-mod"]};
let ST={labels:true,all:false};
let HL=[];
const SEC=[],GN={};
const on=k=>ST.all||HL.includes(k);
const tbl=(h,rows)=>`<table>${h?`<tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>`:""}${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</table>`;
function wrapT(x,y,s,n,c,lh=16,a="start"){const w=String(s).split(" ");const L=[];let cur="";w.forEach(t=>{if((cur+" "+t).trim().length>n&&cur){L.push(cur);cur=t}else cur=(cur+" "+t).trim()});if(cur)L.push(cur);
 return L.map((l,i)=>T(x,y+i*lh,l,{a,c})).join("")}
/* gradients + soft shadow/glow used by every target map */
const GR=(id,a,b,r)=>r?`<radialGradient id="${id}" cx=".38" cy=".32" r=".85"><stop offset="0" style="stop-color:var(${a})"/><stop offset="1" style="stop-color:var(${b})"/></radialGradient>`

SEC.push({id:"sglt2",k:"b",t:"SGLT2 inhibitors",mm:"SGLT2 inhibitors",drugs:"dapagliflozin · empagliflozin · canagliflozin",act:["inh"],tools:NT,leg:["inh"],draw:NMAP(["sglt2"]),

SEC.push({id:"osmotic",k:"b",t:"Osmotic diuretics",mm:"Osmotic diuretics",drugs:"mannitol",act:["mod"],tools:NT,leg:["mod"],draw:NMAP(["osm"]),

SEC.push({id:"loop",k:"b",t:"Loop diuretics",mm:"Loop diuretics",drugs:"furosemide · bumetanide · torsemide · ethacrynic acid",act:["inh"],tools:NT,leg:["inh"],draw:NMAP(["nkcc2"]),

 <h3>ADR</h3><ul><li><b>Hypokalemic metabolic alkalosis</b> · hypomagnesemia · hyperuricemia/gout · dehydration ${S.k}</li><li><b>Ototoxicity</b> (NKCC1 ในหูชั้นใน) โดยเฉพาะร่วม aminoglycoside ${S.k}</li><li>Sulfonamide allergy (rash, interstitial nephritis) · ใช้ ethacrynic acid แทน ${S.k}</li></ul>

SEC.push({id:"thiazide",k:"b",t:"Thiazides",mm:"Thiazides",drugs:"hydrochlorothiazide · chlorthalidone · indapamide · metolazone",act:["inh"],tools:NT,leg:["inh"],draw:NMAP(["ncc"]),

SEC.push({id:"ksparing",k:"b",t:"K⁺-sparing diuretics",mm:"K⁺-sparing diuretics",drugs:"spironolactone · eplerenone · finerenone · amiloride · triamterene",act:["bl"],tools:NT,leg:["bl"],draw:NMAP(["enac","mr"]),

 <li>แก้ hypokalemia จาก loop/thiazide · <b>Liddle syndrome</b> → amiloride · Li⁺-induced NDI → amiloride ${S.k}</li><li>Spironolactone: acne, female-pattern hair loss · finerenone ลด albuminuria ใน CKD + DM ${S.k}</li></ul>
 <h3>ADR</h3><ul><li><b>Hyperkalemia</b> (เสี่ยงมากในไตเสื่อม หรือใช้ร่วม ACEi, ARB, β-blocker, NSAID, aliskiren) ${S.k}</li><li>Hyperchloremic metabolic acidosis (คล้าย type IV RTA) ${S.k}</li>
 <li>Spironolactone: <b>gynecomastia</b>, impotence (anti-androgen) · eplerenone ไม่มี ${S.k}</li><li>Triamterene: นิ่ว, AKI เมื่อใช้ร่วม indomethacin ${S.k}</li></ul>
 <div class="pearl">หยุด oral K⁺ เมื่อเริ่ม K⁺-sparing · eplerenone ระดับสูงขึ้นมากกับ CYP3A4 inhibitor ${S.k}</div>`});

SEC.push({id:"adh",k:"c",t:"ADH antagonists & agonists",mm:"ADH drugs (vaptans · DDAVP)",drugs:"tolvaptan · conivaptan · desmopressin · demeclocycline",act:["bl","ag"],tools:NT,leg:["bl","ag"],draw:NMAP(["v2","v2d"]),

SEC.push({id:"raas",k:"c",t:"ACE inhibitors, ARBs & aliskiren (kidney)",mm:"RAAS blockers",drugs:"enalapril · lisinopril · losartan · valsartan · aliskiren",act:["bl","inh"],tools:NT,leg:["bl"],draw:NMAP(["at1"]),

 <div class="pearl">ทุกตัวยกเว้น lisinopril เป็น prodrug · ACEi ส่วนใหญ่ขับทางไต (ยกเว้น fosinopril, moexipril) → ลดขนาด ${S.k}</div>`});

SEC.push({id:"resist",k:"d",t:"Diuretic combinations & resistance",mm:"Combos & resistance",drugs:"metolazone · chlorothiazide IV",act:["inh"],leg:[],

notes:()=>`<h3>Phosphate binders (กินพร้อมอาหาร)</h3>${tbl(["กลุ่ม","จุดเด่น · ข้อเสีย"],[["Calcium acetate/carbonate","ถูก · Ca²⁺ สูง, vascular calcification"],["Sevelamer","ไม่มี Ca/Al · ลด LDL · GI ADR"],["Lanthanum","ไม่มี Ca · คลื่นไส้"],["Ferric citrate, sucroferric oxyhydroxide","iron-based · pill น้อยกว่า"],["Aluminum","ไม่ใช้ระยะยาว: encephalopathy, bone disease"]])}${S.p}
 <h3>Vitamin D</h3><ul><li>G3: ergocalciferol/cholecalciferol · G4–5: <b>activated</b> (calcitriol, doxercalciferol, paricalcitol) ลด PTH ${S.p}</li><li>เพิ่มการดูดซึม Ca และ PO₄ → hypercalcemia/hyperphosphatemia · ต้องให้ Ca, PO₄ ปกติก่อน ${S.p}</li></ul>
 <h3>Calcimimetics</h3><ul><li>เพิ่มความไวของ CaSR ที่ parathyroid → PTH ↓ และ Ca²⁺ ↓ · ใช้เมื่อ Ca/PO₄ สูง หรือใช้ vitamin D ไม่ได้ ${S.p}</li><li>Cinacalcet: คลื่นไส้อาเจียน · etelcalcetide IV หลัง HD · ระวังชัก (Ca ต่ำ) ${S.p}</li></ul>`});

SEC.push({id:"hyperk",k:"f",t:"Hyperkalemia & hypokalemia",mm:"K⁺ disorders",drugs:"calcium chloride · insulin · albuterol · patiromer · KCl",act:["mod","ag"],leg:[],
draw:()=>flowD([["1 · Stabilize myocardium","K⁺ >7 หรือ ECG เปลี่ยน → calcium IV · onset 1–2 นาที อยู่ 10–30 นาที","ar"],["2 · Shift K⁺ เข้าเซลล์","insulin + dextrose (30 นาที, 2–6 ชม.) · albuterol ขนาดสูง · ± NaHCO₃","gl"],["3 · เอา K⁺ ออกจากร่างกาย","loop diuretic · SPS · patiromer · dialysis","vn"],["Hypokalemia: KCl","IV >10 mEq/hr ต้อง monitor ECG · สูงสุด 40 mEq/hr ทาง central line",""]]),
notes:()=>`<h3>Hyperkalemia 3 ขั้น</h3><ul><li><b>Calcium</b> (เช่น CaCl₂ 1 g) ไม่ได้ลด K⁺ แค่กัน arrhythmia · ระวัง hypercalcemia เมื่อให้ซ้ำ ${S.p}</li><li><b>Insulin + dextrose</b>: D50 25 g หรือ D10 + regular insulin 20 units · onset 30 นาที ${S.p}</li>
 <li>ขั้น 1–2 เป็นแค่ซื้อเวลา ต้องตามด้วยการขับ K⁺ ${S.p}</li><li><b>Sodium polystyrene sulfonate</b> 15–60 g/วัน · <b>colonic necrosis</b> (โดยเฉพาะกับ sorbitol) ${S.p}</li><li><b>Patiromer</b>: ใช้แบบไม่เร่งด่วน ผู้ป่วยนอก ${S.p} · sodium zirconium cyclosilicate ${S.k}</li></ul>
 <h3>ยาที่ทำให้ K⁺ สูง</h3><ul><li>K⁺-sparing, ACEi/ARB, aliskiren, β-blocker, NSAID โดยเฉพาะในไตเสื่อม ${S.k}</li></ul>
 <h3>Hypokalemia</h3><ul><li>สาเหตุยา: loop, thiazide, CA inhibitor, β₂ agonist ${S.k}</li><li>KCl IV: เกิน 10 mEq/hr ต้อง cardiac monitor · ความเข้มข้นสูงสุด 80 mEq/L ทาง central line ${S.p}</li></ul>`});

SEC.push({id:"sodium",k:"f",t:"Hyponatremia & hypernatremia",mm:"Na⁺ disorders",drugs:"3% NaCl · tolvaptan · conivaptan · 0.9% NaCl",act:["mod","bl"],leg:[],
draw:()=>cards([["Hypovolemic hyponatremia","ให้ Na⁺ + น้ำ (0.9% NaCl) · คำนวณ Na⁺ deficit","vn"],["Euvolemic (SIADH) / hypervolemic","จำกัดน้ำ → vaptan (tolvaptan เริ่มใน รพ.) · demeclocycline","gl"],["Severe: Na⁺ <110 หรือชัก/โคม่า","3% NaCl · คำนวณ Na⁺ ที่จะเปลี่ยนต่อ 1 L","ar"],["Hypernatremia","คำนวณ TBW deficit · ให้ hypotonic fluid ใน 48–72 ชม.",""],["ห้ามแก้เร็ว","hyper: ≤0.5 mEq/L/hr (≤6–8/24 ชม.) → cerebral edema","ar"]]),
notes:()=>`<h3>Hyponatremia</h3><ul><li>Hypertonic saline ใช้เมื่อ Na⁺ &lt;110 และ/หรือมีอาการรุนแรง ${S.p}</li><li><b>Tolvaptan</b>: Na⁺ &lt;125 หรือมีอาการและจำกัดน้ำไม่ได้ผล · เริ่ม 15 mg ปรับถึง 60 mg · boxed warning เริ่มใน รพ. ${S.p}</li>
 <li>Conivaptan IV · ห้ามใช้ vaptan ใน hypovolemic ${S.p}</li><li>Thiazide เป็นสาเหตุที่พบบ่อยของ hyponatremia ใน รพ. ${S.k}</li></ul>
 <h3>Hypernatremia</h3><ul><li>สาเหตุ: เสียน้ำ, mannitol, DI (lithium, phenytoin), hypertonic saline เกิน ${S.p}</li><li>แก้เร็วเกิน → <b>cerebral edema</b>, ตาย ${S.p}</li></ul>
 <div class="pearl">แก้ hyponatremia เรื้อรังเร็วเกิน → osmotic demyelination ${S.x}</div>`});

SEC.push({id:"acidbase",k:"f",t:"Acid–base: drug therapy",mm:"Acid–base drugs",drugs:"sodium bicarbonate · citrate · acetazolamide",act:["mod","inh"],leg:[],
draw:()=>cards([["Metabolic acidosis: แก้ต้นเหตุก่อน","lactic, ketoacidosis มักไม่ต้องให้ NaHCO₃","vn"],["NaHCO₃ เมื่อ","pH <7.15 หรือไตสร้าง HCO₃⁻ ไม่ได้ · ไตวาย, RTA, ethylene glycol, methanol, salicylate","gl"],["ให้แค่ครึ่ง deficit","เป้า HCO₃⁻ >10 · ระวัง volume overload, Na⁺↑, K⁺↓, Ca²⁺↓","ar"],["Chronic acidosis","K citrate/citric acid หรือ Na citrate/citric acid",""],["Metabolic alkalosis","saline-responsive → NaCl + K⁺ · ต้องขับต่อ → acetazolamide 250 mg q6–12h","vn"]]),
notes:()=>`<h3>Metabolic acidosis</h3><ul><li>บทบาทของ NaHCO₃ ยังถกเถียง · ใช้เมื่อ pH &lt;7.15 หรือไตสร้าง HCO₃⁻ ไม่ได้ ${S.p}</li><li>HCO₃⁻ deficit = [(2.4/HCO₃⁻) + 0.4] × น้ำหนัก × ΔHCO₃⁻ · ให้ไม่เกินครึ่งก่อน ติดตาม blood gas ${S.p}</li><li>THAM เลิกผลิตในสหรัฐ (2016) ${S.p}</li></ul>
 <h3>Metabolic alkalosis</h3><ul><li>Saline-responsive (diuretic, อาเจียน): NaCl + K⁺ · saline-resistant: แก้ mineralocorticoid excess ${S.p}</li><li><b>Acetazolamide</b> สำหรับคนที่ยังต้องขับน้ำแต่ HCO₃⁻ สูงขึ้น · ค่อย ๆ ได้ผล ไม่ใช่แก้เฉียบพลัน ${S.p}${S.k}</li></ul>
 <h3>ยาที่ทำให้เกิด</h3><ul><li>Acidosis: CA inhibitor, K⁺-sparing · alkalosis: loop, thiazide, corticosteroid ${S.k}${S.p}</li></ul>`});

 const subs=[...document.querySelectorAll(`#notes-${cur.id} h3`)].map(h=>[h.id,h.textContent]);
 return (withHead?`<div class="dh2"><b>สารบัญ</b><button type="button" id="dclose" aria-label="Close">✕</button></div>`:"")+
 `<div class="prog"><i><b style="width:${n/SEC.length*100}%"></b></i>${n}/${SEC.length} หัวข้อ</div>`+
 GROUPS.map(gk=>{const list=SEC.filter(s=>s.k===gk),open=OPEN[gk]??(gk===cur.k);
  return `<div class="g" data-open="${open}"><button class="gh" type="button" data-g="${gk}"><span class="cv">▶</span>${GN[gk]||gk}<span class="n">${list.filter(s=>SEEN[s.id]).length}/${list.length}</span></button>
  <ul>${list.map(s=>`<li><a href="#${s.id}" data-id="${s.id}" aria-current="${s===cur}"><span class="ck${SEEN[s.id]?" on":""}">✓</span>${s.t}</a>${s===cur&&subs.length>1?`<ol>${subs.map(([id,tx])=>`<li><a href="#${s.id}" data-sub="${id}">${tx}</a></li>`).join("")}</ol>`:""}</li>`).join("")}</ul></div>`}).join("")}
function wireToc(root){root.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{const g=b.dataset.g,el=b.parentElement;OPEN[g]=el.dataset.open!=="true";el.dataset.open=OPEN[g]});

 const i=SEC.indexOf(cur),list=SEC.filter(s=>s.k===cur.k);$("#mgrp").textContent=`${GN[cur.k]||cur.k} · ${list.indexOf(cur)+1}/${list.length}`;$("#mtop").textContent=cur.t;$("#mprev").disabled=i===0;$("#mnext").disabled=i===SEC.length-1;
 const a=$("#side").querySelector('[aria-current="true"]');if(a){const r=a.getBoundingClientRect(),sr=$("#side").getBoundingClientRect();if(r.top<sr.top||r.bottom>sr.bottom)a.scrollIntoView({block:"nearest"})}}

function fixTools(s){(s.tools||[]).forEach(([k,o])=>{if(Array.isArray(o)&&!o.some(v=>v[0]===ST[k]))ST[k]=o[0][0]})}
function tools(s){const el=document.getElementById("tools-"+s.id);if(!el)return;const tl=[["labels","Labels"]].concat((s.tools||[]).filter(t=>!Array.isArray(t[1])));
 let h=tl.map(([k,l])=>`<button class="sb-chip" type="button" data-t="${k}" aria-pressed="${!!ST[k]}">${l}</button>`).join("");
 (s.tools||[]).filter(t=>Array.isArray(t[1])).forEach(([k,opts])=>{h+=`<span class="segc">`+opts.map(([v,l])=>`<button class="sb-chip" type="button" data-s="${k}" data-v="${v}" aria-pressed="${ST[k]===v}">${l}</button>`).join("")+`</span>`});
 el.innerHTML=h;const prev=cur;cur=s;if(s.ctrl){el.insertAdjacentHTML("beforeend",s.ctrl());if(s.wire)s.wire()}cur=prev;
 el.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ST[b.dataset.t]=!ST[b.dataset.t];SEC.filter(x=>x.k===s.k).forEach(draw)});
 el.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{ST[b.dataset.s]=b.dataset.v;draw(s)})}

function renderGroup(gk){GRP=gk;document.querySelector(".shell").classList.toggle("ov",gk==="0");const list=SEC.filter(s=>s.k===gk),gi=GROUPS.indexOf(gk);
 $("#flow").innerHTML=(gk==="0"?"":`<header class="ghead"><small>${GROUPS.length>1?`ส่วนที่ ${gi+1}/${GROUPS.length} · `:""}${list.length} หัวข้อ</small><h2>${GN[gk]||gk}</h2><div class="gchips">${list.map(s=>`<a href="#${s.id}" data-jump="${s.id}">${s.t}</a>`).join("")}</div></header>`)+list.map(topicHTML).join("");
